tudio-replay/replay.mts` 380 条离线门禁不误删；    - 按你 2026-11-25 拍板的交互方案，在「设置 › 评测」单独新建一页按需懒加载的图形化评测管理后台（和命令行 `pnpm eval:run` 共用同一套 `system.evaluation` 公开动作，零主首屏负担）：支持在网页上直接点按钮跑样本集、看新旧版本分数对比、查看实验记忆账本表格、点进具体失分题追溯原始证据并记下你的人工复核结论；    - 同时冻好跨批共用的标准考题库（周报双项目样本、`62-1A` 工具发现样本、无 Goals 后台任务与 Goals 要求认可样本、智能呈现样本，以及直接交给下一批 `63A` 做前后对照的「记错偏好→换会话纠正→整理后复测」记忆样本）。","ask":"在 `63-2` 开工前看一次「设置 › 评测」图形化管理后台的样稿并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/63.md","items":[{"id":"1","anchor":"batch-63-item-1","t":"`63-1` · Piece 0 观测埋点补齐与批量证据读取合同（PR 1，不必等 `62`）","d":"① 补接观测断链：`prologue-run-observation.ts` 补接 7 类当前丢弃的上游事件（`model-response-repair`、`endedOnPromise`、`memory-context`、`memory-recalled.retrieval.{attempts,cost}`、`steer-*`、`compaction-started`、`run-recovered`）；`agent.model` 直接消费 `91-2` 已入库的 `ModelRequestObserved` 补记 `ttft_ms`、`duration_ms`、`prompt_prefix_hash` 与跨供应商归一的 `prompt_includes_cache`；打通 `agent.tool` ↔ `action.call` 双向关联（`run_id` + `tool_call_id` + 可读 `capability_id@version`）并补守 `S-18` 的结构化 `failure_class`；补齐助理 `agent.skill` 完整阶段（`offered`／`selected`／`rejected_over_limit`／`effective`）与超预算材料裁切归因（`assistant-round-materials.ts` 30 条上限锚定已随 `#2301` 落地）；直接消费 `104-1` 在 `host-complete-text.ts` 统一挂好的非 Agent 单次 AI 观测记录与统一日预算（结清 `BL-b42-followups ①`，无需重复修改各插件，严守 `S-observation-records`／`S-18`）；统一生产与评测漏斗词表（`unknown-and-funnel.ts`）并将撤销／返工关联到 `run_id` 与 `conditions.prompts`。② 批量 Trace Bundle 公开合同（结清 `BL-evaluation-read-cost`）：在 `packages/contracts/src/services/observation.ts` 与 `horizontal/observation` 新增批量证据读取公开动作（保留逐条权限／用途校验与逐项不可读原因，不跨读私有表），迁移 `horizontal/evaluation/src/observation-bridge.ts` 将大样本 N 次单条调用降为批量读取。","track":"C3","occ":true,"also":["A"],"kind":"实现"},{"id":"2","anchor":"batch-63-item-2","t":"`63-2` · 全平台评测引擎、校准裁判、实验账本、「设置 › 评测」后台与跨批样本库（PR 2）","d":"① 评测引擎与 SIM 自改进记忆账本：补齐评测轮次延迟／token／缓存汇总与从真实 Trace 派生的工具 Mock 隔离回放；统一仓库评测替身底座到 `horizontal/evaluation`（`IsolatedEvalHome` + `StandInModelServer` + 共享 `agent-validation.ts`；仅让 `scripts/studio-replay` 的 `smoke` 模式复用该隔离底座，严禁删除 CI 必跑的 `scripts/studio-replay/replay.mts` 380 条离线设计答卷校验门禁，亦不动 9 个 `account-*.test.mjs`）；落地校准混合 LLM 裁判（位置互换去偏、`n ≥ 3` `pass@k` 方差、按 `evaluation_reviews` 校准；提示词以 `owner_id: \"system:evaluation\"` 走单一结构化输出基准模板登记进 `BUILTIN_INSTRUCTIONS`／`tooling/versions.json`，禁二元语言分支）；建立 `tuning`／`validation`／`holdout_ood` 三层样本划分与 Pareto RRSI 准入门禁；在 `evaluation.db` 按发布前 Clean v1（保持 `version: 1` 基线）新增 `improvement_experiments`（SIM 账本，固定记录裁判提示词精确版本与修订号，显式排除 `personal-sync`，严守 `S-74` 与 `upload: false`）。② 「设置 › 评测」图形化评测管理后台（2026-11-25 拍板）：先定样确认后，在设置页新增独立按需懒加载的「评测」管理面（与 `pnpm eval:run` 共用 `system.evaluation` 公开动作，共用样式表零增长），支持按样本集／用途一键发起隔离评测回放、查看新旧版本多维指标与分数对比、浏览 SIM 实验记忆账本表格、下钻单题证据链并录入人工复核／纠偏原因（`zh`/`en`/`ja` 三语完备）。③ 冻结跨批标准样本库：登记 `PWA-160` 周报样本、`TOL-17` 工具发现样本、平台 `32-2` 要求—证据—认可样本（含 Goals 与无 Goals 后台任务）、智能呈现候选／采用样本，以及 `MEM-65/75` 记忆误记与跨会话纠正成对样本（直接供 63A 前后对照，真实长期效果在 76 验收）。","track":"C3","occ":true,"also":["D"],"kind":"实现"}],"pre":["29","30","62","91","91B","104","111"],"soft":[],"cond":["不必等 62","「设置 › 评测」管理后台先定样确认","与 64 到 76 汇合"],"split":true,"nodes":[{"id":"63.1","items":[0],"hard":["29","30","91.2","104.1","111.1","111.2","111.3"],"partial":[]},{"id":"63.2","items":[1],"hard":["63.1","91B.1","62.1","111.1","111.2","111.3"],"partial":[]}]},{"id":"63A","title":"记忆 P2：形成质量、整理（Dreaming）、按需原文与常驻层","stage":"3","intro":"这一批把记忆系统升级成「懂上下文、空闲时自动回头纠错整理、又不打扰你、不破缓存」。鉴于现役记忆核心服务文件已经长到了 106 KB（3000 多行），按你拍板的方案分 3 个清晰的有序 PR 稳步交付：  1. 先给巨型代码搬家理清结构（`63A-0` 纯重构先行，`111` 后即可开工）：不改任何功能表现，先把 106 KB 的 `MemoryService` 按四块职责拆清（顺手给 76 KB 的记忆设置页文件做局部瘦身，并清掉 P1 残余债），让后面的改动干干净净、一眼能审。 2. 让「记下什么」更聪明（`63A-1` 形成质量与情景记忆，无需再改上游 SDK）：平时聊天不用特意说「记住」也能判断什么值得记；能结合前文看懂「以后按第二种写」指什么；分清「只是这周临时改一下」与「以后长期都改」，并修掉以前因为去掉标点把「金额 > 1000」和「金额 < 1000」当成同一句话合并的乌龙。 3. 空闲时自动回顾整理（Dreaming）、按需查以前原话与静态常驻层（`63A-2`）：    - 当你纠正过 AI、退回返工过或有了新验证结果，后台在空闲时按每天极低预算自动对照当时的原话补漏、纠错、合并和自然衰减；默认只在记忆设置里留一行简短摘要，绝不在聊天或通知里弹窗打断你；    - 严守人工优先与分区隔离红线（2026-11-25 拍板）：Dreaming 后台只许自动修改/合并/衰减「AI 自己自动记下的条目」；凡是你亲手写、亲手点头确认过的记忆，以及涉及「升入常驻层」或「把某个项目/个人空间的局部习惯升级为全局习惯」，Dreaming 一律只生成带原话依据的待审建议放进候选箱等你点头，绝不擅自自动覆盖；    - 助理和 Coding 需要时可按权限查以前对话的原话摘录（供下一批 `64` 历史搜索直接复用）；少量确认过的高频称呼和核心习惯只在新建会话或压缩节点冻进最前面的静态缓存区（防中途破缓存），并用 `63-2` 的记忆标准考题跑完三组前后对比，把得分写进「设置 › 评测」后台的实验记忆账本。","ask":"在 `63A-2` 开工前看一次记忆整理改动依据展示与四种反馈说法的轻量样稿并定下；真实模型对照按红线问你。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/63a.md","items":[{"id":"0","anchor":"batch-63a-item-0","t":"`63A-0` · 拆分 106KB `MemoryService` 巨类与清理 P1 残余债（PR 1：纯重构零行为变化）","d":"按既定 `T-061` 四协作者职责边界拆分现役 106.5 KB 的 `horizontal/memory/src/service.ts`（并顺手对 76.3 KB 的 `apps/workbench/src/settings-memory.ts` 做合理职责拆解），同步结清 `BL-memory-p1-residuals`；保持公开动作、API 快照、存储结构与全部既有 `memory-*`／安全不变量测试行为 100% 不变，为后续 P2 逻辑腾出干净可读的代码基座。","track":"C2","occ":true,"also":["D"],"kind":"实现"},{"id":"1","anchor":"batch-63a-item-1","t":"`63A-1` · 记忆形成质量与结构化情景记忆（PR 2：P2-01，`MEM-45～63`）","d":"去掉后台学习 `STANDING_WISH` 词表前置门与单条 >1500 字整批一刀切拒绝；补齐说话者角色、必要相邻前文（解析指代且不把 AI 提案当本人表态）、发生时间／时区、分区范围与相对有效期；复用现役 `memory-extractor.ts` 槽位与结构化 JSON 单一基准提示词（以 `system:memory` 登记并升 `tooling/versions.json`、用 `fencedMaterials` 隔离、禁二元语言分支），支持摘要与逐字引文分离及候选与旧条目的批量语义关系判断（同义重述、补充条件、临时例外、长期纠正、无关）；修复 `sameText()` 去标点导致的比较符／否定词语义反转误合并（如 `\"金额>1000\"` 与 `\"金额<1000\"`）；新增结构化情景记忆（`context → action → verified outcome → applicability`，「经验证」须持程序验证引用）；落实后台自动形成日／轮次预算与频率上限，并衔接 `105-3` 对话栏行内编辑／遗忘单主人写入口；通过 `MEM-45～63`。","track":"C2","occ":true,"also":["A","B"],"kind":"实现"},{"id":"2","anchor":"batch-63a-item-2","t":"`63A-2` · Dreaming 空闲整理、按需查会话原话、四种反馈与静态常驻层（PR 3：P2-02～05，`MEM-64～75`）","d":"① 公平召回与按需查会话原话（P2-02／P2-03）：消费 `91-2` 已入库的 `AuthenticatedEnvelopes` LRU 与 `62-1A` Host 按 `scope` 区间列记忆行（关闭 `BL-1072`／`BL-1073`，验证大个人库＋小项目库公平召回 `MEM-65`），开轮召回接入可信任务语境；接入 SDK `#121` `sessions.search` 经动作目录登记只读会话原文摘录查询（严格受当前分区与会话权限约束、回短摘录可跳回，供 `64` 历史搜索直接复用）。② Dreaming 空闲回顾整理与用户控制（P2-04）：按纠正、返工（`32-2`）、新验证结果与来源变化记「待整理」，空闲时限量运行；移除 `MEMORY_TIDY` 的 `similarity >= 0.3` 字面过滤门（不再只看 `slice(-30)`），将 0.70 底部衰减升级为真正指数半衰期衰减；严格执行人工优先与分区隔离红线（后台仅自动整理 `auto` 条目；人工维护／已确认条目、提议升入常驻层或跨分区扩大范围一律只入待审候选箱）；落地四种反馈（这次不用、纠正长期偏好、拒绝建议、彻底遗忘，且遗忘对派生物一并生效）与 `MEM-71` 长期内容归位建议（项目指导归 `44-2`、方法归 Skill、业务事实归插件主人）。③ Zone 1 静态常驻层（P2-05，`MEM-72`）：仅纳入经本人确认的高频短条目，按 token 计量，代码级强制仅在会话建立／压缩检查点冻结进入 Zone 1（Static `system`），会话进行中只读不变、实时按需召回只进 Zone 4 尾部（严防打碎 KV-Cache）；用 `63-2` 冻结样本跑通 `MEM-75` 三组对照并写入 `improvement_experiments` 实验记忆账本。","track":"C2","occ":true,"also":["A","B","C1","C3"],"kind":"实现"}],"pre":["31","32","44","62","63","104","105","111"],"soft":[],"cond":["纯重构零行为变化","MEM-45～63","MEM-64～75","新增整理依据与反馈按钮先定样确认"],"split":true,"nodes":[{"id":"63A.0","items":[0],"hard":["31.2","44.2","44.5","111.1","111.2","111.3"],"partial":[]},{"id":"63A.1","items":[1],"hard":["63A.0","104.1","105.2","111.1","111.2","111.3"],"partial":[]},{"id":"63A.2","items":[2],"hard":["63A.1","62.1","63.2","32.2","111.1","111.2","111.3"],"partial":[]}]},{"id":"64","title":"主动助理、智能组合与主线第三片","stage":"3","intro":"这一批让 Molis 从「你说一句它做一件」升级成「眼里有活、提前安静备好草稿、跨插件拼出顺手操作面、还不吵你、不乱烧钱」，按模块主人拆成 4 个边界清晰的 PR（1 个底座先行 + 3 路并行） 交付：  1. 五套初始主动技能包与访谈初始化底座（`PR 1`：`64-4 + 64-5` 先行）：补齐除日报外的其余 5 类开箱主动场景技能（提前准备、阻塞跟进、跨插件衔接、结果核对、机会发现）以及首次轻量访谈与每日/每周重点更新配置；在个人空间和只开了「日程」的空白轻量项目里都能自然工作，绝不假定装了待办或目标插件。 2. 主动发现、周期报告、材料触发推进与「安静准备 / 观察试用」闭环（`PR 2`：`64-1 + 64-6 + 64-7`）：    - 接通周汇总、主动发现、持续跟进、周期报告、历史原话搜索（复用 `63A-2`）以及「安静准备」与「观察试用（只记录效果与花费、绝不真改业务数据，停用即止、启用前重核当前事实）」；    - 设死防烧钱与防打扰硬闸门（2026-11-25 拍板）：新材料进来或关联对象变化触发后台准备时强制防抖合并、设每日主动后台模型调用独立预算上限（超限自动停到次日、绝不追赶补跑），且严禁唤醒休眠项目；    - 克制呈现与轻重分级采纳（2026-11-25 拍板）：主动建议只安静躺在「接下来」清单的虚线行里（绝不弹 macOS 系统通知、不刷 Dock 角标、不挤进右下角待决卡叠）；点「开始办」采纳时，切事项、查看准备结果或起草草稿直接一步到位不弹二次确认框，只有涉及对外发送、付费或不可逆写入才走标准确认卡。 3. 智能组合第三片（`PR 3`：`64-2`）：在你允许的候选目录（`62-2/3`）内，让助理把跨插件卡片、外部工具和技能拼成此刻最顺手的操作面（先秒出固定组合不挡首屏、模型排好再平滑替换，失败或离线无感退回固定组合），同步补齐给外部工具与终端看的纯文本形态，「挂到／交给」只读插件声明、绝不写死插件名。 4. 主线智能建议与跨项目个人事项视图（`PR 4`：`64-3`）：直接消费 `108` 已建好的跨分区总览只读投影（`overview_projection`，不另造合同、零休眠唤醒，撤权立即作废缓存建议），在左上角「项目 › 事项」面板提供跨项目的个人主线总览，并给出「放进事项／排序／切换建议」（必须你点采纳才切）。","ask":"开工前看一次访谈、安静准备／观察试用（落在信息栏「在办」清单）、组合理由与跨项目主线视图的轻量样稿并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/64.md","items":[{"id":"4","anchor":"batch-64-item-4","t":"`64-4` · 初始五套主动场景 Skill 与默认配置（PR 1）","d":"补齐 `PWA-88` 除日报／工作接续（`52-2` 已交）外的余下五类初始主动场景 Skill 与默认配置：提前准备、阻塞跟进、跨插件衔接、结果核对、机会发现；兼容个人空间（`\"personal\"`）与空白默认仅开 `Schedule` 的分区（按已启用插件能力条件生效，不假定装了 Goals／Todo），同步登记 `tooling/versions.json` 与 `OBSERVATION_COVERAGE_PLAN`。","track":"A","occ":true,"also":["E"],"kind":"实现"},{"id":"5","anchor":"batch-64-item-5","t":"`64-5` · 访谈初始化与工作记忆衔接（PR 1）","d":"接通 `PWA-96～97` 的首次轻量访谈初始化与每日／每周重点更新；任务类来源按当前分区实际已启用插件读取（未装待办或 Goals 时只读分区概况与最近工作，决定 42）；只读消费 `63A-2` 的 Zone 1 静态常驻层。","track":"A","occ":true,"also":["C2"],"kind":"实现"},{"id":"1","anchor":"batch-64-item-1","t":"`64-1` · 主动发现、持续工作与周期报告（PR 2）","d":"周汇总 → 主动发现／持续工作 → 周期报告闭环；接入前门路由（按 §5.8 单一最佳匹配加缺口说明，复用 41 最多读 3 个自动技能规则）、讨论诉求、跨源搜索、理解纠正、助理主动提 Skill 改进建议（复用 42 差异与采用）、事件卡定位高亮、一键暂缓／免打扰与每日主动模型预算硬上限；建议呈现严格走「接下来」清单虚线行（绝不弹系统通知、不刷 Dock 角标、不进卡叠），点「开始办」按轻重分级（起草／只读准备一步到位免二次确认，外发／付费／不可逆写入走标准确认卡）。","track":"A","occ":true,"also":["C3","F"],"kind":"实现"},{"id":"6","anchor":"batch-64-item-6","t":"`64-6` · 回执阶段 5：材料触发推进与会话历史回查（PR 2）","d":"并入回执阶段 5（`BL-318` 前半段；工作目标／认可已由 `32-2` `modules/acceptance` 交付，委派完成原范围续推已由 `32` 交付）：落实经防抖合并与预算门控的「材料到达或关联对象变化触发推进」、没读到输入时的受控续做，以及复用 `63A-2` 只读会话原话查询的历史搜索（零 Goals 项目与个人空间同样成立）。","track":"A","occ":true,"also":["C2"],"kind":"实现"},{"id":"7","anchor":"batch-64-item-7","t":"`64-7` · 安静准备与观察试用（PR 2，`PWA-141～143`）","d":"「后台安静准备」与「是否提示你」分开判断；观察试用（Shadow Trial）仅记录获准样本与实际模型用量（走 `104-1`／`63-1` 记账），零正式业务表写入，停用后立即停止不续跑、正式启用前重新核对当前事实且不整批补执行历史；准备与试用进展统一落在信息栏的事件信息与「在办」清单。","track":"A","occ":true,"also":["C","C3"],"kind":"实现"},{"id":"2","anchor":"batch-64-item-2","t":"`64-2` · 智能组合第三片：跨插件／MCP／Skill 动态拼面与文本形态（PR 3）","d":"扩展 `horizontal/surface-composition`，经 `horizontal/agent-host`（单一结构化 JSON 挑选提示词登记升版，只在 `62-2/3` 获准候选中挑 ID 排序并附一句理由，绝不生成自由 HTML）组合跨插件对象、MCP 与 Skill：首屏先秒出确定组合、模型返回后平滑替换（超时／失败／无模型无感退回确定组合），记住用户换形态／移走／固定偏好；补齐给 MCP／终端／通知用的纯文本形态（`IUI` §4.5）及其余插件呈现声明；「挂到…」「交给…」去处只读 `44-1` 声明了可挂接／可接收关系的已启用插件（零硬编码插件名）。","track":"C3","occ":true,"also":["A","C2","E"],"kind":"实现"},{"id":"3","anchor":"batch-64-item-3","t":"`64-3` · 主线智能建议与跨项目个人主线视图（PR 4）","d":"在 `horizontal/mainline` 与左上角「项目 › 事项」切换面板接入「放进事项／调整顺序／切换当前事项」可采纳建议（切换建议点采纳即切，不自动跳走、免二次弹窗）；直接消费 `108` 已交付的 `overview_projection` 跨分区只读投影底座呈现跨项目的个人事项主线视图（`WLN-26`，按本人 `OverviewGrant` 授权读取、零休眠项目唤醒、撤权后立即作废已缓存及在途建议，严禁另造第二套 Home 级只读合同；跨设备同步另归 `SRV-2`／`SRV-5`）。","track":"A","occ":true,"also":["C3"],"kind":"实现"}],"pre":["15","29","32","36","37","41","42","44","46","52","53","62","63","63A","91B","108","111"],"soft":[{"id":"61","k":"p"}],"cond":["BL-b42-followups ①","经 Agent Host 调模型","跨设备另等 SRV-2／SRV-5","来源与操作能力可用","公开配置可先接","工作记忆接 63A","复用 63A.2 的原文查询","来源、Skill／配置版本、预算与停止控制就绪"],"split":true,"nodes":[{"id":"64.1","items":[2],"hard":["29","32.1","41.1","42","46.2","52.1","63.1","64.4"],"partial":["61.1","62.1"]},{"id":"64.2","items":[5],"hard":["15.1","37.1","53.2","62.2","64.4","44.1","44.5"],"partial":[]},{"id":"64.3","items":[6],"hard":["36.2","37.2","53.3","64.4","108.2","111.1","111.2","111.3"],"partial":["64.1"]},{"id":"64.4","items":[0],"hard":["41.1","42","52.2","111.1","111.2","111.3"],"partial":[]},{"id":"64.5","items":[1],"hard":["63A.2","111.1","111.2","111.3"],"partial":[]},{"id":"64.6","items":[3],"hard":["32.1","53.1","63A.2","64.4","32.2","44.1"],"partial":[]},{"id":"64.7","items":[4],"hard":["29","32.1","41.1","52.1","52.2","63.1","64.4","91B.1"],"partial":[]}]},{"id":"65","title":"Coding B 期","stage":"3","intro":"这一批把写代码（Coding）在联网查资料、安全跑命令、自动跑检查脚本（Hooks）上的真沙箱与权限规则彻底立起来，按 3 个清晰的串行 PR 稳步交付：  1. 上游 AI 底座窗口 C 双平台操作系统真沙箱与本地出站代理换包（`65-0`）：先在上游 `molis-prologue` 落地 macOS（`sandbox-exec`）和 Linux（`bwrap`／`seccomp`）真进程沙箱、本地出站域名白名单代理（按请求域名核验并显式兼容开发机 `198.18.0.0/15` fake-IP 代理环境，同时拦截直接写裸 IP、回环地址与私网重绑定）以及桌面端 `\"hook\"` 专用通道与流式输出防卡死背压；经你确认上游提交号后完成换包、全金样与 Rust 检查。 2. 联网搜索开关 + 真沙箱命令接线、长期放行规则与「AI 低风险代批」（`65-1/2`）：    - 默认允许模型联网查公开技术资料（直接复用「设置 › 网页搜索」选好的默认服务，支持按项目或仅本次任务一键断网）；    - 命令真正关进操作系统沙箱运行，已授权开发任务可在沙箱与包源域名白名单内自动下载公开依赖和所需代码分析工具（严禁越出项目目录或触碰系统全局环境与私有凭据）；常用命令经你明确同意可存为长期规则；    - AI 低风险自动审批默认关闭（2026-11-25 拍板）：需你按本次任务或项目主动开启才生效，开启后只代批沙箱内单条无害开发命令，时间线上每一条都明明白白标出「AI 低风险代批（点开看理由、一键切回人工确认）」，绝不冒充你亲自批准；所有新增面板 100% 复用设计系统共用组件，严守 Coding 私有样式零字节增长。 3. 带脚本内容指纹锁的用户 Hooks 与自动化建议收口（`65-3`）：支持 `.molis/hooks.json`（兼容 Claude Code 格式），首次启用或改动时展示差异给你确认；同时对 `hooks.json` 和它调用的脚本文件内容做指纹锁定（就算只改了被引用的 `.sh` 脚本也会立即停跑等你重新确认，且把钩子配置与脚本列入 AI 禁改保护名单），随时可停用、重启自动恢复；顺手收口第 `61` 批留下的 `G-09` 缺口（让自动化建议卡支持推荐项目的 Hooks 与常用检查命令）。","ask":"`65-0` 换包前确认一次上游 `main` 提交号；`65-1/2` 与 `65-3` 开工前看一次联网开关、命令规则／AI 代批标记与 Hooks 确认面板的轻量样稿并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/65.md","items":[{"id":"0","anchor":"batch-65-item-0","t":"`65-0` · Prologue 窗口 C 双平台 OS 真沙箱、出站域控代理与 SDK 换包（PR 1）","d":"在上游 `molis-prologue` 落地窗口 C（见上游 `harness-optimization-plan.md`）：① `C1` macOS Seatbelt（`sandbox-exec`）与 Linux Bubblewrap（`bwrap`）／`seccomp` 同步替换 Node Host 与 Rust／Tauri Host 的 `sandbox: \"absent\"`（沙箱缺失或不可用时明确拒绝、严禁静默无沙箱放行，Linux CI 实跑越界拒绝测试；Windows Job Object 与干净包 `.d.ts` 紧随补齐）；② `C2` Host 本地出站域控代理强制拦截子进程未获准外网请求（按请求域名白名单核验，拦截裸写 IP、`127.0.0.1` 回环与 RFC1918 私网 DNS 重绑定，同时按 `next-requirements.md` §3 显式兼容开发机代理对获准公开域名解析出的 `198.18.0.0/15` fake-IP 网段）；③ `C3` Tauri 增设独立 `\"hook\"` 通道与流式 stdio 滑动窗口背压；经你确认上游 `main` 具名提交后在 Molis Work 完成换包（附 `.sha256`、`.provenance.json`、全金样回放与 `node scripts/gates/native-checks.mjs rust`）。","track":"B","occ":true,"also":["C2","F"],"kind":"实现"},{"id":"1","anchor":"batch-65-item-1","t":"`65-1/2` · 公共搜索联网开关、真沙箱命令规则、依赖下载与 AI 低风险代批（PR 2，`CNW-01～06`、`CEX-01～10`、`CLS-02`）","d":"① 公共搜索与联网开关（`65-1`）：默认允许公开网页搜索／读取（复用 `connectors.web_search.query@1` 统一默认来源），支持项目级持久关闭与单次任务级关闭（跨轮／重启保持，关闭后工具、浏览器、命令与子进程均不得绕过，消费 `62-2/3` 出站边界）。② 真沙箱执行、依赖／工具隔离下载与长期放行规则（`65-2` 前半）：将项目输入／输出目录与临时工作树范围传给 OS 沙箱与本地出站代理；已授权开发任务在沙箱与包源域名白名单内自动下载公开依赖（`CEX-06/07`）及 `CLS-02` 代码分析工具到 `<Home>/tools/language-servers`（禁改系统全局环境、禁碰项目外目录与私有凭据，上传／登录／推送／发布仍需对应独立授权）；长期命令放行规则仅在本人明确同意后经统一授权入口（`39-1`）保存，按程序＋参数模式精确匹配。③ 可选 AI 低风险自动审批（`65-2` 后半，2026-11-25 拍板）：默认关闭（由用户按本次任务或项目显式开启，随时一键关停），开启后仅评估尚未预先放行的沙箱内单条普通命令，严守 `105-1` 4 层防链式 RCE 硬护栏，时间线与回执每条明确标注「AI 低风险代批」及简明理由（绝不冒充本人批准、不自动存为长期规则），审计上下文接入 `63-2` 样本。","track":"B","occ":true,"also":["C2","D"],"kind":"实现"},{"id":"3","anchor":"batch-65-item-3","t":"`65-3` · 带脚本指纹锁的用户 Hooks 生命周期与 `G-09` 自动化建议收口（PR 3，`CHK-01～04`）","d":"① Hooks 确认、双哈希防篡改与沙箱运行：支持 `.molis/hooks.json`（兼容 Claude Code 格式），消费 `62-0` 全生命周期 Hook 事件（含 `session-start`、`session-end`、`tool-failed`、`session-stop-failed`）与 `65-0` 原生 `\"hook\"` 通道，全部钩子在 OS 沙箱与当前目录／联网边界内运行；首次启用展示触发时机、脚本与允许范围由本人确认（导入或发现不自动启用）；确认时同时计算并绑定 `.molis/hooks.json` 与所有被调用脚本文件的 SHA-256 内容摘要（配置文件、被调用脚本内容或权限范围任一变动立即阻断旧许可并展示差异待重新确认），并将 `.molis/hooks.json` 与活跃钩子脚本路径纳入 `105-1` 安全保护名单（严禁 AI 自动改写或低风险代批触碰）；停用／撤权立即生效，重启核对真实状态不重跑未知副作用脚本。② 收口第 61 批 `G-09` 缺口：补齐可安装的 Hook／检查命令来源声明，使项目自动化建议器按声明生成建议并并入 `automation.adoption.adopt@1` 采用卡。","track":"B","occ":true,"also":["C2"],"kind":"实现"}],"pre":["35","39","62","105","111"],"soft":[],"cond":["换包前经用户确认上游 main 提交","权限与规则界面先定样确认","Hooks 面板与差异确认先定样确认"],"split":true,"nodes":[{"id":"65.0","items":[0],"hard":["62.0","111.1","111.2","111.3"],"partial":[]},{"id":"65.1","items":[1],"hard":["65.0","35.2","39.1","62.2","105.1","111.1","111.2","111.3"],"partial":[]},{"id":"65.3","items":[2],"hard":["65.1","35.2","39.1","111.1","111.2","111.3"],"partial":[]}]},{"id":"66","title":"Coding 质量保证与依据核验","stage":"3","intro":"这一批给写代码（Coding）补上一套「写时当场自修报错 + 交回前按需多层复查 + 证据分三档写进同一张验收卡」的质量把关链，同时按你拍板的三档按需启用规则严防日常小改动乱烧十几倍模型额度，分 2 个清晰的串行 PR 交付：  1. 日常即时自修、有界改绿与三档依据验收卡闭环（`66-1`）：    - 日常默认轻量档（零额外子代理开销）：把环境脚本与工具链摘要放进开局上下文；模型改完文件后立刻把语法 / 类型新增报错喂回给它当轮顺手修好（不再等最后出卡才看见）；收尾时写作角色按目标要求做一次自检；并支持设最大轮数、随时可停的「自动修到测试全绿为止」（绝不死循环）；    - 三档证据写进同一张验收卡：Coding 跑命令核验的结果（机器核验档）和第 `60` 批外部会话自报的结果（自述档），连同你亲自点头认可的结果（人工认可档），统一写回平台的验收卡（装没装目标插件都完整可用）。 2. 共享缓存前缀的 5 路多代理评审、简化／安全专科与对抗验证（`66-2`）：    - 多路评审档（按项目／会话开启，或在交回前点按钮触发）：复用 `62-0` 的共享缓存分叉（`Cache-Safe Fork`，避免重复付五倍读代码输入费）并行跑 5 个独立评审员（查项目规范、明显 bug、历史提交、旧 PR 意见、注释一致性），由打分员过滤掉 80 分以下的凑数废话，只把真问题放进审查卡（每条带「去修复」一键进下一轮，不阻断本地保存；评审汇总浓缩为一条结论依据写回平台验收卡，细碎行内意见留在 Coding 内）；往远端 GitHub PR 发评论统一走 `plugins/native/git` 公开动作与 `67-1A` 无缝衔接，绝不在 Coding 里私写第二套 GitHub 请求；    - 高敏专科／安全／对抗验证档（仅显式点选才跑，发起前明示子代理数并计入同一用量账）：提供 5 类专科复查（含只改写法不改行为的代码简化）、配 1 个独立质疑员挑战的安全评审（只生成补丁文件供你决定，绝不自动应用／提交／推送）、以及高敏任务的「裁判 + 双独立核验员」对抗验证；单人本地项目不强制凑多人真人票门（多人票门归团队批）。","ask":"开工前看一次三档质量开关、审查卡「去修复」、安全补丁预览与验收卡三档证据展示的轻量样稿并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/66.md","items":[{"id":"1","anchor":"batch-66-item-1","t":"`66-1` · 写后即时自修、有界迭代与三档依据验收卡闭环（PR 1，`CQA-09/10`）","d":"① 日常默认即时自修与收尾自检：将 `prologue-write-checks.ts` 的写后 LSP 语法／类型差分诊断直接作为模型工具观察回传触发当轮自修（不再只展示在审查卡），并将 `environment-prep.ts` 的项目脚本与工具链摘要注入 Coding 初始上下文；收尾时写作角色按所服务对象的 `32-2` 要求（无挂载对象时按本轮计划与完成条件）做一次自检（接 `33-1` 收尾报告卡）；实现 `E6`／`CQA-10` 有界迭代（明确完成承诺、最大轮数上限、随时可取消，防无界死循环）。② 依据三档写回同一张验收卡（原 `66-3`）：复用合同已有的三档层级（`self_reported`、`machine_checked`、`person_accepted`）与 `modules/acceptance` 验收卡，打通 Coding 作为生产者提交命令核验依据、`60-1` 外部会话提交自述依据（不冒充平台机器核验），以及显式真人批准门（`CQA-09`，AI 代批不计真人票数，push 新改动后旧批准自动失效）；装与不装 Goals 均完整可用。","track":"B","occ":true,"also":["C2"],"kind":"实现"},{"id":"2","anchor":"batch-66-item-2","t":"`66-2` · 共享缓存 5 路多代理评审、简化／安全专科与对抗验证（PR 2，`CQA-01～08/11/12`）","d":"① 5 路多代理评审与置信分过滤（`CQA-01～04/06/07`）：评审前先判资格与改动范围（空／无关明确跳过）；复用 `62-0` `Cache-Safe Fork` 共享前缀并行跑 5 路独立审查（规范、明显 bug、历史 blame、旧 PR、注释）+ 独立打分过滤（只保留 `≥80` 分且只针对改动行，无问题如实报无、不凑数），未确认行内评论先缓冲分类（防测试探测外发），每条带「去修复」一键带上下文开新一轮，总结浓缩为一条依据写回 `32-2`；本地改动与已读 diff 直接在 Coding 内闭环，远端 GitHub PR 进度／行内评论发布统一调 `plugins/native/git` 公开动作（与 `67-1A` 衔接，不在 Coding 内私写 GitHub 请求，无 Git 时优雅降级）。② 专科、安全与高敏对抗验证（`E8`、`CQA-05/08/11/12`）：经 `FrozenCharacter.model` 分级路由，按显式点选运行 5 类专科（静默失败、测试、类型、注释、行为不变的代码简化）、配 1 个独立 verifier 挑战的安全评审（只出待确认 patch 文件，绝不自动应用、不 commit、不 push），以及高敏「judge + fresh workers + ledger + 双独立 verifier 逐行核对」对抗验证；全部 10+ 个角色提示词走单一基准模板 + `reply-language` 单点注入正式登记升版并登记 `OBSERVATION_COVERAGE_PLAN`，在一个真实改动／PR 上完成 `CQA-12` 实操核验。","track":"B","occ":true,"also":[],"kind":"实现"}],"pre":["32","39","53","59","60","62","65","111"],"soft":[{"id":"67","k":"p"}],"cond":["验收卡依据展示先定样确认","质量档位与审查／补丁卡先定样确认","仅 PR 审查接入部分等 67-1A"],"split":true,"nodes":[{"id":"66.1","items":[0],"hard":["32.2","39.1","39.2","53.1","53.2","59","60.1","65.1","111.1","111.2","111.3"],"partial":[]},{"id":"66.2","items":[1],"hard":["66.1","62.0","62.1","111.1","111.2","111.3"],"partial":["67.1"]}]},{"id":"67","title":"Harness D 与完整任务评估","stage":"3","intro":"这一批给写代码（Coding）补齐「看网页与操作桌面验证界面」和「紧凑的 Git、PR、提交签名与 CI 检查跟进」两套外部手眼能力，最后把 8 类真实硬任务录进评测后台做一次完整基线大考，按模块归属拆成 3 个清晰的有序 PR 交付：  1. `git` 插件补齐提交签名、防提权清洗与 PR／CI／部署／评论跟进（`67-1A`）：    - 在 `plugins/native/git` 落地提交签名配置（GitHub API 签名或 SSH 签名，审查卡显示签名身份）、紧凑展示关联 PR 状态、当前提交的 CI 检查（新提交绝不沿用旧绿灯）、失败日志重跑与部署结果（复用平台已连 GitHub 账号，不要求另登 `gh`；Coding 可选调用，移除 Git 插件或普通非 Git 文件夹下优雅降级）；    - 锁死 PR 安全红线（2026-11-25 拍板）：读取项目配置（`.molis/`、`AGENTS.md`、`.mcp.json`、钩子等）强制只认受信任的 base 分支，绝不让外部 PR 分支自带的配置提权；PR 正文、评论与日志一律清洗 HTML 注释、零宽不可见字符与隐藏属性；且默认只有「你当前连接的本人 GitHub 账号」明确发起的委托，或你在 Molis 界面亲手点击某条评论的「去修复」，才触发本机 Coding 执行——其他任何人的 PR 评论一律只展示为待读卡片，绝不自动遥控你的电脑改代码或跑命令。 2. Coding 接通桌面操控与共用右栏浏览器验证界面（`67-1B`）：解除真实目录 Coding 会话挂接桌面与浏览器的旧限制，共用右侧栏同一个浏览器（共享网站拦截黑名单、你接手与交还、密码框拒截屏保护；助理和 Coding 同时要用时清晰排队提示），让模型改完网页样式能自己打开本地页面点按截屏验收；同步让桌面窗口 OCR 对齐 `112-1` 的中 / 英 / 日（`ja-JP`）识别并用统一的不可信围栏包裹（去掉硬编码中文拼接）。 3. 8 类真实完整任务大考基线录入「设置 › 评测」（`67-2`）：把 `R12` 八大真实端到端任务（目录选择修复、跨文件改码与测试、长会话纠正与摘要、助理接续 Coding、改 UI 并开浏览器验证、断线重启恢复、跟进 PR 检查与评论、创作台生成并安装持久化插件）注册进第 `63-2` 批的评测服务与「设置 › 评测」实验记忆账本（供第 `86` 批效率实验同条件对比，不再另起孤立脚本）。","ask":"开工前看一次紧凑 PR／CI／签名与评论面板、桌面与右栏浏览器排队过程展示的轻量样稿并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/67.md","items":[{"id":"1","anchor":"batch-67-item-1","t":"`67-1A` · `git` 插件提交签名、PR 防提权清洗与紧凑 PR／CI／评论工作区（PR 1，`R10`、`D2/D5/D6`、`CGH-01～03`）","d":"在 `plugins/native/git` 落地：① 提交签名与身份（`D5`）：支持 GitHub API 签名或 SSH 签名及可配提交身份，审查卡展示本次提交签名方；② PR 安全配置源与不可见注入清洗（`D6` + 2026-11-25 拍板）：评审／跟进 PR 时强制从受信任的 base 分支读取 `.molis/`、`.mcp.json`、`AGENTS.md` 与钩子配置（PR head 仅作待审参考，严防改配置提权），复用 `prologue-screening` 清洗 PR 标题／正文／评论／CI 日志中的 HTML 注释、零宽不可见字符、隐藏属性与实体；评论触发严格默认只认「当前连接的本人 GitHub 账号」明确委托或本人在 Molis 界面亲手点击「去修复」，他人评论一律清洗后只展示为待读卡片、绝不自动触发本机执行（协作者放行留 `SRV-3` 团队批按权限显式开）；③ 紧凑 PR／CI／部署与恢复（`R10`、`CGH-01～03`）：复用 `44B` 平台已连 GitHub 账号（核对 CLI／连接真实身份一致，不要求另登 `gh`），展示精确仓库／分支／commit、PR 状态、当前 commit 的 CI 检查与失败日志重跑（新 commit 后旧绿灯失效，CI 通过不冒充部署成功）及获准部署状态，断线／重启先对账远端防重复建 PR／发评论；Coding 经公开动作可选消费（为 `66-2` 提供远端评论发布动作），移除 Git 或非 Git 目录优雅降级。","track":"B","occ":true,"also":["C2"],"kind":"实现"},{"id":"1b","anchor":"batch-67-item-1b","t":"`67-1B` · Coding 挂接桌面操控（`system.computer`）与共用右栏浏览器验证（PR 2，`R8`、`D3`）","d":"解除 `roundSurface` 对真实目录 Coding 会话的旧 `business` 限制，将 `system.computer` 与右栏浏览器按本轮授权窗口／应用范围挂入 Coding：① 共用右栏浏览器（`D3`）：与个人助理共用右侧栏同一浏览器实例（共享 `101-1` fail-closed 站点决定、用户接手与交还、密码框遮蔽拒截屏；公开网页查阅遵守 `65-1` 项目／任务联网开关 `CNW-03`，本地开发页面验证按工作区授权独立放行；助理与 Coding 同时请求时明确排队告知）；② 多动作并发／顺序协调与三语 OCR 围栏（`R8`）：无冲突动作并发、同资源或抢同一桌面焦点的动作按锁顺序执行（部分成功不冒充全成，未知副作用先核对不重放），升级 `apps/local-host/src/computer/computer-ocr.ts` 对齐 `112-1` 的 `zh-Hans`/`en-US`/`ja-JP` 识别并改用结构化 `fencedMaterials` 不可信围栏（去除硬编码中文提示词拼接）；跑通「改 UI → 起本地服务 → 右栏浏览器点按截屏验收」与获准桌面任务闭环，Coding 私有样式零增长。","track":"B","occ":true,"also":["C3","F"],"kind":"实现"},{"id":"2","anchor":"batch-67-item-2","t":"`67-2` · `R12` 八大真实完整任务评估集录入评测后台与基线核验（PR 3）","d":"将 Harness 规格书 `R12` 八类可复现真实完整任务（① 目录选择修复、② 跨文件修改与测试、③ 长会话纠正与摘要、④ 助理接续同一 Coding 会话、⑤ UI 修改并右栏浏览器验证、⑥ 中断与重启恢复、⑦ Git PR 检查与评论处理、⑧ 创作台生成并安装持久化插件）统一注册进 `63-2` 的 `horizontal/evaluation`（严格区分 `tuning`／`validation` 集，不靠固定答案文本判成败，按 `TOL-17` 核对实际仓库、PR、文件与外部副作用），在隔离 Home 多次实跑并把耗时、token／缓存、工具失败、人工介入与通过率记入「设置 › 评测」的 `improvement_experiments`（SIM 账本），作为第 86 批效率实验的冻结基线（不再另起独立评测脚本）。","track":"B","occ":true,"also":[],"kind":"实现"}],"pre":["33","39","48","62","63","65","66","111","112"],"soft":[],"cond":["PR／CI 与评论状态先定样确认","右栏排队与桌面过程展示先定样确认","只等 66 的对应质量能力，不等整项"],"split":true,"nodes":[{"id":"67.1","items":[0],"hard":["33.1","39.1","62.3","65.1","111.1","111.2","111.3"],"partial":[]},{"id":"67.1b","items":[1],"hard":["33.1","39.1","65.1","112.1","111.1","111.2","111.3"],"partial":[]},{"id":"67.2","items":[2],"hard":["67.1","67.1b","48.1","63.2","66.1"],"partial":["66.2"]}]},{"id":"68","title":"新插件交付后半与智能呈现第四片","stage":"3","intro":"第 `48` 批解决了「创作台第一次把新插件做出来装上用」，这一批解决「装好录了数据之后怎么安心接着改、不丢功能不丢老数据、怎么存成常用视图，并交齐 7 类主推角色共 14 个开箱即改的样板插件」，按职责拆成 3 个清晰的有序 PR 稳步交付：  1. 持续修订双重防误删保护、缺包卸载恢复与创作台执行底座优化（`68-A`：含 `68-1` + `68-3`）：    - 先修通 `B14` 并立下「防丢界面 + 防丢数据」双重硬保护（2026-11-25 拍板）：你对已装插件提局部修改时，未点名删除的原有功能与列表一律保留（AI 若判断要删已有控件／页面，必须先列出前后对照经你点头）；加字段自动生成安全的表升级步骤保留旧记录，一旦新版本涉及删表、删列或可能影响已存记录，采用升级前必须醒目提示受影响的数据、自动先备好一份可导出的旧数据快照兜底，并经你二次确认；    - 验证安装包缺失、损坏、卸载保留数据与重启恢复；    - 同步让创作台 `designer` 失败重试改为同会话多轮修补（保住 60–100 KB 系统前缀缓存不重算）、30 轮 `coder` 接通上下文自动压缩防爆窗，并在完整保留 `scripts/studio-replay/replay.mts` 380 条离线校验门禁不误删的前提下，把 `studio:replay smoke` 从「设计冻结」往后延伸到编译与试用验证。 2. 生成插件业务数据导出 + 智能呈现第四片保存视图（`68-B`：含 `68-2` + `68-4`）：每个生成插件都接通业务数据导出，并用同一批旧记录验证升级后仍能正常打开、处理与导出；生成插件带上智能呈现声明，拼好的顺手操作面可保存为视图或生成页面，补齐中 / 英 / 日三语按需帮助文案。 3. 7 类主推角色共 14 个可安装可改用样板插件 + 同口径评测录入「设置 › 评测」后台（`68-C`：含 `68-5` + `68-6`）：交齐 14 个纯统一工作分区（UPP）样板插件（其中「反例与反驳清单」对接第 `112-2` 批瘦身后的 `Jelly` 极简随手记 `jelly_notes` 或 `Pages`；在空白默认仅开「日程」的个人空间或新项目里安装时，缺哪个依赖插件就清晰提示一键一并开启，绝不假定已装）；跑完同口径评测并把首次可用率与返修轮次记进第 `63-2` 批的「设置 › 评测」后台与实验记忆账本。","ask":"开工前看一次局部修订「界面与数据变动对照预警」及操作面保存的轻量样稿并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/68.md","items":[{"id":"1","anchor":"batch-68-item-1","t":"`68-1` + `68-3` · 持续修订双重防误删升级、缺包恢复与创作台 Harness 优化（`68-A`，PR 1）","d":"① 先修通 `B14` 与界面／数据双重防误删保护（2026-11-25 拍板）：从已安装版本持续修订、重新采用与升级（复用 42 草稿→采用→恢复条与 26-5 `U4` 升级执行）；局部反馈修订默认保留未提及的原有控件／列表（AI 拟删除已确认零件须展示前后对照经本人确认）；新增字段自动生成安全表升级段保留旧记录，凡涉及删表、删列或可能丢失已存记录的升级，采用前必须醒目提示受影响数据、自动先生成一份可导出的旧版数据快照兜底并经本人二次确认。② 缺包、损坏、卸载与重启恢复（原 `68-3`）：验证安装包缺失、损坏、卸载保留数据、宿主重启与就地恢复（`PBU-13/14`）。③ 创作台执行 Harness 优化：在 `48` 已去重的提示词基线上，将 `designer` 失败重试改为同会话多轮修补（保住 60–100 KB KV-Cache 前缀）、30 轮 `coder` 接入 `62-0` Runtime `context-compaction` 槽防尾轮爆窗、整理行压缩的 `agent-studio-*` 脚本与 `build-checks.ts`；复用 `63-2` 隔离评测底座将 `pnpm studio:replay smoke` 延伸至编译与安装试用验收（严禁删除 `scripts/studio-replay/replay.mts` 380 条离线门禁）。","track":"E","occ":true,"also":["C1","D"],"kind":"实现"},{"id":"2","anchor":"batch-68-item-2","t":"`68-2` + `68-4` · 生成插件业务数据导出与智能呈现第四片操作面保存（`68-B`，PR 2）","d":"① 生成插件业务数据导出（`C2`）：接入 `44-5` 的插件数据分段声明（不每个插件另造一套），为每个生成插件提供业务数据导出动作，并用同一批真实旧记录完整验证「第 1 版写入 → 修订升级到第 2 版 → 打开／编辑处理 → 导出业务数据一致」（包导出不能替代）。② 生成插件呈现声明与操作面保存（`IUI` 第四片）：生成插件产出合规呈现声明（创作台本身属纯平台 `horizontal/plugin-studio`，不带插件呈现声明），支持将确定组合与 `64-2` 助理组合出的操作面保存为视图或生成页面（走同一校验与公共运行时），补齐生成页面的 `zh`/`en`/`ja` 三语按需文案帮助（`VUX-51～59`）。","track":"E","occ":true,"also":[],"kind":"实现"},{"id":"5","anchor":"batch-68-item-5","t":"`68-5` + `68-6` · 七组角色 14 个纯 UPP 样板插件与同口径评测入后台（`68-C`，PR 3）","d":"① 14 个纯 UPP 样板插件（`C5`，创作台升级 §3.3）：为七组主推角色各交 2 个、共 14 个一键安装且可从样板开草稿让 AI 修改的纯 UPP 分区插件（`databases.partition` + 声明 `push`，适配纯平台 `system.shelf`；其中「学生与研究 · 反例与反驳清单」对接 `112-2` 瘦身后的 `Jelly` 极简随手记 `jelly_notes` 或 `Pages`，不依赖已删旧块树）；所用下游插件（含 Goals、Git、Feed、Todo、Dataset 等）均写成声明式安装依赖——在空白默认仅开 `Schedule` 的个人空间与零 Goals 新项目里完整实走「提示一并启用依赖 → 安装 → 录入数据 → 星型推送 → 让 AI 改一次再升级验证旧数据保留」。② 新插件同口径评测（`C3`，原 `68-6`）：在 `63-2` 的 `horizontal/evaluation` 上复跑 `48` 同口径评测集与 14 个样例改造后可用率，如实记录首次可用率、失败原因与返修次数，写入「设置 › 评测」的 `improvement_experiments`（SIM 账本），供 83-2 同源复跑。","track":"E","occ":true,"also":[],"kind":"实现"}],"pre":["16","26","37","40","42","44","47","48","62","63","64","111","112"],"soft":[{"id":"70","k":"p"}],"cond":["修订预警差异先定样确认","业务数据导出动作由 44-5 建","14 个样例已定","用到核对台／出处卡的等 70"],"split":true,"nodes":[{"id":"68.1","items":[0],"hard":["16.2","26.5","42","47.1","48.1","62.0","63.2","111.1","111.2","111.3"],"partial":[]},{"id":"68.2","items":[1],"hard":["68.1","44.5","37.1","40.2","64.2","111.1","111.2","111.3"],"partial":[]},{"id":"68.5","items":[2],"hard":["68.1","68.2","48.1","48.4","44.6","63.2","112.2","111.1","111.2","111.3"],"partial":["70e"]}]},{"id":"69","title":"情境 W5／W6","stage":"3","intro":"这一批把工作台左右两边的素材与落点打通成「随手抓起、拖过去就能用，还有个临时攒东西的材料篮」，同时顺手收口第 `61` 批留下的沙箱文档导入缺口，按 2 个清晰的串行 PR 交付：  1. 跨区域防卡死拖放底座与轻重分级手感（`69-1` · W5）：    - 把东西从右侧栏或左边页面直接拖到对话输入框、右下角卡叠、左上角事项清单或插件页签／正文上，清楚高亮哪里能放、为什么放不了；做好跨多层内嵌窗口（iframe）与浏览器画布的顶层拖拽协调桥（按 `Esc` 或移出窗口 100% 干净收起，绝不留半透明幽灵遮罩，并配齐纯键盘「拿起 → 选落点放入」无障碍操作），且拖拽脚本在首次拖动时按需懒加载，零首屏负担；    - 按落点轻重分级不扰人（2026-11-25 拍板）：拖进助理／Coding／讨论三个输入框（只作为待发草稿引用）、放进临时材料篮或归入事项清单时，松手直接秒放并带一键撤销，绝不多弹一层确认框打断手感；只有拖进文稿正文改写、作为正式验收依据附上、或从个人空间跨区推送到项目时，松手才弹出轻量就地预览／动作选单确认后再按版本写入（项目之间按 `S17` 走一次性复制／移动）。 2. 纯平台置物架（Shelf）材料篮、双输入框落点、触控板手势与 `G-03` 沙箱导入收口（`69-2` · W6）：在纯平台 `modules/shelf`（衔接 `55-5` 轮盘热键）实现临时攒多件素材的材料篮、选区片段动作扩展、补齐「项目讨论输入框」与「Coding 输入框」两个落点及触控板原生手势；顺手收口第 `61` 批遗漏的 `G-03`（`BL-694`：开放沙箱集成包声明 `document_import` 与 `web_search` 的平台操作及拒绝测试）。","ask":"开工前看一次跨窗格拖放高亮、轻重分级松手反馈与材料篮的轻量样稿并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/69.md","items":[{"id":"1","anchor":"batch-69-item-1","t":"`69-1` · 情境 W5 跨窗格拖放底座与轻重分级放入（PR 1）","d":"拆清 `context-actions.ts` 的 `bar` 与 `bus`，落地按需懒加载的顶层跨表面／跨 iframe（分屏、沙箱插件、讨论框、右栏浏览器画布）统一拖拽协调桥（`Esc` 或移出窗口 100% 清场不留幽灵遮罩，并配齐纯键盘「拿起 → 选落点放入」无障碍等价路径）；覆盖现行壳层落点（输入框、右下角卡叠、左上角面板事项清单、插件页签与开放挂载位），明确落点高亮与不可放原因；按落点轻重分级（2026-11-25 拍板）：拖进输入框（仅作未发草稿引用）、放进材料篮或归入事项时松手直接秒放并带一键撤销（免预览弹窗），拖进文稿正文改写、附上正式验收依据或从个人空间跨区推送到项目（调用 UPP 版本化 Push 触发确认与冲突保护；项目间走 `S17` 一次性 `placement.copy`/`move` 并守 `S-35`）时弹出轻量就地预览／动作菜单确认后按精确版本写入。","track":"E","occ":true,"also":[],"kind":"实现"},{"id":"2","anchor":"batch-69-item-2","t":"`69-2` · 情境 W6 纯平台 Shelf 材料篮、双输入框落点与 `G-03` 沙箱导入收口（PR 2）","d":"① 纯平台 `modules/shelf` 材料篮与手势（W6）：衔接 `55-5`，在 `modules/shelf`（`system.shelf`，`/api/platform/shelf`）实现多件素材临时收集材料篮、选区片段动作扩展、键盘与桌面触控板原生手势（过 `native-checks.mjs rust`）及拒绝／恢复验证；补齐情境总纲 §7 `F12` 的「项目讨论输入框」与「Coding 输入框」两个落点；「作为依据附上」读 `44-1` 接收声明并交 `32-2` 平台 `modules/acceptance` 保存（装着 Goals 时才出现 Goal 落点）。② 收口第 61 批 `G-03`（`BL-694`）缺口：随 `W5-11` 文档读取插件操作化，为沙箱集成包开放声明 `document_import` 与 `web_search` 的平台操作、权限校验与安全拒绝测试。","track":"E","occ":true,"also":["A","F"],"kind":"实现"}],"pre":["07","32","44","46","53","111"],"soft":[{"id":"36A","k":"p"}],"cond":["按 36A 样式重核落点再定样","复用 W5 拖放接点，其他逻辑可独立推进"],"split":true,"nodes":[{"id":"69.1","items":[0],"hard":["07.1","46.1","53.2","111.1","111.2","111.3"],"partial":["36A.1","36A.2"]},{"id":"69.2","items":[1],"hard":["07.1","46.1","53.2","32.2","44.1","111.1","111.2","111.3"],"partial":["69.1","36A.1","36A.2"]}]},{"id":"70","title":"第三批插件功能","stage":"3","intro":"和第 55 批一样，这一批集中交付 10 项分属不同主人的实用内容与插件能力，按模块主人拆成 5 个互不干等的独立 PR，哪组前置就绪就独立轻量定样、独立评审合入：  1. 全平台本机规则脱敏（`PR A`：`70-1`，安全独立审）：把散在注入清洗、判断规则、记忆过滤和密钥扣留里的规则脱敏收拢成平台共用的一份（不在置物架 `modules/shelf` 里另写）。 2. 连接器内容增强：Gmail 全文附件 + YouTube 纯文本字幕轨（`PR B`：`70-2 + 70-3`）：Gmail 读取完整正文（剥离脚本与追踪像素）和真实受控附件（限大小、只存受控附件库并走安全纯文本提取，绝不自动运行可执行文件）；在统一 `rss` 驱动里提取 YouTube 视频自带的纯文本字幕轨（严守延续 `112-1` 的零音视频下载原则：没有自带字幕轨的视频诚实标注「该视频未提供字幕，仅收标题与简介」，绝不下载音视频流或引回语音转写包袱）。 3. 文稿与演示增强（`PR C`：`70-4 + 70-5 + 70-6 + 70-9`）：PPT 支持图片与图表（消费 `43-2` 规范化 `dataset_rows` 行表）；Pages 个人模板存在个人空间并通过版本化推送或引用给各项目用；支持比较两个固定版本的逐段差异；在后端侧用轻量结构支持导出 Word（`.docx`）与指定历史固定版本（严禁把重型导出库塞进浏览器前端脚本涨首屏字节）。 4. 可追溯出处与材料更新结论重看（`PR D`：`70-7 + 70-8`）：AI 生成内容放进 PPT、待办等落点时保留可追溯出处且标记可编辑；Cognia 底层参考材料更新后，自动列出需要重看的结论只读清单。 5. 规划方法系统技能扩充行业覆盖（`PR E`：`70-10`）：在 `packages/system-skills/planning-methods/` 补齐更多行业规划模板，并同步更新中 / 英 / 日（`zh`/`en`/`ja`）三语词包。","ask":"只有涉及新增界面状态的分组（如 `PR C`、`PR D`），在该组开工前单独看一次轻量样稿确认即可，不用等 10 项攒齐。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/70.md","items":[{"id":"1","anchor":"batch-70-item-1","t":"`70-1` · 本机规则脱敏底座（PR A，安全独立审）","d":"将本机规则版脱敏（H9）收敛为平台共用实现，复合并统一现役 `prologue-screening`、判断规则、记忆过滤与 `33-2` 密钥扣留的敏感模式规则供内容处理链路调用（不在 `modules/shelf` 另写第二份），补正反安全测试。","track":"E","occ":true,"also":[],"kind":"实现"},{"id":"2","anchor":"batch-70-item-2","t":"`70-2` · Gmail 全文与受控附件（PR B）","d":"在声明式 Gmail 连接器驱动读取完整邮件正文（HTML 先剥离 `<script>`、追踪像素与不可见注入转干净正文）与实际附件（设有界体积上限、存入受控附件库并经 `112-1`／`55-7` 受限离线提取纯文本 stage":"3","intro":"这一批解决「做好的技能、插件和场景怎么安全分享给别人，以及换台电脑怎么把整个家当稳稳搬过去」，按业务边界拆成 2 个清晰的串行 PR 稳步交付：  1. 单项能力包、生成插件与场景包的分享导出导入（`73-A`：含 `73-1 + 73-2`）：    - 把技能包、工作流、创作台做的插件（含第 `68` 批的 14 个角色样板）、场景包和保存下来的操作面打包分享；    - 导入前先看清里面有什么内容、要什么权限、缺什么依赖插件（在默认只开「日程」的空白空间里自动提示一并开启依赖），遇到重名冲突或中途部分失败都能安全恢复；    - 严守两条安全铁律：导入外部插件包必须校验发布者签名信任（未信任发布者先去设置页建立信任，绝不静默跑陌生代码）；导入提示词配置包时严拒覆盖受保护的安全提示词（如 AI 低风险命令审批提示词）。 2. 整份 Home 换机导出导入（`U7`）+ 生成插件业务数据回读闭环（`73-B`：含 `73-3 + 73-4`）：    - 业务全带 + 大日志可选瘦身（2026-11-25 拍板）：整份 Home 导出默认必带个人空间与全部项目分区（含推送账本与瘦身后的 Jelly 四张表）、纯平台服务数据、生成插件、记忆（强制保留遗忘墓碑记录，严防以前彻底删掉的记忆借导入死灰复燃）、角色与第 `71-1` 批自定义外观；将可能高达数百 MB 的历史工作记录与本地评测账本设为可勾选项（默认不勾选给日常搬家包大幅瘦身，需要时勾选带上），显式排除可本地自动重建的总览索引、搜索索引与到期简表，绝不导出任何本机密码或 API 密钥；    - 非空电脑先拍快照兜底 + 换机路径重指：导入时做防路径穿越与防超大压缩炸弹校验，先在临时暂存目录验过全部库版本与完整性再原子切换；如果目标电脑本来就有数据，导入前自动先拍一份本地回退快照防误盖，导入完成后集中引导补填缺失密钥与一键重新指定换电脑后变动的本地项目／外部会话文件夹路径；    - 同步单独验证第 `68-B` 批生成插件导出的业务数据能原样回读使用（包分享不能替代业务数据回读）。","ask":"开工前看一次分享范围勾选、导入预览冲突处理与非空电脑恢复确认的轻量样稿并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/73.md","items":[{"id":"1","anchor":"batch-73-item-1","t":"`73-1` + `73-2` · 单项能力包、生成插件、场景包与保存操作面分享导入导出（`73-A`，PR 1）","d":"① 技能包、工作流与生成插件导入导出（`73-1`）：在 08／09 按类包格式（提示词改写、角色说明、工具与 MCP 仅带引用，不含已删 `goal-advance`）之上补齐内容／权限预览、依赖／版本校验、冲突处理、部分失败回滚与恢复，使 `68-C` 的 14 个角色样板包可完整分享；严守发布者签名信任校验（`PBU-47-2`，未信任发布者引导前往设置页建立信任）与决定 67 ④ `override_policy: \"protected\"` 只读保护（任何导入包企图覆盖受保护安全提示词一律以 `agent_definitions.prompt_override_protected` 拒绝）。② 场景包与保存操作面导入导出（`73-2`）：场景包、`68-B` 保存的操作面及后续 `77`/`78` 组装产物统一采用第 20 批定的场景包格式（禁用「场景方案」旧词、不建第二套包格式），在空白默认仅开 `Schedule` 的分区采用时清晰提示一并启用所需插件并支持恢复。","track":"C","occ":true,"also":["D","E"],"kind":"实现"},{"id":"3","anchor":"batch-73-item-3","t":"`73-3` + `73-4` · 整份 Home 换机导出导入 `U7` 与生成插件业务数据回读（`73-B`，PR 2）","d":"① 整份 Home 导出与导入 `U7`（`UPG-20`，2026-11-25 拍板）：经 `listPartitions()` 与 `partitionRoot()` 枚举导出个人空间（`personal-space/`）与各项目分区主库／独立库／插件文件（含 `push_lineage`、`push_upstream`、`push_superseded` 与 `112-2` 瘦身版 Jelly 4 指令（Shortcuts）」或 App Intents 直接送进桌面端；    - 零丢件安全收件（2026-11-25 拍板）：只走桌面宿主受保护本地收件通道，只安全收下素材（外部文本加不可信围栏），绝不自动触发模型跑命令；默认秒收进永远在线的纯平台置物架（`system.shelf`），当你选「记到个人空间（如收集箱／灵光／随手记）」而个人空间尚未开启该插件时，自动暂存进置物架并附一键开启提示，确保 100% 不丢内容。","ask":"开工前分别看一次统计与费用面板、macOS 送入反馈的轻量样稿并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/75.md","items":[{"id":"1","anchor":"batch-75-item-1","t":"`75-1` + `75-2` · 本机使用统计与调用用量、KV-Cache 省钱及诚实费用面板（`75-A`，独立 PR 1）","d":"① 本机使用统计（`75-1`）：经用户明确同意开启、仅存本机的只读汇总视图，直接聚合 `28`/`29` 工作记录按 `listPartitions()`（含个人空间 `\"personal\"` 与各项目）统计插件、动作、技能（含 `41-2`／`70-10` 规划技能，不含已删 `goal-advance`）、角色、提示词与 MCP 使用情况，不另建第二套统计库。② 调用用量与诚实费用面板（`75-2`，2026-11-25 拍板）：消费 `91-2`／`104-1`／`63-1` 归一化的 Agent 与单次 AI 调用记录及 `prompt_includes_cache` 字段，分清普通输入、缓存命中输入与输出 token（未返回用量的标「未返回」不写 0），展示 KV-Cache 命中率；内置常见主流模型离线参考单价计算费用与估算缓存节省金额，本地模型明确标「本地免费」，未知单价的自定义兼容接口支持在模型设置选填单价（未填时只展示精确 token 与缓存命中率，绝不编造金额）。","track":"F","occ":true,"also":["C3","D"],"kind":"实现"},{"id":"3","anchor":"batch-75-item-3","t":"`75-3` · macOS 其他应用安全送入 Molis Work（`75-B`，独立 PR 2）","d":"在 `apps/desktop/` 实现 macOS App Intents、系统服务菜单（`NSServices`）与快捷指令（Shortcuts）将外部应用选中的文本、链接或受控文件送入 Work（过 `native-checks.mjs rust`／`swift`）；严守 2026-11-25 拍板的零丢件与安全收件规则：仅经桌面宿主本地受保护通道写入材料（外部文本标记为不可信内容，严禁外部系统调用直接触发模型执行或跑命令）；默认落入始终可用的纯平台 `system.shelf`（`/api/platform/shelf`），支持选「记到个人空间」及读 `44-1` 接收声明的已启用插件——若目标个人空间插件尚未启用（`108` 默认仅开 `Schedule`），自动暂存进纯平台 `system.shelf` 并给出一键开启对应插件提示，确保 100% 零丢件。","track":"F","occ":true,"also":[],"kind":"实现"}],"pre":["09","28","29","44","57","63","91","104","111"],"soft":[],"cond":["统计与费用面板先定样确认","送入反馈先定样确认"],"split":true,"nodes":[{"id":"75.1","items":[0],"hard":["09.2","28","29","63.1","91.2","104.1","111.1","111.2","111.3"],"partial":[]},{"id":"75.3","items":[1],"hard":["44.1","57","111.1","111.2","111.3"],"partial":[]}]},{"id":"76","title":"全平台与主动效果验收","stage":"3","intro":"主动助理、记忆自动整理（Dreaming）、智能操作面组合、主线建议、写代码质量核验和本机用量统计全都做出来以后，这一批做整个阶段 3 的收官总验收：真刀真枪检查建议准不准 型复跑直接在「`设置 › 评测`」一键执行，不再搞没法落地的「不另开 PR 往文档手写月报」）。 2. `83-B` · 两条创作路径与全站 20 插件＋5 纯平台入口智能呈现、三语文案补缺及旧项清账（PR 2）：完整走通两条创作路径、`82-A`/`82-B`、保存智能视图与带出处静态导出（`IUI-21～26`）；按 `111`＋`112` 终态家底逐项核对 20 个平等分区插件（含瘦身后 `Jelly`）＋ 5 个纯平台入口 ＋ 3 个连接器驱动 的呈现声明与 `zh`/`en`/`ja` 中英日三语帮助文案（`VUX-51～59`），缺的当场补齐；同时把离线 380 条语料回放门禁保留、Clean v1 零旧产物兼容迁移等去向一次写清。","ask":"在 `83-A` 看新轻量场景出现的新交互定样，并确认与阶段 4 并行累计的真人使用体验结论。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/83.md","items":[{"id":"1","anchor":"batch-83-item-1","t":"`83-A` · 创作台通用性轻量场景、14 角色样例 AI 改造实测与「`设置 › 评测`」同口径首期基线（PR 1，合原第 1、2 项）","d":"① 防特化通用性验证（`PBU-09`）：另选一个不同于 Alchemist／CGS 的轻量场景完成手动＋助理组合、隔离试跑、采用与重启独立使用；② 14 个角色样板改造与业务数据复核（`C1～C5`）：逐主推角色对 `68-C` 的 14 个纯 UPP 样板（含依赖瘦身后 `Jelly` `jelly_notes` 的样板）按规格表让 AI 改一次，如实记录依赖补齐后的可安装可用率（分母、失败原因全留），复核 `68-B`/`73-B` 业务数据导出与破坏性改动防丢快照升级；③ 同口径创作评测基线（`C3`／决定 58）：与 `68` 同源将创作需求集接入 `63-2` `horizontal/evaluation` 与图形化「`设置 › 评测`」后台，统计首次可用率与返修次数，将首期正式基线写入 `evaluation.db` SIM 账本与 `evals/sim-ledger/` 后即合入（后续按月或换模型复跑直接在「`设置 › 评测`」一键执行，不与历史异口径数字硬比）；同时确认保留 `scripts/studio-replay/replay.mts` 380 条语料离线宿主回归门禁","track":"无","occ":false,"also":[],"kind":"验收运维"},{"id":"3","anchor":"batch-83-item-3","t":"`83-B` · 两条创作路径、全站 20 插件＋5 纯平台入口智能呈现、三语文案与 Clean v1 去向清账（PR 2）","d":"完整走通新能力创作与场景组装两条路径、`82-A` Alchemist、`82-B` CGS、`68-B` 保存智能操作面与带出处静态形态导出（`IUI-21～26`）；按 `111`＋`112` 终态逐项核对并补齐 20 个平等 UPP 分区插件 ＋ 5 个纯平台入口 ＋ 3 个官方连接器驱动 的智能呈现声明及生成／新增表面的 `zh`/`en`/`ja` 中英日三语帮助引导文案（`VUX-51～59`、`ONB-47～49`，零二元语言分支，守决定 67 ⑤ 模型工具说明固定单语）；明确落账旧例外、离线回放／CI（`replay.mts` 保留、`smoke` 共用评测底座）及 Clean v1 下零 `0.1.x` 旧产物兼容迁移的切换边界","track":"无","occ":false,"also":[],"kind":"验收运维"}],"pre":["39","44","63","68","73","77","78","82","111"],"soft":[{"id":"76","k":"p"}],"cond":["共用本批前置","76 只挡相关效果证据"],"split":true,"nodes":[{"id":"83.1","items":[0],"hard":["63.2","68.1","68.2","68.5","73.1","73.3","77.1","77.2","78","82.1","82.2","44.6","111.1","111.2","111.3"],"partial":["76"]},{"id":"83.3","items":[1],"hard":["83.1","68.1","68.2","68.5","73.1","73.3","77.1","77.2","78","82.1","82.2","44.3","44.6","39.2","111.1","111.2","111.3"],"partial":["76"]}]},{"id":"84","title":"Coding C／D 期余项与交互计划页","stage":"4","intro":"（注：原稿里的「跟进 GitHub 评论、浏览器余项」已在第 `67` 批交付，本批不再重复。）这一批把 Coding 剩下的会话进阶操作、命令行接入、长期记忆联通和可视化交互计划页分 2 个互不阻塞的独立 PR（`84-A` ∥ `84-B`）补齐，全程以「少弹窗、少记参数、点一下就成」的极简体验为准：  1. `84-A` · 会话进阶四件套、长期记忆与插件命令行接入（独立 PR 1）：    - 一键会话分叉（`C1`）：点「从这里分叉」零弹窗直接开出新分支会话（默认不动当前工作区文件，绝不误冲未提交改动；需要连代码一起隔离时，仅在侧旁给一个轻量的「在新工作树打开」可选项），列表清晰展示分叉树关系。    - 无打扰随口旁问（`C4`）：主任务正在跑或做到一半时，直接在输入框敲 `/btw` 或点情境条「问一句」，借当前缓存前缀秒回只读解答，不打断正在跑的任务、不弄脏主对话历史；觉得答案有用可一键「带入主对话继续改」。    - 一键脱敏导出（`C2`）与长期记忆联通（`C3`）：整段会话（含工具调用、审查决定与成果链接）经 `70-1` 本机脱敏一键导出清爽 Markdown／HTML（不传第三方）；Coding 正式接通平台记忆（常驻记忆在开会话时冻在前缀区、每轮动态召回放后面，不打碎缓存）。    - 免记参数的顺畅命令行（`D1`＋`D7`）：插件在 Manifest 声明 CLI 子命令（平台通用机制，不给 Coding 开特权），终端敲 `molis-work coding run \"任务\"` 经本机常驻宿主单进程执行并支持 `--json-schema` 结构化输出；只读与已放行范围内一路跑通零打断，真遇到待批高风险动作时自动按环境省心处理——人在终端前可直接按一下键或在已打开的工作台里任一处确认（不用复制粘贴链接），若是管道／脚本非交互环境（非 TTY）自动立即返回清晰结构化待批原因退出，不挂死脚本也不用背额外参数。 2. `84-B` · Coding 可交互实施计划页（`E7`，独立 PR 2，提前解锁第 `85` 批）：复杂任务的实施计划直接生成为一张清楚好用的交互页（改动主张、对应代码片段展品与待拍板问题放在一起），你在页上勾一下、批注一句一键送回 Coding 开干。","ask":"分别看会话极简操作与交互计划页的样子并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/84.md","items":[{"id":"1","anchor":"batch-84-item-1","t":"`84-A` · 平台插件 CLI 声明合同、Coding 非交互 `D1/D7` 与极简会话四件套 `C1～C4`（独立并行 PR 1）","d":"① 插件通用 CLI 子命令声明（决定 43）与无感审批分流（`D1/D7`）：在 `packages/contracts`／`plugin-sdk` 落插件 Manifest CLI 命令声明，CLI 按已装插件动态生成子命令（`apps/cli` 不写死 `coding`），转发给常驻宿主单进程执行并支持 `--json-schema` 校验输出；遇待批动作按 TTY 自动识别——交互终端支持原地按键或工作台同步确认（免拷链接），脚本／管道非交互模式自动快速退出并回传结构化待批摘要（免记防卡死参数）；MCP 会话能力由动作目录自动导出。② 零弹窗分叉（`C1`）：复用 `forkSession` 与 `Cache-Safe Fork`，一键立即分叉对话（默认不动当前磁盘文件，装着 `Git` 时侧旁提供可选新工作树入口）。③ 脱敏受控导出（`C2`）：接 `70-1` 本机脱敏导出 Markdown／HTML，零第三方上传。④ 纯只读旁问（`C4`）：`/btw` 与情境条「问一句」复用当前会话缓存前缀开只读临时轮，不打断运行中任务、不写主历史，支持一键「带入主对话」。⑤ Coding 接 Memory（`C3`）：读写走平台记忆（`44-5` 会话来源、`R15` 分区隔离），会话起点常驻记忆冻结于 Zone 1，轮次动态召回一律注入 Zone 4，零前缀污染","track":"B","occ":true,"also":["C2"],"kind":"实现"},{"id":"2","anchor":"batch-84-item-2","t":"`84-B` · `E7` Coding 可交互实施计划页（独立并行 PR 2，提前解锁 `85`）","d":"复用 `37` 的公共不透明安全页面能力（`plugin-frame`，零裸 HTML／JS 注入，Coding 私有 CSS 零增长），将实施计划生成为清晰直观的交互页（主张树 ＋ 对应代码／差异展品 ＋ 就地挂在受影响项上的待拍板问题），支持勾选、行内简评与一键把结构化答复带回 Coding 下一轮直接执行；同步覆盖 `zh`/`en`/`ja` 三语与各皮肤","track":"B","occ":true,"also":[],"kind":"实现"}],"pre":["35","37","44","65","66","67","111"],"soft":[],"cond":["C3 接记忆在本批","提前解锁 85"],"split":true,"nodes":[{"id":"84.1","items":[0],"hard":["35.2","37.1","44.5","65.1","65.3","66.1","66.2","67.2","111.1","111.2","111.3"],"partial":[]},{"id":"84.2","items":[1],"hard":["37.1","35.2","111.1","111.2","111.3"],"partial":[]}]},{"id":"85","title":"代码现代化完整流程","stage":"4","intro":"直接让 AI「把这块老代码重写一下」，很容易漏掉隐藏的老业务规矩，也没法证明没改坏；但如果把「评估、画地图、扒规则、定计划」拆成连点七次「继续」的打卡步骤，又太折腾人。  这一批按「只读摸底一气呵成、单页一次拍板、分片等价有据可查」做通完整的老代码现代化改造流：发起任务后，前四步纯只读分析（可运行性评估 → 模块与数据流地图 → 带代码出处的业务规则提取 → 升级／重写／重建对比方案）自动连贯跑完，一次性呈现在 `84-B` 做的同一张交互计划页里（证据确凿的规则默认预勾好，只把拿不准的疑问项置顶醒目请你确认）。你只需在计划页上拍板确认这一次（走平台可信决定入口），就按计划切成小片推进；每一片自动跑老测试＋改前改后对照＋独立安全复查，把行为等价证据挂进第 `66` 批的三层证据卡与平台验收底座，只在遇到越权操作、等价对比不过或需要调整计划时才停下来喊你，最后输出随时可增量刷新的状态报告。","ask":"看单页拍板、分片进度与等价结果审阅的样子并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/85.md","items":[{"id":"1","anchor":"batch-85-item-1","t":"`85-1` · 极简一气呵成摸底、单页拍板与逐片行为等价证明的代码现代化工作流","d":"① 只读前四步连贯摸底＋单页一次拍板（`MOD-01～04`）：零文件修改一气呵成完成可运行性／风险评估、模块／入口／数据流地图（点击直跳真实文件）、带代码／测试出处的业务规则提取与改造方案对比，汇总进一张 `84-B` `E7` 交互计划页（高置信规则默认预勾、仅置顶待确认疑问项），经 `39-2` 平台可信决定入口一次拍板锁定计划与验收规则（不把提取规则擅自写成 Goal／Todo）；② 分片隔离改造与无冗余打断接续（`MOD-05～06`）：按获准分片在沙箱／`plugins/native/git` 工作树（未开 `Git` 平滑降级文件检查点）推进，复用 `62-1A` `Cache-Safe Fork` 共享前缀，已获准分片连续执行，仅在越权写入／命令、等价对比不过或计划变更时暂停请求决定，取消／撤权迟到结果零副作用且恢复不重放已生效写入；③ 独立行为等价证明与增量状态页（`MOD-07～10`）：直接复用 `66-1`/`66-2` 独立验证者与安全专科复核（问题进待处理项、不自动硬改），将测试＋对照运行＋覆盖／未覆盖边界挂入 `32-2` `modules/acceptance` 与 `66-1` 三层证据卡（绝不以「测试通过」冒充完整等价证明），输出仅报 delta 的一页式可刷新报告，并在真实遗留模块上跑通完整闭环","track":"B","occ":true,"also":[],"kind":"实现"}],"pre":["62","66","84","111"],"soft":[],"cond":["不等 84-A"],"split":false,"nodes":[{"id":"85","items":[0],"hard":["84.2","66.1","66.2","62.1","111.1","111.2","111.3"],"partial":[]}]},{"id":"86","title":"Harness 效率实验","stage":"4","intro":"确定性的缓存与热路径止血已经前置在 `91A` 和 `62` 做完；这一批专门拿真实考题做 5 组严格的效率同场对照实验（首个完整跑通「完整轨迹诊断 ＋ 三层样本准入 ＋ 实验记忆账本」闭环的标杆批），并按领域拆成 2 个互不等待的独立并行 PR（`86-A` ∥ `86-B`）：  1. `86-A` · Coding 效率三组实验与跨模型提示词瘦身剪枝（独立 PR 1，等 `67-2` 就绪即可先行）：在 `67-2` 真实基线上逐项同场比拼 ① 轻量有预算仓库概览（Repo-Map）vs 按需查符号／搜文件、② 显式干净交接（Clean Handoff）vs 自动压缩、③ 有界多步工具编排（`code-mode`）vs 一步步单调工具、⑤ 跨模型提示词瘦身剪枝（砍掉对新模型反而帮倒忙的啰嗦约束）。 2. `86-B` · 插件创作台阶段简化实验（独立 PR 2，等 `83-A` 创作基线就绪后对比）：在 `83-A` 建立的创作台同口径基线上对比现有多阶段流程与精简阶段流程，看能否在不降首次可用率的前提下少绕弯、省耗时与费用。  核心铁律：① 零重型新依赖、零私自换 SDK（`Clean Handoff` 与结构化 `code-mode` 直接消费 `62-0` 窗口 B 已换入能力；Repo-Map 只用现有目录树与 `find-symbol`，严禁引入向量库或后台常驻索引服务）；② 败者代码彻底清零——只有通过三层验证并在质量、耗时、费用与代码复杂度上综合胜出的改动才合入正式代码，跑输或打平的实验分支合入前从业务源码彻底删净（绝不留隐藏死开关），全部 5 组胜负数据与轨迹复盘统一写入 `63-2` 图形化「`设置 › 评测`」管理后台（`evaluation.db` SIM 账本 ＋ `evals/sim-ledger/`），并与 `75-A` 本机用量面板核对缓存省钱口径一致。默认零配置不增加用户操作负担；若胜出方案涉及操作路径变化先做样给你看。","ask":"","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/86.md","items":[{"id":"1","anchor":"batch-86-item-1","t":"`86-A` · Coding 三项效率对照与跨模型提示词瘦身剪枝实验（独立并行 PR 1）","d":"基于决定 58 Meta-Harness + RRSI（`tuning`／`validation`／`holdout_ood` 三层准入 ＋ 复杂度／token／延迟正则化）+ SIM 闭环，在固定模型、授权与 `67-2` 同一任务产物判分上对照：① 轻量预算化 Repo-Map（复用既有目录与 `find-symbol`，严禁新建向量库或常驻索引）vs 按需检索；② `62-0` Amp Clean Handoff vs 自动压缩；③ `62-0` 结构化 `code-mode` 程序化工具编排 vs 逐次工具调用（核对达标率、错误副作用、耗时与 token，调用次数仅作解释）；⑤ 跨模型 Prompt 消融剪枝（胜出精简版严格走 `tooling/versions.json` 升版、`.en.md` 同步与 `WORDING_HISTORY`，守 `N31-ALL-PROMPTS-01` 与 `content-versions.mjs`）。仅合入 Pareto 胜出改动，未胜出实验代码合入前从业务源码彻底删净（零死开关）；全部假设、轨迹依据与胜负复盘写入 `evals/sim-ledger/` 与 `63-2`「`设置 › 评测`」后台，核对 `75-A` 缓存省钱口径一致","track":"B","occ":true,"also":["C2"],"kind":"实现"},{"id":"2","anchor":"batc uption-roadmap/reference/batches/102.md","items":[{"id":"1","anchor":"batch-102-item-1","t":"工作台去 Layer 1 双套 iframe、拆插件基础 CSS 与清理前端热路径","d":"① 废除 `apps/workbench/src/scripts/client/tab-workspace-panes.ts:255` 分屏时嵌套第二份 2.7 MB 全量 Workbench `iframe.tab-content-frame`，改为单文档 CSS Grid 分屏（同步修订 `S-30` 仅留侧栏框，完整保留 Layer 2 插件 `srcdoc` 隔离与 `S-47`/`S-ui-text-page`）；② 为 `apps/workbench/src/browser/plugin-frame/document.ts:40` 拆出专用 `<80 KB` `molis-work-plugin-base.css`（用 `@layer` 减 `!important`，不再给每个插件框灌 1.4 MB 全站样式），并将 `child.ts:154` 串行脚本加载改为 `Promise.all` 并行、把插件 `<link>` 移入 `<head>` 防闪屏；③ 修复 `plugin-frame/fetch.ts:86` 非 JSON 请求体强行 `JSON.parse` 报错；④ 在 `plugin-frame/navigation.ts` 补齐插件框快捷键转发（`⌘[`/`⌘]`/`⌘⇧T`/`⌘⇧↵`/`⌘.` 并区分平台 `metaKey`/`ctrlKey`）；⑤ 清理 10 个常驻 `document.body` 全子树 `MutationObserver` 与内联脚本 61 处空 `catch`；⑥ 收口 `apps/workbench/package.json` 35 条串联 CLI `esbuild` 为单脚本（保留 `UI_REQUEST_CLIENT_SCRIPT` 首位加载合同）","track":"D","occ":true,"also":["C1"],"kind":"实现"},{"id":"2","anchor":"batch-102-item-2","t":"沙箱批量 RSS/CPU 监控与 Tauri 桌面壳/端口/CLI 维护硬化","d":"① 沙箱（严守 `S-15`）：`packages/plugin-sandbox/src/runner.ts:218-229` 将每插件独立 200ms `/bin/ps` 改为单一宿主批量/原生 `proc_pidinfo` 监控器（保留堆外 `Buffer` RSS 与返回后 `while(true)` 截断，100% 过 `plugin-sandbox.test.ts:255,350`）；优化 `apps/local-host/src/project-statement-worker.ts:31-71` 过重轮询开销；② Tauri 桌面（`apps/desktop/`，严守 `S-07`/`S-14`/`S-21`/`S-upgrade-lock-only`）：`main.rs:288` 4 秒健康抖动恢复改前端事件平滑重连不再 `main.navigate` 清草稿；`main.rs:745` 分级守 `S-14` IPC（低危 UI 用 2–3s 租约缓存 + 活跃端口 URL 核对，高危命令 `files_*`/`context_directory_*`/`rollback_*`/`runtime_settings_set`/`personal_account_request`/`shelf_admit_paths` 保留长连接 HMAC 验权或启动 nonce）；`apps/desktop/src-tauri/Cargo.toml` 启用 `objc2-app-kit` `\"NSAlert\"`，在 `main.rs` 恢复 `RunEvent::ExitRequested`（原被 `44-7` 随 `capsule` 一并移除）拦 `⌘Q` 与托盘退出，后台 ≤400ms 查活任务后弹原生 `NSAlert`；`apps/desktop/src-tauri/tauri.conf.json` 设严格静态占位页 CSP（管 `tauri://localhost` `webview-placeholder/index.html`，动态 `S-21` 留 `local-host` HTTP `PAGE_CSP`）并在真实 macOS WKWebView 实测非白屏补 `S5`；LaunchAgent/CLI/Tauri 统一「优先 `4173`，被占回退 `4174–4199` + `run/endpoint.json` + HMAC `/health?challenge=`」；保留 `storage-owner` 排他锁，Host 存活时 CLI 维护/备份经 `S-07` 控制网关走常驻 Host（`VACUUM INTO`/Online Backup）","track":"F","occ":true,"also":["C1"],"kind":"实现"}],"pre":["36A","100"],"soft":[],"cond":["等 36A 壳层合入，与 102-2 及 103 并行","不等 36A，与 102-1 及 103 并行"],"split":true,"nodes":[{"id":"102.1","items":[0],"hard":["100.2","36A.1","36A.2","36A.3"],"partial":[]},{"id":"102.2","items":[1],"hard":["100.2"],"partial":[]}]},{"id":"103","title":"SQLite 连接复用、休眠唤醒索引、读并发与 Host 热路径提速","stage":"2","intro":"现在项目一多，后台每 30 秒会把所有休眠项目全部唤醒扫一遍，打开过的项目也不会空闲回收；点一下界面或侧栏会重复开关几十次 SQLite 数据库，每次打开还白占 16 MB 页缓存、顺带往库里写 5 MB 永不执行的内置插件死代码；连纯只读的页面查询也要跟写操作挤在同一条串行队列里排队；热路径上还有同步打包脚本和全表扫描动作目录。这一批不合并现有分库边界、也不大搬 748 个宿主文件，而是精准解决这几处最重的存储连接、唤醒惊群、队列阻塞与热路径扫描瓶颈，让开关页面、切换项目和长期常驻明显更快更省内存。","ask":"无新增界面定样；首页怎样显示睡着的项目已由你定（显示入睡前读数，见下方「103-1 实际做法与偏离」）。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/103.md","items":[{"id":"1","anchor":"batch-103-item-1","t":"休眠项目唤醒索引、热点库长连接复用与 `ProjectLine` 纯读并发","d":"① 在 `catalog.db` 按升级链新增轻量索引表 `project_wakeup_index(project_id, job_id, next_due_at, enabled)`，彻底消除 `web-project-schedulers.ts:30-70` 每 30s 唤醒全部休眠项目的惊群，并为 `LocalHost` 增加打开项目 LRU 空闲淘汰（保证定时任务与 Feed 自动拉取按时精准唤醒）；② 不合并现有 SQLite 文件：对高频按次开关库的服务（如 `mainline`、`connectors-store`、`home-plugin-store`）改为进程内单长连接复用（保留 `assertSqliteBaselineShape` 仅首次打开跑 1 次，保护全部 7+ 同步触发器安全测试）；`CACHE_SIZE_KIB` 从 `16000` 降至合理的 2–8 MB；停止为 `HOST_BUILD_TRUST` 内置插件写入每库 ~5 MB 永不加载的死 `module_source`（保留第三方安装包的 `module_source` 并刷新对应金样与 `pnpm schemas:update`）；③ 保留 `ProjectLine` 生命周期/引用计数/`isBusy`/ALS 作用域，仅将全部纯只读 Query 动作（`operation === \"query\"`/`effect === \"read\"`）设为默认并发，未验证写命令保持项目内串行（消除读队头阻塞，零写竞态、零 AB-BA 死锁）","track":"C1","occ":true,"also":["C3","F"],"kind":"实现"},{"id":"2","anchor":"batch-103-item-2","t":"Host/MCP/Sessions 热路径去全量扫描、异步化与高收益冗余清理","d":"① 消除每次 HTTP 构造 `localWebActionContext` 全扫动作目录改为 `discoverOne` O(1) 点查，并合并首屏零散读请求为聚合 bootstrap；② `served-page-text.ts:81-96` 主线程同步 `esbuild.transformSync` 改异步缓存打包；③ `apps/mcp/action-tools.ts:104` 每调用全量 `discover` 改 `discoverOne`；④ `horizontal/sessions/src/git-files.ts` 去同步 FS 并补全 `/subagents/` 轨迹发现；⑤ 内化 `packages/contracts/src/platform/external-tools.ts` `as const`（保留 `ExternalToolId`/`ExternalToolWith` 推导，立减 3,672 行 API 快照，严禁改动 `platform/plugin.ts` 的 `export *`，跑 `pnpm api:update`）；⑥ 清理已核实的 `M-V2`/`M-V3` 死路由与零代码调用脚本（同步更新对应文档引用，守 `tests/ci-product-subset.txt:310` 不删整行），收口 Host/Runtime/Agent 关键热路径静默吞错","track":"C1","occ":true,"also":["C3","D"],"kind":"实现"}],"pre":["101"],"soft":[],"cond":["消 30s 惊群，与 102 及 91 并行","44 批 #2155 已合入，与 102 及 91 并行"],"split":true,"nodes":[{"id":"103.1","items":[0],"hard":["101.1","101.2"],"partial":[]},{"id":"103.2","items":[1],"hard":["101.1","101.2"],"partial":[]}]},{"id":"104","title":"非 Agent 单次 AI 纳管与面向非技术用户的统一报错体验","stage":"2","intro":"除了助理和 Coding 对话之外，平台里还有 11 个内置插件与 9 处平台自有能力会直接做单次文字生成、判断或生图调用——现在这些调用既没有统一的系统前缀、失败重试和备用模型切换，单次文字调用还要反复开关 5 次模型数据库，甚至漏了取消信号；同时，无论对话还是单次 AI 出错，界面经常把 `MODEL_CONTEXT_OVERFLOW`、`401` 这类英文内部错误码直接扔给普通用户，点重试还把刚传的附件丢掉。这一批把全部非 Agent 单次 AI 纳管进同一套健壮的调用基础（为第 `63` 批遥测与第 `75` 批费用账单铺平接口），并把全站 AI 报错统一翻译成直白人话加可直接点击的下一步动作。","ask":"复核报错文案与动作按钮的直白说法。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/104.md","items":[{"id":"1","anchor":"batch-104-item-1","t":"全量单次 AI 调用（11 内置插件 + 9 平台能力）双通道纳管与显式备用模型","d":"统一治理底层入口（`host-complete-text.ts`、`plugin-model-service.ts`、`plugin-image-generation-service.ts`）并无死角覆盖全仓全部单次 AI 调用方——11 个内置分区插件（`Pages`［补齐 `ai-run.ts:23` 缺失的 `signal` 与 `beforeDispatch` 取消/撤权守卫及 `generate.ts`］、`Cognia`、`Dataset`、`Feed`、`Form`、`Issues`、`Lingguang`、`PPT`、`Todo`、`Workflows`、`Images`；注：`Jelly` 私有 AI 拆解与独立模型台已随 `112-2` 瘦身砍除）与 9 处平台自有能力（纯平台 `modules/shelf/src/surface/ai.ts`、`modules/judgment-rules`、`horizontal/plugin-studio`、首次引导 `context-onboarding-service.ts`、知识整理与定位 `knowledge-actions.ts`、记忆提炼与整理 `memory-extractor.ts`／`memory-upkeep.ts`、技能起草与工坊评测 `skill-authoring.ts`／`skill-workshop.ts`、外部会话建议 `sessions-ports.ts`、插件信任审阅与通用起草 `plugin-trust-actions.ts`／`model-draft.ts`）：① 按决定 67（裁决 ③）落地单次调用双通道分离（直接消费 `91-2` 补齐窗口 A `A1`/`A3`/`A4` + `#142`～`#145` 的唯一一次 `vendor/prologue-sdk/` 换包基线，本批不重复换包）——系统指令（`[optionalSystem, primary, optionalReplyLanguage]`）送 `system` 通道、用户数据经 `fencedMaterials` 封装送 `user` 通道（数据为空时传非空安全占位文本，严禁空 `user`），由显式 `reply_language_policy`（`\"follow_locale\"` / `\"fixed_schema\"`，严禁给纯结构化 JSON 提取器盲加回复语言污染 Schema）替代单串上下拼接，有 Schema 的 JSON 调用优先升原生 SDK `structured` 校验并按需启用 `prompt_cache: \"best-effort\"`，同步更新 `S-13`/`S-66` 拒绝测试、`pnpm api:update` 与 `OBSERVATION_COVERAGE_PLAN`；② 有界重试与严守本人授权的备用模型切换（2026-11-25 拍板）：基于 `PROVIDER_SAYS_RETRY` 对当前模型做有界短暂重试；在「设置 › 模型」提供默认关闭的可选「备用模型（`fallback_selection`）」配置（零 SQLite DDL 新增，随现有模型偏好/配置 JSON 存储），仅当用户本人显式配置了备用模型、且主模型遇到网络波动/429 限流/5xx 临时故障时才自动切往该备用模型（遇 401/403 凭据失效、400 上下文超长、或未显式允许跨本地/云端供应商时严禁偷偷自动切换，防止本机隐私模型外泄或意外扣费），并在执行回执与工作记录中如实标注实际完成的备用模型；③ 消除 `host-complete-text.ts` 单次调用开关 `models.db` 5 次的冗余连接（保持 `PLUGIN_MODEL_LIMITS` 5,000/12,000 合同不变）；④ 在 `ModelRecord`（`models_json` JSON 结构，零 SQLite DDL 升版）补齐可选 `max_output_tokens?: number` 并给内置模型模板补准真实 `context_tokens` 与输出上限（替代 `prologue-run-params.ts:4,18` 硬编码 `32_768`）；预留脱敏遥测挂点供 63 Piece 0 与 75 接入（守 `S-observation-records`/`S-18`）","track":"C2","occ":true,"also":["E"],"kind":"实现"},{"id":"2","anchor":"batch-104-item-2","t":"面向非技术用户的全站结构化三语大白话报错转译与无损安全重试","d":"沿 101-1（`#2189`）类型化动作键与 `AGENTS.md` 出口统一转译规则，全面收口 `host-complete-text.ts`（清除十余处裸 `new Error(\"中文...\")`）、`packages/contracts/src/modules/model-providers.ts`、`prologue-stream.ts`（含清除第 158 行拿中文 `\"上下文整理\"` 做逻辑匹配的违规写法）、`assistant-present.ts`、`assistant-error.ts`、`plugins/native/coding/src/browser/main/run-facts.ts` 及全部 11 个内置插件 + 9 处平台单次调用面：底层仅抛带参数的结构化 `ActionError(code, kind, details)` 或标准推理错误码，在 Host HTTP/SSE/WS 与 Prologue 出口统一按当前界面语言（`zh`/`en`/`ja` 三语零二元分支）转译为直白人话 + 类型化恢复动作 ID（401/403 一键直达模型设置、400 上下文超长提示精简材料、点击「重试」完整无损带回原始输入草稿与已传附件/引用材料、遇 `EFFECT_RECONCILE_REQUIRED` 等结果未知外部副作用明确提示先核对结果且严禁提供盲目重放按钮）","track":"A","occ":true,"also":["B","C2","D"],"kind":"实现"}],"pre":["91","101","112"],"soft":[],"cond":["依赖 91 多厂商修复与 112-2 Jelly 瘦身清退私有 AI","消费 101-1 动作键雏形与 104-1 纳管口径"],"split":true,"nodes":[{"id":"104.1","items":[0],"hard":["91.2","112.2"],"partial":[]},{"id":"104.2","items":[1],"hard":["104.1","101.1"],"partial":[]}]},{"id":"105","title":"审批防链式 RCE 加固、分类跨重启续接与高频体验收口","stage":"2","intro":"日常用助理和 Coding 干活时有几件最打断节奏的痛点：改 5 个文件跑 3 个测试要反复弹七八次确认窗，重启软件后未批完的卡片会直接废掉卡死；打开子代理列表和点主线按钮会反复重放全量历史或全目录扫描导致发卡；「AI 记下的约定」记错了还不让人直接点开改；预览态的写按钮让人点完才弹报错。这一批把这些高频摩擦一次修顺，同时在放宽重复审批时用四层硬安全护栏彻底堵死命令注入和敏感文件篡改风险，绝不牺牲任何一条安全底线。","ask":"复核免批规则的 4 层安全护栏与「AI 记下的约定」就地编辑交互样稿。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/105.md","items":[{"id":"1","anchor":"batch-105-item-1","t":"防链式 RCE 免批护栏、全分区分类跨重启审批续接与审批列表局部刷新／批量原子底座","d":"① 4 层防链式 RCE 免批护栏（同步修订 `S-22` 与拒绝测试）：不可前缀化黑名单（严禁 `bash`/`sh`/`zsh`/`python`/`node`/`curl`/`env`/`xargs` 等解释器与包装器建立前缀免问）；仅允许 `(executable, subcommand)` 锚定白名单 + 禁危参 + 安全相对路径 + `env_allowlist: []`；工作区编辑免批硬排除安全敏感文件（`.env*`、`.git/hooks/*`、`.github/workflows/*`、门禁与配置脚本等）；在 第 65 批 OS 沙箱就绪前，命令前缀免批默认仅开放只读检查类命令；② 全分区分类跨重启审批续接（同步修订 `S-review-decision-provenance`，对齐 `109`～`110` 统一工作分区［含 `\"personal\"` 个人空间与项目分区一致走无 `project_id` 列的分区规则表］、开放审查种类与 D6=B Git 插件，Clean v1 不保留旧四字段决定历史兜底）：仅限 `pending.state === \"open\"` 且 `dispatch.state === \"not-dispatched\"`（永不重放 `unknown`）：不再写死旧审查枚举，按插件声明的审查续接策略分发——`workspace-patch` 验盘 `sha256`、`command` 经 `plugins/native/git` 公开动作验 `git_head_sha` + `worktree_status_sha`（无论该分区未启用 `Git` 插件，还是启用了 `Git` 但当前工作目录并非 Git 仓库［如个人空间或纯文档文件夹］，一律优雅降级为显式人工重新确认，绝不抛错卡死）、`change-capability`/`mcp` 降级为「重新检查并执行」新续跑轮；③ 审批面板局部无感刷新与批量原子审批宿主底座（2026-11-25 拍板解耦）：将 `apps/workbench/src/scripts/client/agent-review.ts:159` 从 `container.innerHTML = data.html` 整区推倒重绘升级为 Keyed DOM Patch（多子代理/多会话并存待批卡时单卡状态变更绝不丢失相邻卡片焦点、滚动位或输入一半的备注），并在宿主审查队列落定同波多请求收齐决定再提交、任一拒绝自动撤回同波兄弟的批量原子结算底座（底层引擎 `invokeAll` 并行波联动归 62 接通）","track":"C2","occ":true,"also":["A","B","C1","D"],"kind":"实现"},{"id":"2","anchor":"batch-105-item-2","t":"双子代理终态缓存、Mainline 增量校验与日常高频交互润色","d":"① 为助理两套子代理引擎补齐终态摘要缓存，消除打开列表时 N+1 全账本重放（保留各自生命周期与 `S-subtask-review`）；② `horizontal/mainline` 按钮与跨分区读基于 `108` 的 `overview_projection`（不再依赖已退役的 `isHomeAggregateQuery`）做增量版本校验，淘汰全目录扇出重扫 + `isDeepStrictEqual`；③ 对话右侧信息栏「AI 记下的约定」（`assistant-dock` / `assistant-island`）直接调用唯一记忆写主人（`bound.memory.update` / `forget`，与 `settings-memory.ts` 同源，严禁另建存储）支持当场一键纠正改字或忘掉，并默认折叠繁琐内部回执细节；④ 场景包/生成首页预览态直接禁用写按钮并给明确三语（`zh`/`en`/`ja`）原因提示（严守 `S-blueprint-consent-context`）","track":"A","occ":true,"also":["C2","C3","D"],"kind":"实现"}],"pre":["39","91","100","111"],"soft":[],"cond":["不等 62","批量 invokeAll 编排留 62-1A","不等 62，与 105-1 同批推进"],"split":true,"nodes":[{"id":"105.1","items":[0],"hard":["39.1","39.2","100.2","91.2","111.1","111.2","111.3"],"partial":[]},{"id":"105.2","items":[1],"hard":["100.2","111.1","111.2","111.3"],"partial":[]}]},{"id":"106","title":"统一工作分区批 A：分区底座、单套装配与总览/到期基础设施（只加不删）","stage":"2","intro":"要把「个人插件」和「项目插件」合并成一套统一工作分区模型（个人空间 `personal` + 各个项目完全同构），如果一口气改完合同就删旧代码，20 个内置插件还没迁完会让主干彻底变红。按先加、后迁、再删的策略（V1），这一批专门把新底座全部架好并让主干保持全绿：统一分区根目录算法 `partitionRoot()`（把个人空间搬到 `<Home>/personal-space/`）、Home 初始化建好 `personal` 并锁死保留字、建好 `partition_plugins` 与 `partitions.plugins.set@1`（供场景采用和助理配置共用）、建好每分区实例的新装配、落地本人级设置 `horizontal/person-settings`（直接复用 `#2231` 个人配置同步流）、平台证据账本 `horizontal/evidence`、休眠分区到期登记与平台定格式总览表 `overview_projection`（零 SQL） 总览索引，并补齐资料全分区、个人空间右栏 IM 与双层自写 Skill 底座。","ask":"无新增未决决策，按已拍板的决定 66实施，不动真实 `~/.molis-work`。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/106.md","items":[{"id":"1","anchor":"batch-106-item-1","t":"分区根 `partitionRoot()`、保留分区守卫与 `listPartitions()` 全量归类","d":"① 在 PR 中附 `project_id: null`（~660 处）、`listProjects()`（54 处）、`host.projects()`（44 处）与直扫 `projects/` 目录的逐文件归类表；② 唯一 `partitionRoot(id)`（`personal` → `<Home>/personal-space/`，项目 → `<Home>/projects/<id>/`），快照/恢复/升级枚举/成果行/卸载清理/`stores.tsv` 全走它并补「个人空间 + 独立库」往返测试；③ Home 初始化幂等建 `personal`、删 5 处懒建入口、修 `onboarding.ts` 首次运行判断；新增 `S-personal-partition-reserved` 拒绝测试；拆分 `listProjects()` 与 `listPartitions()`","track":"C1","occ":true,"also":["C3","F"],"kind":"实现"},{"id":"2","anchor":"batch-106-item-2","t":"Home 单张安装表、`partition_plugins`、`partitions.plugins.set@1` 与新每分区装配","d":"① 安装记录/升级/签名/同意统一落 Home 软件层一张表；② `catalog.db` 落地 `partition_plugins` 与 `partitions.plugins.set@1`（扩 `scene-and-page-contract` P-3a 到个人空间，带成员 revision，按 V6 供场景采用与助理配置共用）；③ 落地按 `(plugin, partition)` 启动与闲置停的新装配（与旧装配短期并存、不读旧数据）；④ `material-original-files.ts` 与 `material-attachments.ts` 改为全分区（清零 `project_id = \"\"`）；个人空间保留右栏 IM（R21），自写 Skill 声明双层（个人全局 + 项目分区，R22）","track":"C1","occ":true,"also":["C3","E"],"kind":"实现"},{"id":"3","anchor":"batch-106-item-3","t":"新平台基础设施：`person-settings`、`evidence`、到期登记、声明式 `overview_projection` 与 Manifest 新字段","d":"① 新建 `horizontal/person-settings`（直接复用 `#2231` `personalConfigReplica` + `assertPortableConfig`，SDK 拒绝将密钥/连接/本机路径标 `portable: true`）与 `horizontal/evidence`（跨分区证据引用账本），登记 `package-owners`/`workspace-packages`/`SSOT-MATRIX`；② 平台到期登记入 `horizontal/scheduler`（对齐 `#2257` 交替一次性唤醒槽与 `S-partition-wake-scope`）；③ 总览索引扩展 `horizontal/search`：平台定好待办/日程/通知/简报四种「总览表」格式，插件在自己分区库里随业务写入同事务维护（SDK `overviewRows` 帮手与校验，重复日程展开未来一段时间），平台只读（`SQLITE_OPEN_READONLY`）+ 盖章 + 同步 `dirty` 懒刷新 + Attention 投影 R13；到期登记从总览表的提醒时间列取（同步来的提醒不漏），第 `95-3` 批 7 天漏跑过期归到期登记（V11）；④ Manifest 增 `databases.partition`、`push`、`overview_projection`（只声明种类）、市场类别、依赖声明（含通用的随启用 `enable_with`，V9）；⑤ `skills/molis-plugin-dev` 新增「总览表与到期提醒」「推送声明」「分区存储」「依赖与随启用」四节，Manifest 字段说明与 SDK 注释同批写好，跑 `pnpm studio:replay`","track":"C3","occ":true,"also":["C1","G"],"kind":"实现"}],"pre":["44B"],"soft":[],"cond":["统一工作分区批 A，只加不删","排在 107～111 与下游批次之前"],"split":true,"nodes":[{"id":"106.1","items":[0],"hard":["44B.1","44B.2","44B.3"],"partial":[]},{"id":"106.2","items":[1],"hard":["106.1"],"partial":[]},{"id":"106.3","items":[2],"hard":["106.2"],"partial":[]}]},{"id":"107","title":"统一工作分区批 B1：独立库 6 插件迁分区与旧 `project_rows`/复用器删除","stage":"2","intro":"Pages、PPT、Form、Dataset、灵光、Workflows 过去虽然名义上按项目运行，数据却混在 Home 下的同一份共享 SQLite 库里靠 `project_id` 过滤，还要靠 `project_rows` 钩子清理、靠跨库 `artifact_join` 逼迫库退回 `DELETE` 日志模式。这一批把这 6 个插件一次性迁到各自的分区独立库（`<分区根>/libraries/<库名>.db`），删掉它们业务表里的 `project_id` 列，并当场删掉已无人用的 `databases.home.partition` 复用器；`databases.home.project_rows` 与跨库 `artifact_join` 还有 Images、Todo（`108`）和 Work Brief（`109`）在用，留到第 109 批最后一个用户迁走后再删。","ask":"无新增未决决策，按已拍板的决定 66实施。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/107.md","items":[{"id":"1","anchor":"batch-107-item-1","t":"6 个独立库插件迁 `databases.partition` 并删业务表 `project_id`","d":"`pages`、`ppt`、`form`、`dataset`、`lingguang`、`workflows` 全部迁至 `<分区根>/libraries/<库名>.db`（`databases.partition`），删业务表 `project_id` 与相关 `WHERE project_id = ?`，需要跨库原子写时改走平台同分区事务端口；Pages 必需 `goals:read` 确认可选化；更新 6 插件金样写入（`tests/golden-writes/*.ts`）；先在宿主接上第 106 批的新装配（106 只加了，生产里还没有构造点）：构造 `PartitionPluginAssembly` 与 `PartitionPlatformServices`、成员读 `partition_plugins`、闲置停、改成员后调 `stopPlugin` 与 `pluginDisabled`、到期定时器随宿主起停、同步写入与恢复后调 `partitionChanged`，并补一条签名包在分区实例里安装与升级的端到端用例；Home 插件存储与分区实例各开一份安装目录、指向同一组 Home 表，核对没有互相过期的内存缓存；复查第 106 批移交项（资料原文件与附件登记在 Home 级与个人空间共用键时卸一边清另一边、`createProject({ project_id: \"personal\" })` 裸 `Error`、安装诊断计数断言）（注：106 合后复查修复 PR 已先行闭合安装行与 `(install_id, partition_id)` 运行态拆分、`acquire` 停/取竞态、`declarationOwnersFor` / `assertSurfacePresentation` 改读 Home 安装表）","track":"E","occ":true,"also":["C1"],"kind":"实现"},{"id":"2","anchor":"batch-107-item-2","t":"当波删除 `databases.home.partition` 复用器；6 个插件不再用 `project_rows`／`artifact_join`","d":"删除 `packages/contracts/src/platform/plugin-database.ts` 的 `partition?: \"project\"` 与 `apps/local-host/src/plugin-database-partitions.ts` 复用器（全仓无插件使用）；这 6 个插件去掉自己的 `project_rows` 声明与 `artifact_join`，机制本身留到 `109-3` 删（Images、Todo、Work Brief 仍在用）；清退第 106 批一次性门禁例外（清空或删退 `tooling/gates/schemas/v1-reset-exceptions.json` 及 `tooling/gates/schemas/same-version-exceptions.json` 中已合入 main 的 106 目录库与 `person-settings` 条目）；同步 `schemas:update`（验证 6 个 `<partition>/libraries/<store>.db` 进入 `stores.tsv`）、`api:update`、本批必需的 `same-version-exceptions.json`（V7），并按 44B「金样不重生」规则就地更新 `0.1.0` 等金样与摘要（`scripts/golden/layout.mjs`，防止破坏 `initial-versions` 门禁）","track":"C1","occ":true,"also":["E"],"kind":"实现"}],"pre":["106"],"soft":[],"cond":["统一工作分区批 B1","project_rows 与 artifact_join 的机制归 109-3"],"split":true,"nodes":[{"id":"107.1","items":[0],"hard":["106.1","106.2","106.3"],"partial":[]},{"id":"107.2","items":[1],"hard":["107.1"],"partial":[]}]},{"id":"108","title":"统一工作分区批 B2：原 Home 5 插件迁分区、个人空间总览上线与个人分类清零","stage":"2","intro":"待办（Todo）、日历与笔记（Jelly）、个人知识库（Cognia）、图片生成（Images）、问题反馈（Issues）这 5 个插件，以前全部混在最外层 Home 全局运行，逼着插件在自己肚子里硬区分“个人还是项目”（比如待办自己搞了三态位置、已删项目墓碑表和 20 个跨项目读取动作），而且没法在各个分区按需开启或拿掉。  这一批做四件事： 1. 5 个插件彻底改成标准分区插件：先在插件运行环境里接通「本人级设置（`services.personSettings`）」与「到期提醒回调」两个接口，把跟人走的偏好与授权（生图连接、知识库本地目录授权；注：Jelly 私有模型选择台已随 `112-2` 瘦身砍除）迁进本人设置，把待办提醒、日程提醒、生图后台队列迁进平台到期登记（休眠时零进程，到点只唤醒对应分区的这一个插件），清掉待办里的历史只写废表 `todo_imported_changes`；按统一总则不设个人空间默认特例名单（空白开始只开 `Schedule`，按反馈快捷键或点「记到个人空间」遇到未启用时给一键开启确认）。 2. 个人空间跨项目总览上线（零唤醒 + 门禁 G4）：补齐总览只读扫描对各分区主数据库平台「等你 / 通知（`attention_entries`）」表的读取（与插件独立库的总览表一起汇总，每日简报跨分区总览待 `109-1` Work Brief 迁完接入），换掉旧的 `home-aggregate.ts`；在「设置 › 个人助理」落稳跨项目总览的逐项目、逐字段授权开关（实时复核、撤权即断）；上线 G4 零唤醒与常数开库门禁。 3. 彻底删掉「个人插件分类」与「隐藏」机制：删掉全仓剩余的 `personal: true`、`hidden` 排除表、`project_reach` 跨项目读协议，以及这 5 个插件自己的 `runtime.scope: \"home\"` 与顶层旧库登记（普通插件 `runtime.scope: \"home\"` 机制本身留到 `109-3` 随 Feed/Work Brief Home 半迁走后彻底删除）。 4. 兑现备份金样覆盖：为第 `106` 批新建、在本批首次产生真实写入的 `person-settings.db` 与 `due-registry.db` 补齐金样写入与 `golden-coverage.json` 覆盖登记。","ask":"无新增未决决策，按决定 66与 2026-11-25 确认的「空白开始统一只开 Schedule、快捷入口未启用时给一键开启确认」实施（迁入前同步处理 `107` 留下的 `apps/local-host/src/former-personal-plugins.ts` 补写名单边界）。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/108.md","items":[{"id":"1","anchor":"batch-108-item-1","t":"插件侧接通 `personSettings`／到期回调；Todo、Jelly、Cognia、Images、Issues 迁分区与 `databases.partition`","d":"① 平台端口兑现：向插件运行时注入 `services.personSettings` 与到期唤醒回调 `deliverDue`；取消 `plugin-declared-services.ts` 对分区实例声明 `owner_files`/`model_configuration`/`image_generation` 的限制（4.2③，`local_tools` 仍按宿主信任门控）；收紧 `plugin-installation:<install>` 连接槽仅限本机本人与获准助理使用（4.2⑤，更新 S-71）；② `todo` 迁分区：27 个 Home 动作改分区作用域，删 20 个 `project_reach` 动作、`placement` 枚举、`project_id`、`todo_deleted_projects` 墓碑表、只写无读的历史废表 `todo_imported_changes` 及 `todo.placement.move` Home 处理器；重写同步线格式 `format.todo.portable`；提醒改写总览表提醒列并走平台到期登记；③ `jelly`、`cognia`、`images`、`issues` 迁分区：基于 `112-2` 已拆好的 `jelly_items`/`jelly_series`/`jelly_notes`/`jelly_categories` 关系分表迁 `databases.partition`、日程写总览表并走平台到期登记；`cognia` 本地目录授权 `grant:*` 迁 `personSettings`；`images` 生图连接迁 `personSettings`、生成图片存分区 `owner_files`、后台生成队列改走平台到期登记；`issues` 迁分区独立库；注意 `107` 交接边界：第 107 批的一次性补写成员（`apps/local-host/src/former-personal-plugins.ts`，当前按 `databases.partition` 取）会把本批新迁入 `databases.partition` 的 5 个插件也算进去，迁之前须明确固定该一次性补写名单范围或同步处理（`tests/project-catalog.test.ts` UPP-18 断言补写的恰好是那六个，直接迁会红；见 `docs/system/CONTRACT-CHANGES.md`「当前保留机制」）；④ 统一无特例初值：个人空间空白开始不设默认特例名单（只开 `Schedule`）；全局快捷键 `Mod+Shift+I` 打开个人空间 Issues 或在项目里点「记到个人空间」（R14）时，若个人空间尚未启用对应插件，弹出轻量一键启用确认后再打开/写入","track":"E","occ":true,"also":["C1","C3"],"kind":"实现"},{"id":"2","anchor":"batch-108-item-2","t":"个人空间跨项目总览上线（承接原 `64-3`）、助理跨项目授权开关与门禁 G4","d":"① 总览全源只读覆盖：扩展 `partitionOverviewLibraries` / `OverviewService` 在只读扫描插件 `databases.partition` 总览表的同时，以 `SQLITE_OPEN_READONLY` 只读投影各分区主数据库 `molis-work.db` 中的平台「等你 / 通知（`attention_entries`）」（兑现 R13，休眠分区零唤醒；Work Brief 跨分区简报待 `109-1` 其迁入分区独立库时接入），替换 `#2254` 过渡静息读数与 `home-aggregate.ts`；② 补齐运行时健壮性（仅做 `106` `#2323`／`107` `#2325` 未包含项）：`takeDue` 唤醒执行成功后才消掉待唤醒状态（失败或宿主中断保留重试、不丢提醒），本机运行中实例写入总览表同步标脏刷新，同步更新 `OBSERVATION_COVERAGE_PLAN` 中 `107` 标记为 `not_connected` 的覆盖项；③ 助理跨项目读取授权持久化：在「设置 › 个人助理」（复用既有 `assistant.db` / P5 设置入口，不新建零散文件）提供逐项目、逐摘要字段的跨项目总览读取授权开关，接通 `overviewReach` 实时复核（撤权后缓存、在途回复与下一轮模型上下文立即剔除）；④ 门禁 G4 与唤醒隔离实证：`tooling/gates/call-budget.json` 新增「个人空间总览」场景（20 个项目 19 个休眠时开库次数为常数、休眠监督器与沙箱进程数为 0），补 G3 调用半门禁，真实进程级验证 `S-partition-wake-scope`（Todo 提醒/Jelly 日程/Images 队列到点仅唤醒单分区单插件）与个人空间右栏 IM 建群发言用例（R21）","track":"C3","occ":true,"also":["A","D","E"],"kind":"实现"},{"id":"3","anchor":"batch-108-item-3","t":"彻底删除 `personal:true` 与 `hidden`，更新金样与覆盖账本","d":"① 删除 `reachEntry({personal:true})`、全仓 `personal:true`/`PERSONAL_PLUGIN_IDS`/`PROJECT_SCOPED_PLUGIN_IDS`、`ProjectPluginMembership.hidden` 与 `catalog.db` 的 `project_plugin_exclusions` 表；这 5 个插件去掉 `runtime.scope:\"home\"`、`project_rows` 与 `project_reach`，从 `home-stores.ts` 清理这 5 个插件已废弃的顶层 `{home}/<名>/` 库登记（注：`Work Brief` 在 `109-1` 迁完前仍声明 `projects:reach`，故 `project_reach`/`projects:reach` 机制与 S-74 跨项目读协议同普通插件 `runtime.scope:\"home\"`、`outsideBuild()` 链、`home-package-admission.ts` 一并留 `109-3` 删除，防 `108` 破坏 `Work Brief` 清单校验）；② 同步改写 `S-31`/`S-49`/`S-72` 与写死个人插件名单的测试文件，交付插件开发手册总览表、到期提醒与授权读摘要示例（若碰创作台挂载章节跑 `pnpm studio:replay` + 隔离 `smoke`）；③ 更新 `tooling/gates/golden-coverage.json`（移出 `person-settings.db` 与 `due-registry.db` 的 `uncovered` 占位并在 `tests/golden-writes/` 补齐真实写入用例，更新 5 插件金样写入为分区路径），按 44B「金样不重生」规则就地更新 `0.1.0` 等金样与摘要（`scripts/golden/layout.mjs`）","track":"C1","occ":true,"also":["D","E"],"kind":"实现"}],"pre":["107","112"],"soft":[],"cond":["统一工作分区批 B2","Jelly 部分等 112-2 瘦身合入"],"split":true,"nodes":[{"id":"108.1","items":[0],"hard":["107.1","107.2","112.1","112.2"],"partial":[]},{"id":"108.2","items":[1],"hard":["108.1"],"partial":[]},{"id":"108.3","items":[2],"hard":["108.2"],"partial":[]}]},{"id":"109","title":"统一工作分区批 B3：主库去 `project_id`、Workspace Git 迁入、统一装配收口与双实例清零","stage":"2","intro":"这一批完成最后一批插件的统一分区改造，把 Git 能力彻底收回 Git 插件，并将全系统所有插件（含主库插件、无库插件和第三方沙箱插件）合并进唯一一套按需启停装配、把历史双轨代码一次删光：  1. 最后 7 个业务插件数据收干净（`109-1`）：目标（Goals）、写代码（Coding）、信息流（Feed）、收件箱（Inbox）、风险（Risk）、定时任务（Schedule）、每日简报（Work Brief）全部删掉业务表里多余的 `project_id` 列；信息流的原文引用迁入平台证据账本 `horizontal/evidence`；每日简报迁入分区独立库 `databases.partition` 并把跨分区简报摘要接入第 `108` 批上线的个人空间总览，从此全仓再无“全局一半 + 项目一半”的双实例插件，同时补齐备份检查表里 `evidence.db` 与 `personal-space/molis-work.db` 的金样覆盖。 2. Git 底层代码整体搬回 Git 插件（`109-2`，D6=B）：宿主里约 1,400 行 `workspace-git*.ts`、`projects.workspace.writers.*` 与 SDK `git-porcelain.ts` 整体搬进 `plugins/native/git`；AI 底座里的 `prologue-git.ts` 硬编码审批一并改成插件通用审查申报（保留 `#2244` 按 `install_id` 隔离），顺手清零 `44C` 留给本批的 Git 点名；启用 Coding 时默认随启用 Git（V9），允许单独移除 Git 并在确认框说明影响（V10）；在非 Git 普通文件夹（如个人空间默认输出目录）下，Git 平静提示非仓库、Coding 与 Diff 按普通文件夹平顺工作不报错。 3. 第三方沙箱开放独立库 + 全部插件合流唯一装配 + 旧双轨大扫除（`109-3`）：向第三方签名沙箱包开放 `databases.partition`；将第 `106` 批的新每分区装配升级为通吃全部 20 个内置插件（独立库、分区主库、无库）与已装沙箱包，全部统一读 Home 单张安装表并按需启停，随后删除项目数据库里的旧安装表、`HomePluginHost`/`HomeInstalledPlugins`、`dual_instance`、`runtime.scope:\"home\"`、`project_rows`、`artifact_join` 与 `projects:reach`，焊死 G2 / G3 防回流门禁。","ask":"无新增未决决策。按 2026-11-25 确认的粒度，允许本批按上述三块先后拆成 3 个独立 PR（`109-1` → `109-2` → `109-3`） 串行合入，每步保持 `main` 全绿、问题边界清晰。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/109.md","items":[{"id":"1","anchor":"batch-109-item-1","t":"`109-1`（PR1）· 主库插件删 `project_id` 列与 Feed/Work Brief 摘除 Home 半","d":"① `goals`（~20 张表 + `boards` 单例主键）、`coding`（5 张表）、`feed`（13 张表，证据持有账本迁入平台 `horizontal/evidence`、`companions` 改 Manifest 依赖声明、保留 `#2257` 精准唤醒槽）、`inbox`、`risk`、`schedule` 全部删业务表 `project_id` 列、`WHERE project_id = ?` 与同步记录冗余 `project_id`；② `work-brief` 迁 `databases.partition`、摘除 Home 半 `personal.get/refresh` 与 `projects:reach` 声明、写入总览表简报行并接入第 `108` 批个人空间总览，从 `home-stores.ts` 清掉 `feed-content` 与 `work-brief` 顶层旧库登记；③ 兑现 `tooling/gates/golden-coverage.json` 预留项（为 `evidence/evidence.db`、`personal-space/molis-work.db`、第 `107` 批 `#2325` 预留的 `personal-space/libraries/<库名>.db` 及新迁分区的 `work-brief.db` 补齐真实金样写入并移出 `uncovered`/`none` 占位），就地更新 `0.1.0` 等金样与摘要","track":"E","occ":true,"also":["B","C3"],"kind":"实现"},{"id":"2","anchor":"batch-109-item-2","t":"`109-2`（PR2）· Workspace Git 与 `projects.workspace.writers.*` 迁入 `plugins/native/git`（D6=B）+ 开放审查种类","d":"① 宿主 `workspace-git*.ts`（~1,400 行）、`projects.workspace.writers.*`（并行 worktree 与整合审查）、SDK `git-porcelain.ts`、`git.*` 错误码整体迁入 `plugins/native/git`，收口 `packages/contracts/src/modules/workspace-artifacts.ts` 中的插件专名使第 `44C` 批留给本批的 Git 点名清零；② 平台提供受限 argv-only、分区工作目录监禁、零 shell/hook 注入、宿主信任门控的受限 VCS 执行能力，新增 `docs/system/security-invariants/S-git-plugin-command-scope.md` 与拒绝测试；③ `horizontal/agent-host` 消除硬编码 `prologue-git.ts` 与 `git-*` 封闭名单，改为插件在 Manifest 开放申报审查种类、工具匹配与渲染（严格保留第 99 批 `#2244` `recovery-actions.ts:119` 的 `install_id` 隔离断言）；④ Coding 声明 Git 为随启用依赖（V9：启用 Coding 时一并启用 Git，确认框写明）；允许单独移除 Git 并先提示影响（V10），移除后 Coding 降级为单工作区串行写；Diff 声明可选依赖；在非 Git 普通文件夹（如个人空间默认输出目录 `outputs/personal`）下，Git 平静展示非仓库空态，Coding 与 Diff 按普通文件夹平顺工作不报错；工作终端、助理操作电脑等写入方启动时提示「Coding 正在这个文件夹改动」","track":"B","occ":true,"also":["C1","C2"],"kind":"实现"},{"id":"3","anchor":"batch-109-item-3","t":"`109-3`（PR3）· 沙箱开放 `databases.partition`、全插件合流唯一每分区装配并彻底清零旧双轨","d":"① 全插件合流唯一装配（收口 `107` 偏差移交）：升级 `PartitionPluginAssembly` 统一承载全部 20 个内置插件（无论使用 `databases.partition`、分区主库 `databases.project` 还是无独立库的 Git/Diff，保留分区主库同连接事务 C7 与默认端口连线）及第三方已装签名沙箱包（含安装界面把带 `databases.partition` 的包分流进按分区装配，并将 Inbox 注意力、数据导出与工作素材读取统一改走 Home 单张安装表与分区实例，兑现 `107` 实施记录移交），全部按分区按需启停；② 第三方沙箱包对齐：开放 `databases.partition`（取消 `installed-plugin-libraries.ts:189` 拒绝），将插件密钥与提示词作用域统一归 Home 层按安装登记一次（4.2⑥，更新 S-80/S-84/S-87/S-91），删除 `plugin-sandbox` 的 `homeDatabase` 效果键/代理、SDK `dualInstance` 路由与 `skill-folder.ts` `scope:\"home\"`、`plugin-cli` `--scope home`/`--home-database`、`examples/` 与 `skills/molis-plugin-dev` 旧写法（跑 `pnpm studio:replay` + 隔离 `smoke`）；③ 当波彻底删除全部旧机制：删除项目库旧安装表（`PLUGIN_RUNTIME_INSTALLS_SCHEMA_SQL` / `PLUGIN_RELEASE_ARTIFACTS_SCHEMA_SQL`）与旧 `startPlatform` 平行装配、全仓 `dual_instance` 机制（`scripts/gates/dual-instance.mjs` 归零删除、S-48 退役）、旧 `HomePluginHost`/`HomeInstalledPlugins`、普通插件 `runtime.scope:\"home\"`、`outsideBuild()`→`projectReachablePlugins` 链、`home-package-admission.ts`、`plugin-scope-entries.ts`、`assertScopeKept`、`databases.home.project_rows`、跨库 `artifact_join`、`project_reach`/`projects:reach` 与 S-74 跨项目读协议（自 `107`/`108` 移来收口）；焊死 G2（零双轨/零特权） 与 G3（零插件业务表 `project_id`） 门禁，更新 S-98 并就地更新金样与摘要；④ 决定 67 护栏：内置插件声明的 `methods`/`roles` 严格按调用分区的已启用插件集合过滤（防未启用插件方法跨分区泄漏），`personal_prompt_overrides` 限定在个人 `home-store` 同步域内","track":"C1","occ":true,"also":["E"],"kind":"实现"}],"pre":["108"],"soft":[],"cond":["统一工作分区批 B3","D6=B","保留 #2244 install_id 隔离","落地 G2、G3 门禁"],"split":true,"nodes":[{"id":"109.1","items":[0],"hard":["108.1","108.2","108.3"],"partial":[]},{"id":"109.2","items":[1],"hard":["109.1"],"partial":[]},{"id":"109.3","items":[2],"hard":["109.2"],"partial":[]}]},{"id":"110","title":"统一工作分区批 B4：放置、同步、搜索、MCP 与记忆去双轨","stage":"2","intro":"当全部 20 个内置插件与第三方沙箱包在 `107`～`109` 落进统一工作分区后，这一批把横跨它们的 5 个平台公共服务里的历史双轨逻辑彻底拔干净：  1. 放置（移动/复制）去旧全局特例：删掉以前专门为“外层全局待办”写的 `HOME` / `moveHome` 与放置账本里的旧归属边（注意保留划词上下文 `SurfaceFocus.belongs_to` 的父对象功能，不误伤）。 2. 搜索、助理、记忆与角色职责厘清：全局搜索（⌘K）不再把 `空（null）` 当成个人，清清楚楚标注每条结果属于「个人空间」还是哪个「项目」；个人助理在个人空间工作时传入真实分区号 `\"personal\"`（保证能正常读写个人空间里的文档、待办、日历），而记忆与角色的「本人全局层」保持独立顶层（`null`），与只属于个人空间的分区记忆严格分开，逐条对照第 `106` 批产出的逐文件归类表勾销清零。 3. 云同步收敛、零唤醒发现与「分区启用清单」同步（Clean v1 拍平）：把旧的 10 种同步范围收成「按分区 4 种 + 系统 Home 2 种」；同时关掉插件同步和成果库同步（`personal-artifact-sync.ts`）里“收到业务数据偷偷自动建项目/开插件”的后门，新增独立的「分区启用清单」同步（电脑 A 开了插件，电脑 B 自动对齐开启，未装包则提示安装）；同步扫描直接从 Home 单张安装表读取插件声明、只读扫各分区出站表，休眠项目与沙箱插件既不漏同步也不唤醒进程；按 Clean v1 统一保持第 `1` 版拍平（不平白刷出一堆第 `2` 版），并上线 G5 同步出站防泄密门禁。 4. 外部 AI 工具接入（MCP）个人空间守卫：个人空间永不作为外部工具的默认分区，必须在对外接入管理页单独勾选确认绑定后才能访问。","ask":"无新增未决决策，按决定 66与 2026-11-25 确认的「同步集合按 Clean v1 保持第 1 版拍平」实施。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/110.md","items":[{"id":"1","anchor":"batch-110-item-1","t":"放置、搜索、助理上下文与记忆/角色去 `project_id: null` 业务双轨","d":"对照 `partition-inventory.md` 逐文件勾销清零：① `horizontal/placement` 与合同删除 `HOME`、`moveHome`、放置账本里的旧归属边 `placement.belongs_to`/`belonged_to`、`homeClient()`、`nullable(projectRef)` 与 `project_id === null` 业务分支（严禁误删划词情境上下文 `SurfaceFocus.belongs_to` 父对象字段）；② `horizontal/search` 删除 `null = 个人`，改为明确分区标注（`\"personal\"` / 项目名）；③ 个人助理上下文修复：`assistant-http.ts`/`assistant-round-materials.ts`/`assistant-service-shared.ts` 等在个人空间工作时统一传真实分区号 `\"personal\"`（不再把 `\"personal\"` 转成 `null` 导致读不到个人空间插件材料，也不再把 `\"personal\"` 当跨项目通配）；④ `horizontal/memory`、`modules/characters`、`modules/judgment-rules`、`horizontal/observation`、`horizontal/mainline` 严格拆清「本人全局层（`null`，跨分区偏好与角色底层）」与「个人空间分区（`\"personal\"`，个人空间内的分区事实）」（保留 `#2250` 精确记忆绑定合同）","track":"C3","occ":true,"also":["C2","E"],"kind":"实现"},{"id":"2","anchor":"batch-110-item-2","t":"同步收敛（Clean v1 保 v1 拍平）、分区启用清单独立同步（V4）、零唤醒发现与门禁 G5","d":"① `BuiltinSyncBinding.scope` 从 10 种收敛为按分区 4 种（主库集合、独立库、分区文件、固定版本，并入 `project-sections` 与创作台 `project-private-values`）+ Home 2 种（`home-document` 归 `system.shelf`、`home-store` 归系统）；同时删除 `personal-plugin-sync.ts` 与 `personal-artifact-sync.ts:127` 中接收业务数据/成果时自动 `ensureSyncedProject` 建项目及自动 `addProjectPlugin` 的后门（建项目仅认 `personal-catalog-sync`，未就绪分区或未启用插件的收到数据先挂起）；② 同步键中的业务 `null` 改 `\"personal\"`，按 Clean v1（对齐 `44B` 与 `106` V7）保持各同步集合与可移植格式版本号为 `1` 就地拍平（不平白升到 v2、不写旧格式兼容读取）；③ 新增独立同步种类「分区启用清单」（V4，新增 `docs/system/security-invariants/S-sync-enablement-own-choice.md` 与拒绝测试），去掉 `project-catalog-replication.ts` / `personal-catalog-sync.ts` 的 `personal` 冲突路径；④ 重构 `runtime-sync-discovery.ts`：直接基于 Home 单张安装表的存储 Manifest（声明式 `sections`/`tracking`/`aggregates`）以只读连接扫描各分区出站表，彻底不启动休眠分区的监督器或沙箱进程（`S-partition-wake-scope`），休眠分区内置与沙箱插件均不漏同步，同步拉取写入休眠分区时标 `overview_projection` `dirty = 1`；⑤ 端到端验证 `personSettings` `portable: true` 经 `#2231` 流跨端同步，并上线 门禁 G5（同步出站序列化扫描零密钥/令牌/本机路径 + SDK 拒标敏感键 `portable: true`） 与 `S-person-settings-private` 拒绝测试","track":"G","occ":true,"also":["C1","C3"],"kind":"实现"},{"id":"3","anchor":"batch-110-item-3","t":"MCP 个人空间显式绑定守卫与金样校准","d":"新增 `docs/system/security-invariants/S-mcp-personal-binding.md` 与拒绝测试：个人空间永不作为外部 MCP 客户端默认分区，外部客户端会话绑定或调用 `\"personal\"` 必须在对外接入管理页经本人单独勾选确认授权后才放行（闭合 `106` 留下的显式 `bind` 缺口）；清理过期的普通插件 `scope:\"home\"` MCP 授权逻辑（干净 v1，不迁移）；同步更新快照并按 44B「金样不重生」规则就地更新 `0.1.0` 等金样与摘要（`scripts/golden/layout.mjs`）","track":"C1","occ":true,"also":[],"kind":"实现"}],"pre":["109"],"soft":[],"cond":["统一工作分区批 B4","保留 #2250 精确记忆绑定合同","落地 G5 出站防泄密门禁"],"split":true,"nodes":[{"id":"110.1","items":[0],"hard":["109.1","109.2","109.3"],"partial":[]},{"id":"110.2","items":[1],"hard":["110.1"],"partial":[]},{"id":"110.3","items":[2],"hard":["110.1"],"partial":[]}]},{"id":"111","title":"统一工作分区批 C：星型版本化 Push、界面收口、G1～G5 焊死与 Clean v1 终结","stage":"2","intro":"这是「特殊逻辑平民化 + 统一工作分区」架构重构的收官之战。它在已经彻底统一的分区底座上交付用户最直观的价值，并按三块正交工作拆成 3 个先后合入的独立 PR（`111-1` → `111-2` → `111-3`） 稳步收官：  1. 个人空间 → 项目「星型单向版本化推送」引擎（`111-1`）：先升级底层 `packages/storage` 的跨库原子事务工具，使其支持「目标项目主库 + 目标插件独立库 + 个人空间主库私有回执」三库同卷原子提交；再交付不预记三步推送与断电自动补账（`S-push-ledger-repair`）、超过 256 KiB 大快照经平台句柄分片传输（`S-push-blob-handle`）、附件与插件自有文件（`owner_files`）跨区复制及防误删持有保护、局部引用自动改指/剥离（`remap`/`strip`），以及个人助理按目标项目授权直接推送（`S-push-authority`）。 2. 14 个有业务对象的内置插件 + 第三方沙箱包一次接通推送（`111-2`）：精确覆盖 14 个有业务对象的内置插件（Goals、Feed、Risk、Work Brief、Workflows、Pages、PPT、Form、Dataset、灵光、Todo、Jelly、Cognia、Images；其余 6 个纯执行或系统流转插件 Coding、Git、Diff、Inbox、Schedule、Issues 明确不声明并用门禁钉住），第三方签名沙箱包走完全相同的声明与接口。 3. 全套新界面先定样后落地 + 按需懒加载保首屏体积 + 五道门禁焊死与文档终结（`111-3`）：在 `36A` 左上角「项目 › 事项」下拉面板左列顶部固定「个人空间」；空软件首次启动直进个人空间并将引导作为首张卡（只搭首卡容器与路由，保留新建项目入口，卡内完整 AI 追问与官方场景包推荐闭环归第 `45` 批）；插件市场按 8 类功能分组；推送/冲突/撤回弹窗与「设置 › 按分区/插件存储占用与清理旧版」页面一律做成按需懒加载资源（日常打开软件首屏零膨胀）；清零 `107`～`111` 期间全部临时结构变更白名单，把 G1～G5 五道防回流门禁全部焊死，更新全仓核心文档与插件开发手册。本批合入后，再单独弹窗向你确认时机清理开发机真实 `~/.molis-work` 与本人云同步空间。","ask":"① 审阅切换器、空 Home 首卡壳层、按类市场、推送/冲突/撤回确认框与存储占用页的高保真可点原型（按 `skills/molis-design-ui/SKILL.md` 先定样，与 `111-1`/`111-2` 后台开发互不阻塞）；② 本批合入后单独确认清理真实 `~/.molis-work` 与本人云同步空间的时机（U13/V5）。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/111.md","items":[{"id":"1","anchor":"batch-111-item-1","t":"`111-1`（PR1）· 存储多库原子事务升级、星型单向版本化推送引擎、不预记补账与大快照/附件保护","d":"① 存储层前置兑现：升级 `packages/storage/src/sqlite-library-transaction.ts` 支持「目标主库 + 目标插件独立库 + 个人空间回执库」三库同卷原子提交（处理好日志模式与连接独占约束、文件身份校验及断电回滚故障验证，不把旧 `artifact_join` 变成作者义务）；② 落地 `push_lineage`/`push_operations`（个人空间主库）、`push_upstream`（不存原件明文标题/id，R9）/`push_superseded`（目标分区主库，全留本机 + 仅同步最近 1 版，U6/V3）及确定性 `push_id`/`target_id`/`op_id`（R16，双机离线并发推送无双胞胎）；③ 不预记三步提交与中断补账（V2）：目标提交与私有回执原子落盘后再结算个人账本，重启补账登记 `S-push-ledger-repair`；④ >256 KiB 快照经 Platform Blob Handle 分片传输（绕开沙箱 1 MiB 单帧 JSON 上限，单操作单安装有效、超时即废，`S-push-blob-handle`）；支持插件自有文件（`store: \"owner_files\"`）按 SHA-256 跨区受控复制；⑤ CAS 附件持有保护：副本与全部 `push_superseded` 旧版在目标分区 `attachments` 记账，手动删旧版才释放；⑥ 完整覆盖 `remap`/`strip` 引用改指（R8）、批量逐件独立（R7）、原件删 `upstream_deleted`、目标删/移 `target_deleted`/`target_removed`、移出个人空间 `detached`、整项目复制剥离 `push_upstream`、归档项目排除、另存个人空间 `derived_from`、执行态默认停着；⑦ 助理按目标项目授权直推与可撤回（U7，`S-push-authority`），新增 `call-budget` 推送场景","track":"C3","occ":true,"also":["C1","G"],"kind":"实现"},{"id":"2","anchor":"batch-111-item-2","t":"`111-2`（PR2）· 14 个有业务对象内置插件一次完成 `push` 声明（U8）与第三方沙箱同路支持","d":"① 精确为 14 个有业务对象的内置插件（`goals`、`feed`、`risk`、`work-brief`、`workflows`、`pages`、`ppt`、`form`、`dataset`、`lingguang`、`todo`、`jelly`、`cognia`、`images`）一次完成 `push.kinds`（含单调递增 `revision`、子记录确定性派生、`local_refs` 的 `remap`/`strip` 及敏感绑定剥离）与 `molis.push.export.v1`/`put.v1` 动作；用自动契约测试钉住其余 6 个纯执行/流转插件（`coding`、`git`、`diff`、`inbox`、`schedule`、`issues`）不声明推送；② 第三方签名沙箱包经 SDK `pushTargetId()`、>256 KiB Blob Handle 与同一套声明端到端验通，交付原生与签名沙箱包两条作者手册示例","track":"E","occ":true,"also":["C1"],"kind":"实现"},{"id":"3","anchor":"batch-111-item-3","t":"`111-3`（PR3）· 工作台界面定样落地（按需懒加载）、G1～G5 全量焊死、白名单清空与文档收官","d":"① 先定样后落地：在 `36A` 窗口左上角「项目 › 事项」下拉面板左列顶部固定「个人空间」（配齐个人空间五个随手记入口一句话说明 V12）；空 Home 首次启动直进个人空间并将引导作为首页第一张卡（U11，只搭首卡壳层与路由并保留 `?mode=new-project` 新建项目入口，卡内动态追问与官方场景包闭环归 `45`）；插件市场按 8 类功能分组；原件与副本双向标注、快捷「记到个人空间」（R14）；推送/冲突/撤回/批量确认弹窗与「设置 › 按分区/插件存储占用与清理旧版」（R19）一律拆分为按需懒加载资源，确保首屏公共体积零超支；② 清零剩余旧合同字段，删除 `107` 一次性成员补写保留机制（`apps/local-host/src/former-personal-plugins.ts` 与 `CONTRACT-CHANGES.md` 登记项），清空 `107`～`111` 期间全部临时 `same-version-exceptions.json` / `v1-reset-exceptions.json` 白名单（双表归 `[]`），将 G1～G5 五道防回流门禁全部收紧焊死（含 `109` Git 搬家后的 G1 终态），按 44B「金样不重生」规则就地更新终版 `0.1.0` 等金样并经 `scripts/golden/layout.mjs` 重算摘要；③ 同步更新 `PRODUCT.md`、`AGENTS.md`、`docs/SSOT-MATRIX.md`、`docs/system/GLOSSARY.md`、`docs/system/HOME-DATA.md`、`docs/system/SECURITY-INVARIANTS.md`、`docs/system/CONTRACT-CHANGES.md`、`docs/releases/CHECKLIST.md`、`skills/molis-plugin-dev/*`（跑 `pnpm studio:replay` + 隔离 `smoke`），销账被代码消除的存量 `BL-*`；④ 本批合入后另行弹窗确认时机再清理真实 `~/.molis-work` 与个人云同步空间（U13/V5）","track":"D","occ":true,"also":["C1","C3","E","F"],"kind":"实现"}],"pre":["110"],"soft":[],"cond":["统一工作分区批 C","是 91-2～4、91B、105、45～90、REL-4、REL-5、SRV 的共同前置","界面先定样","清退 v2→v1 复位白名单"],"split":true,"nodes":[{"id":"111.1","items":[0],"hard":["110.1","110.2","110.3"],"partial":[]},{"id":"111.2","items":[1],"hard":["111.1"],"partial":[]},{"id":"111.3","items":[2],"hard":["111.2"],"partial":[]}]},{"id":"112","title":"退役 `jelly-whisper` 音视频包袱与 Jelly 日历＋极简随手记瘦身分表重构","stage":"2","intro":"仓库里留着两块来自早期果冻原型的沉重历史包袱：一块是 `apps/local-host/native/materials/whisper`（`jelly-whisper`），绑死苹果专有 `WhisperKit` 与 Xcode 26 冷编译 7 分钟、Windows/Linux 完全不可用、迫使 CI 挂着 `continue-on-error`（`BL-122`），还要求用户额外下载 626 MB 专用模型；另一块是 `plugins/native/jelly` 插件自身，塞了足足 53 个动作——既有与 `Pages` 重复的富文本块级编辑器、进展统计页、自造独立模型设置窗与 36 MB 私有 AI 拆解流，底层更把整座日历和笔记库揉成一个单行 JSON 大包（`jelly_workspace WHERE singleton = 1`），每次按键保存都把修改前后的整座数据库各抄一遍写进 `jelly_history`（既锁表冲突又导致磁盘体积平方级膨胀，还挡住后续 `108` 只读扫描近期日程与 `111` 单篇笔记跨空间推送）。2026-11-25 你拍板单列本批（与 `44C` 并行推进、`106`/`107` 已合入，赶在 `108` 搬迁 Jelly 之前落地）：彻底删除 `jelly-whisper` 音视频转写包袱并将图文提取器改名为平台中性 `molis-material`（补齐中/英/日三语 OCR）；同时给 `Jelly` 彻底瘦身并重构为标准关系分表，只保留干净好用的日历日程（月/周/列表、单次与重复系列、分类）+ 纯文本/Markdown 极简随手记。","ask":"看瘦身后的 Jelly 日历＋极简随手记界面定样。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/112.md","items":[{"id":"1","anchor":"batch-112-item-1","t":"`112-1` ·
