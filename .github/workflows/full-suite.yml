name: PR1049 focused validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 91c24d8f5e56fbcb9b38815a1422f7b40dcae4dd
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Browser and fonts
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --version
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "MOLIS_WORK_TEST_CHROME=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"
          echo "MOLIS_WORK_BROWSER_PATH=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Build clean main
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Main performance twice
        continue-on-error: true
        shell: bash
        run: |
          failed=0
          for round in 1 2; do
            echo "MAIN ROUND $round"
            if node scripts/run-tests.mjs tests/code-scale.e2e.test.ts; then
              echo "main round $round: PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              echo "main round $round: FAIL (see original assertions in log)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$failed"
      - uses: actions/checkout@v6
        with:
          ref: 9d4bfb84e3ff41e21832535bec585bfc7f24cb08
          fetch-depth: 0
      - name: Build clean PR
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: PR performance twice
        continue-on-error: true
        shell: bash
        run: |
          failed=0
          for round in 1 2; do
            echo "PR ROUND $round"
            if node scripts/run-tests.mjs tests/code-scale.e2e.test.ts; then
              echo "PR round $round: PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              echo "PR round $round: FAIL (see original assertions in log)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$failed"
      - name: Complete interrupted diff geometry coverage
        run: node scripts/run-tests.mjs tests/code-rows-geometry.e2e.test.ts
