# Active Monorepo package roots. The root package provides product launchers
# and the supported 0.1.x SDK/release surface.
packages:
  - 'apps/*'
  - 'server'
  - 'packages/*'
  - 'modules/*'
  - 'horizontal/*'
  - 'plugins/native/*'
  - 'plugins/official-integrations/*'
  - 'tooling/plugin-cli'

# readable-stream 2 pins safe-buffer 5.1.2 while newer string_decoder pins 5.2.1.
# The installer flattens runtime dependencies by package name, and 5.2.1 keeps the 5.1 API.
overrides:
  safe-buffer: 5.2.1
  # @larksuiteoapi/lark-mcp -> proxy-agent -> pac-proxy-agent -> get-uri declares basic-ftp ^5.0.2, which resolves to 5.x, and
  # even the latest 5.x has the Client.list() quadratic-time parser flaw (GHSA-c475-qrg2-pj4r, fixed in 6.2.1, the oldest fixed
  # release, published 2026-08-27). get-uri only reaches the FTP client for a PAC file served over ftp:, which the connector
  # never configures; the override is for the audit, and the connector's tests (tests/lark-mcp-launch.test.ts,
  # tests/connector-mcp.test.ts) start the real package with it.
  # Scope: this file only governs installs made from this workspace, that is the checkout and the Home release and the desktop
  # payload copied from it. The npm archive (`pnpm package:npm`) lists lark-mcp as a registry dependency, and npm ignores the
  # overrides of a package it installs as a dependency, so a consumer's `npm install <archive>.tgz` still gets basic-ftp 5.x
  # (specs/repository-anti-corruption/dependencies-and-sdk-plan.md section 3.5).
  basic-ftp: 6.2.1

# Allow esbuild postinstall (required by tsx for pnpm molis-work / tests).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  node-pty: true
  # Dependencies of @larksuiteoapi/lark-mcp (the Feishu/Lark MCP connector's child process). Its `mcp` mode takes the
  # token from the environment, but the package still loads keytar every time it starts (cli.js -> auth/store.js builds its
  # token store at import time, which asks keytar for an encryption key). Without the build that load fails inside the
  # package's own try/catch: the child prints warnings on stderr (`Failed to initialize encryption`, `Failed to initialize`
  # and that its token store falls back to memory, the first two with a require stack) and goes on, so the connector works. protobufjs's postinstall only prints a CLI hint. Neither
  # build runs in this workspace; an npm-archive install does not read this file, runs keytar's own install script
  # (prebuild-install, then node-gyp), and then every start of the child reads or creates a `lark-mcp` item in the OS
  # keychain (specs/repository-anti-corruption/dependencies-and-sdk-plan.md section 3.5).
  keytar: false
  protobufjs: false

# These exact versions are reviewed local file: archives, not registry releases.
# pnpm cannot check registry publication age for these private vendored packages.
minimumReleaseAgeExclude:
  - '@adeptify/intelligence-client@0.2.2'
  - '@adeptify/search-evidence-layer@0.4.1'
  - '@prologue/sdk@0.0.0-rc.1'
