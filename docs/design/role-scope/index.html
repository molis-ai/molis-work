<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色作用范围定样 · Molis Work 原型</title>
  <!-- The product's own theme bootstrap and stylesheets, exported by ../_catalog/export.mjs (run it first).
       The workbench and the settings pages use different sheets in the product too; app.js switches them. -->
  <script src="../_catalog/dist/theme.js"></script>
  <link rel="stylesheet" href="../_catalog/dist/arrival.css" id="css-arrival">
  <link rel="stylesheet" href="../_catalog/dist/settings.css" id="css-settings" disabled>
  <link rel="stylesheet" href="../_catalog/prototype.css?v=3">
  <link rel="stylesheet" href="proto.css?v=4">
</head>
<body class="arrival-page immersive-workbench proto-on">
  <script src="../_catalog/dist/sprite.js"></script>
  <div class="proto" role="region" aria-label="原型控制（不是产品界面）">
    <b id="p-title"></b>
    <label><span id="p-scheme"></span>
      <span class="mw-toggle-group" data-slot="toggle-group" role="group" id="scheme"><button type="button" class="mw-toggle" data-scheme="A">A</button><button type="button" class="mw-toggle" data-scheme="B">B</button><button type="button" class="mw-toggle" data-scheme="C">C</button></span>
    </label>
    <span id="p-scheme-name"></span>
    <label><span id="p-topic"></span><select class="mw-select" data-slot="select" id="topic"></select></label>
    <label><span id="p-state"></span><select class="mw-select" data-slot="select" id="state"></select></label>
    <label><span id="p-lang"></span>
      <span class="mw-toggle-group" data-slot="toggle-group" role="group" id="lang"><button type="button" class="mw-toggle" data-lang="zh">中</button><button type="button" class="mw-toggle" data-lang="en">EN</button></span>
    </label>
    <label><span id="p-theme"></span>
      <span class="mw-toggle-group" data-slot="toggle-group" role="group" id="theme"><button type="button" class="mw-toggle" data-theme-set="light"></button><button type="button" class="mw-toggle" data-theme-set="dark"></button></span>
    </label>
    <button type="button" class="mw-btn mw-btn--secondary mw-btn--sm" data-slot="button" id="reset"><span data-slot="button-label"></span></button>
  </div>
  <div id="app"></div>
  <script src="../_catalog/dist/foundation.js"></script>
  <script src="../_catalog/parts.js?v=2"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
