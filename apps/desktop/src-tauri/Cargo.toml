[package]
name = "molis-work-desktop"
version = "0.2.0"
description = "Molis Work macOS App: WebView plus local TUI PTY"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "molis-work-desktop"
path = "../adapters/tauri/src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSEvent",
  "NSResponder",
  "NSScreen",
  "NSWindow",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSEnumerator",
  "NSGeometry",
  "objc2-core-foundation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
