document.addEventListener('change',e=>{const el=e.target;if(el.id==='select-all'){sources.forEach(s=>s.selected=el.checked);render()}else if(el.dataset.source){sources.find(s=>s.id===el.dataset.source).selected=el.checked;skipped.delete(el.dataset.source);render()}else if(el.dataset.range){sources.find(s=>s.id===el.dataset.range).days=Number(el.value);render()}else if(el.dataset.file){el.checked?excluded.delete(+el.dataset.file):excluded.add(+el.dataset.file);render()}else if(el.dataset.folder){listedFiles().filter(f=>f.source===tab&&f.folder===el.dataset.folder).forEach(f=>el.checked?excluded.delete(f.id):excluded.add(f.id));render()}else if(el.id==='files-all'){listedFiles().filter(f=>f.source===tab).forEach(f=>el.checked?excluded.delete(f.id):excluded.add(f.id));render()}});
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.scene){prepareScene(btn.dataset.scene);return}if(btn.dataset.tab){tab=btn.dataset.tab;render();return}if(btn.dataset.connect){let s=sources.find(s=>s.id===btn.dataset.connect);if(s.ready){showDialog('管理「'+s.name+'」访问',`<p>当前示例路径：${s.path}</p><p>正式版本可清除 Molis 保存的访问凭据；已导入的项目资料仍保留。这不等于撤销 macOS 系统权限。</p><button class="btn" data-forget="${s.id}">演示：取消连接</button>`)}else if(s.days!==undefined){s.selected=true;skipped.delete(s.id);permissionId=s.id;permissionTotal=1;permissionDone=0;render()}else{showDialog(s.name+' · 演示入口',`<p>${s.id==='gmail'?'正式版本会使用已配置的 Google OAuth 官方授权页。此原型不连接真实账号。':s.id==='web'?'正式版本在这里粘贴网页正文和原网址。此原型不读取网页。':'正式版本在这里上传聊天导出的文本文件。此原型不读取真实文件。'}</p><p>本轮交互重点为 macOS 目录，预览使用本地目录示例数据。</p>`)}return}if(btn.dataset.forget){sources.find(s=>s.id===btn.dataset.forget).ready=false;$('#dialog').close();render();notify('已清除演示连接；未更改系统权限。');return}if(btn.dataset.citation){showDialog('来源 '+btn.dataset.citation+' · 示例原文',`<p>文稿 / 工作 · 内容快照 v1</p><div class="source-body">${['秋季产品计划：\n\n本阶段优先完成从已有工作资料开始的体验。用户能独立选择来源，理解访问范围，并在整理前排除无关内容。\n\n读取失败应当保留其他已完成的内容。','首次使用流程：\n\n选择来源 → 按需授权 → 预览文件 → 读取和整理 → 编辑采用。\n\n预览显示文件名、修改时间与大小。尚未开始整理时不读取正文。','用户访谈纪要：\n\n「我想先知道你要看哪些文件。」\n「总结完之后，希望随时能找到你参考的那段资料。」\n\n以上引语均为设计演示编写。'][+btn.dataset.citation-1]}</div>`);return}switch(btn.dataset.action){case'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';break;case'blank':showDialog('从空白项目开始','<p>正式版本只需要项目名称即可创建空白项目，不读取资料，也不生成工作摘要。</p><label for="blank-title" style="font-size:12px">项目名称</label><input id="blank-title" value="我的新项目" style="display:block;width:100%;padding:10px 12px;margin:8px 0 20px;background:var(--paper);border:1px solid var(--line);border-radius:6px"><button class="btn primary" data-action="blank-create">演示创建</button>');break;case'blank-create':$('#dialog').close();notify('已演示空白创建。没有建立真实项目。');break;case'close-dialog':$('#dialog').close();break;case'continue':skipped.clear();permissionTotal=selectedSources().filter(s=>!s.ready).length;permissionDone=0;nextPermission();break;case'grant':{let s=sources.find(s=>s.id===permissionId);s.ready=true;if(s.id==='custom')s.path='~/Work/示例项目';permissionDone++;nextPermission();break}case'skip-permission':skipped.add(permissionId);sources.find(s=>s.id===permissionId).selected=false;permissionDone++;nextPermission();break;case'back-sources':scene='sources';render();break;case'start':progress=18;paused=false;scene='reading';render();startTimer();window.scrollTo({top:0});break;case'pause':paused=!paused;render();break;case'finish':clearInterval(readingTimer);scene='summary';render();window.scrollTo({top:0});break;case'edit':if(editing){saveSummary();notify('示例摘要已保存。')}editing=!editing;render();if(editing)$('#summary-title').focus();break;case'adopt':saveSummary();adopted=true;render();window.scrollTo({top:0});break;case'reorganize':saveSummary();goPreview();notify('可以调整范围，保留了当前摘要。');break;case'back-summary':adopted=false;render();break;case'open-project':notify('设计演示到此结束。正式版本会打开项目摘要文档。');break;case'reset':location.reload();break}});
render();
</script>
</body>
</html>
