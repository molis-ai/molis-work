<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Molis Work · 放在哪里切片</title>
<style>
:root {
  color-scheme: light;
  --page:#f3f4f5; --paper:#ffffff; --ink:#222326; --ink-soft:#3c3f44; --muted:#6b6f76; --faint:#737882;
  --line:#e2e4e7; --line-strong:#d0d6e0; --hover:color-mix(in srgb, #222326 6%, transparent); --active:color-mix(in srgb, #222326 10%, transparent);
  --blue:#5e6ad2; --blue-soft:#eef0fb; --green:#2d7a5a; --green-soft:#e8f4ee; --amber:#8a5c18; --amber-soft:#f8f0e2; --red:#b03d45; --red-soft:#fbecec;
  --shadow:0 8px 28px rgba(26,38,52,.12);
  --font:"Inter Variable", Inter, "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --control-h:32px; --radius:8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --page:#0f1011; --paper:#161718; --ink:#f7f8f8; --ink-soft:#d0d1d3; --muted:#8a8f98; --faint:#737880;
  --line:#23252a; --line-strong:#2e3036; --hover:color-mix(in srgb, #f7f8f8 8%, transparent); --active:color-mix(in srgb, #f7f8f8 12%, transparent);
  --blue:#8b93f1; --blue-soft:#23264a; --green:#6bc49a; --green-soft:#173026; --amber:#d4a15c; --amber-soft:#342a1c; --red:#ee858c; --red-soft:#3a2024;
  --shadow:0 4px 10px rgba(0,0,0,.5), 0 20px 48px rgba(0,0,0,.46);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0f1011; --paper:#161718; --ink:#f7f8f8; --ink-soft:#d0d1d3; --muted:#8a8f98; --faint:#737880;
  --line:#23252a; --line-strong:#2e3036; --hover:color-mix(in srgb, #f7f8f8 8%, transparent); --active:color-mix(in srgb, #f7f8f8 12%, transparent);
  --blue:#8b93f1; --blue-soft:#23264a; --green:#6bc49a; --green-soft:#173026; --amber:#d4a15c; --amber-soft:#342a1c; --red:#ee858c; --red-soft:#3a2024;
  --shadow:0 4px 10px rgba(0,0,0,.5), 0 20px 48px rgba(0,0,0,.46);
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--page); color:var(--ink); font:13px/1.5 var(--font); -webkit-font-smoothing:antialiased; }
button, input, textarea, select { font:inherit; color:inherit; }
.app { display:grid; grid-template-rows:36px 1fr 56px; height:100vh; }
.tabs { display:flex; align-items:center; gap:6px; padding:0 10px; border-bottom:1px solid var(--line); }
.tab { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:6px; color:var(--muted); background:none; border:0; cursor:pointer; }
.tab[aria-current="true"] { background:var(--active); color:var(--ink); }
.stage { position:relative; overflow:auto; background:var(--paper); margin:0 8px; border-radius:10px; border:1px solid var(--line); }
.dock { display:flex; align-items:center; gap:8px; padding:0 12px; }
.dock .spacer { flex:1; }
.dock-bar { display:flex; align-items:center; gap:6px; height:38px; padding:0 6px 0 10px; border:1px solid var(--line-strong); border-radius:10px; background:var(--paper); min-width:520px; color:var(--muted); }
.dock-bar input { flex:1; border:0; background:transparent; outline:none; }
.icon-btn { width:32px; height:32px; display:inline-grid; place-items:center; border-radius:8px; border:0; background:transparent; color:var(--muted); cursor:pointer; }
.icon-btn:hover, .tab:hover { background:var(--hover); color:var(--ink); }
.where-circle { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--blue); color:#fff; font-weight:600; border:0; cursor:pointer; }
.where-circle.personal { background:var(--ink-soft); color:var(--paper); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:var(--control-h); padding:0 12px; border-radius:var(--radius); border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); cursor:pointer; white-space:nowrap; }
.btn:hover { background:var(--hover); }
.btn--primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn--primary:hover { background:var(--ink-soft); }
.btn--ghost { border-color:transparent; background:transparent; }
.btn--sm { height:28px; padding:0 10px; }
.btn--danger { color:var(--red); }
.muted { color:var(--muted); } .faint { color:var(--faint); }
.chip { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:11px; background:var(--active); color:var(--ink-soft); font-size:12px; }
.chip--personal { background:var(--active); }
.chip--project { background:var(--blue-soft); color:var(--blue); }
.chip--warn { background:var(--amber-soft); color:var(--amber); }
.chip--gone { background:var(--red-soft); color:var(--red); }
.chip--ok { background:var(--green-soft); color:var(--green); }
h1 { font-size:22px; font-weight:600; margin:0 0 4px; letter-spacing:-.01em; }
h2 { font-size:15px; font-weight:600; margin:0; }
h3 { font-size:12px; font-weight:600; color:var(--muted); margin:18px 0 8px; text-transform:none; }
.pad { padding:28px 36px; max-width:1080px; }
.list { display:flex; flex-direction:column; border-top:1px solid var(--line); }
.row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
.row:hover { background:var(--hover); }
.row strong { font-weight:500; }
.row small { display:block; color:var(--muted); }
.card { border:1px solid var(--line); border-radius:10px; padding:16px; background:var(--paper); }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
.card--space { border-color:var(--line-strong); background:linear-gradient(0deg, var(--paper), var(--paper)); }
.card .kicker { font-size:12px; color:var(--muted); margin-bottom:6px; }
.toolbar { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); }
.toolbar .grow { flex:1; }
.target { font-size:12px; color:var(--muted); }
.target b { color:var(--ink-soft); font-weight:500; }
/* placement bar */
.placement { display:inline-flex; align-items:center; gap:0; height:26px; border:1px solid var(--line); border-radius:13px; padding:0 4px; background:var(--paper); cursor:pointer; font-size:12px; }
.placement:hover { border-color:var(--line-strong); background:var(--hover); }
.placement > span { padding:0 6px; display:inline-flex; align-items:center; gap:4px; }
.placement > span + span { border-left:1px solid var(--line); }
.placement .loc { color:var(--ink); font-weight:500; }
.placement .dot { width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block; }
.placement .dot.unsaved { background:var(--amber); }
.editor { padding:28px 64px; max-width:860px; }
.editor .title { font-size:26px; font-weight:600; border:0; outline:0; background:transparent; width:100%; padding:0; margin:0 0 12px; }
.editor p, .editor li { font-size:14px; line-height:1.75; color:var(--ink-soft); }
.popover { position:absolute; z-index:40; width:380px; background:var(--paper); border:1px solid var(--line-strong); border-radius:12px; box-shadow:var(--shadow); padding:14px; }
.popover dl { display:grid; grid-template-columns:72px 1fr; gap:6px 10px; margin:0 0 10px; }
.popover dt { color:var(--muted); }
.popover dd { margin:0; }
.popover .assoc { display:flex; flex-direction:column; gap:4px; margin:4px 0 10px; }
.popover .assoc div { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; background:var(--page); }
.popover .actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
dialog { border:1px solid var(--line-strong); border-radius:14px; padding:0; background:var(--paper); color:var(--ink); box-shadow:var(--shadow); width:min(520px, calc(100vw - 32px)); }
dialog::backdrop { background:rgba(0,0,0,.35); }
.dialog-head { padding:18px 20px 8px; }
.dialog-body { padding:4px 20px 12px; }
.dialog-foot { display:flex; justify-content:flex-end; gap:8px; padding:12px 20px 18px; }
.choice { display:grid; grid-template-columns:18px 1fr; gap:10px; padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }
.choice:has(input:checked) { border-color:var(--blue); background:var(--blue-soft); }
.choice strong { display:block; font-weight:500; margin-bottom:2px; }
.choice small { color:var(--muted); display:block; }
.choice .rec { color:var(--blue); font-size:12px; margin-left:6px; }
.select-row { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 12px; }
.select-row button[aria-pressed="true"] { border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }
.toast-region { position:fixed; left:50%; bottom:68px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:60; }
.toast { display:flex; align-items:center; gap:12px; min-width:520px; max-width:760px; padding:10px 10px 10px 14px; border-radius:12px; background:var(--paper); border:1px solid var(--line-strong); box-shadow:var(--shadow); }
.toast .what { flex:1; }
.toast .what strong { font-weight:500; }
.toast .what small { display:block; color:var(--muted); }
.slide-grid { display:grid; grid-template-columns:200px 1fr; height:calc(100% - 49px); }
.slide-list { border-right:1px solid var(--line); overflow:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
.thumb { aspect-ratio:16/9; border:1px solid var(--line); border-radius:6px; padding:8px; font-size:10px; cursor:pointer; background:var(--page); overflow:hidden; }
.thumb[aria-current="true"] { border-color:var(--blue); }
.thumb b { display:block; font-size:11px; margin-bottom:2px; }
.slide-view { padding:24px; display:grid; place-items:center; background:var(--page); }
.slide { aspect-ratio:16/9; width:min(100%, 760px); border-radius:8px; padding:6% 7%; background:#fcfcfb; color:#292a2e; box-shadow:var(--shadow); position:relative; }
.slide h4 { font-size:28px; margin:0 0 18px; color:#292a2e; }
.slide ul { margin:0; padding-left:1.1em; font-size:17px; line-height:1.6; }
.slide .accent { position:absolute; left:0; top:0; bottom:0; width:6px; background:#5e6ad2; border-radius:8px 0 0 8px; }
.present { position:fixed; inset:0; z-index:80; background:#000; display:grid; place-items:center; }
.present .slide { width:min(96vw, calc(96vh * 16 / 9)); box-shadow:none; border-radius:0; }
.present .slide h4 { font-size:44px; } .present .slide ul { font-size:26px; }
.present .bar { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center; color:#bbb; font-size:12px; background:rgba(40,40,44,.8); padding:6px 10px; border-radius:10px; }
.present .notes { position:fixed; right:16px; bottom:60px; width:360px; background:rgba(40,40,44,.92); color:#ddd; border-radius:10px; padding:12px; font-size:13px; }
.menu { position:absolute; z-index:45; background:var(--paper); border:1px solid var(--line-strong); border-radius:10px; box-shadow:var(--shadow); padding:4px; min-width:240px; }
.menu button { display:flex; flex-direction:column; align-items:flex-start; width:100%; padding:7px 10px; border:0; background:transparent; border-radius:6px; cursor:pointer; text-align:left; }
.menu button:hover { background:var(--hover); }
.menu button small { color:var(--muted); }
.form-q { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
.bars { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
.bars div { display:grid; grid-template-columns:120px 1fr 40px; gap:8px; align-items:center; font-size:12px; }
.bars i { display:block; height:8px; border-radius:4px; background:var(--blue); }
.fill { position:fixed; inset:0; z-index:80; background:var(--page); overflow:auto; }
.fill .sheet { max-width:620px; margin:40px auto; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:28px; }
.fill label { display:block; margin:14px 0 6px; font-weight:500; }
.fill .opts { display:flex; flex-direction:column; gap:6px; }
.fill input[type=text], .fill textarea { width:100%; border:1px solid var(--line-strong); border-radius:8px; padding:8px 10px; background:var(--paper); }
.split { display:grid; grid-template-columns:1fr 320px; gap:0; height:100%; }
.side { border-left:1px solid var(--line); padding:20px; overflow:auto; }
.slice-nav { position:fixed; top:44px; right:14px; z-index:70; width:220px; background:var(--paper); border:1px dashed var(--line-strong); border-radius:10px; padding:8px; font-size:12px; opacity:.96; }
.slice-nav summary { cursor:pointer; color:var(--muted); }
.slice-nav ol { margin:6px 0 0; padding-left:18px; }
.slice-nav button { border:0; background:none; padding:2px 0; color:var(--ink-soft); cursor:pointer; text-align:left; }
.slice-nav button:hover { color:var(--blue); }
.notice { display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:10px; background:var(--amber-soft); color:var(--amber); margin-bottom:14px; }
.gone { opacity:.75; }
.empty { padding:40px 0; }
.kbd { font-size:11px; border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:4px; padding:0 4px; }
@media (max-width: 760px) {
  .dock-bar { min-width:0; flex:1; }
  .toast { min-width:0; width:calc(100vw - 24px); flex-wrap:wrap; }
  .pad { padding:18px 16px; }
  .editor { padding:18px 16px; }
  .split, .slide-grid { grid-template-columns:1fr; }
  .side, .slide-list { display:none; }
  .slice-nav { display:none; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation:rise .22s cubic-bezier(.16,1,.3,1); }
  @keyframes rise { from { transform:translateY(8px); opacity:0; } }
}
</style>
</head>
<body>
<div class="app">
  <header class="tabs" id="tabs"></header>
  <main class="stage" id="stage"></main>
  <footer class="dock" id="dock"></footer>
</div>
<div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<details class="slice-nav" open>
  <summary>切片路径（评审用，不是产品界面）</summary>
  <ol id="paths"></ol>
</details>
<script>
/* ---------- Data: realistic content for the slice ---------- */
const PROJECTS = { q4: { id:"q4", title:"Q4 新版发布", glyph:"Q" }, interview: { id:"interview", title:"客户访谈计划", glyph:"客" } };
const PERSONAL = { id:"personal", title:"个人空间", glyph:"我" };
const state = {
  where: "root", fresh: false, plugin: "home", open: null, unsaved: false,
  objects: {
    "doc-checklist": { kind:"pages", title:"上线前检查清单", loc:"personal", used:[], goals:[], body:["回滚预案写清楚：谁决定、几分钟内能回滚。","客服话术更新到 v3，覆盖价格变化。","灰度 5% → 30% → 100%，每段观察 2 小时。"], state:"ok" },
    "shelf-pricing": { kind:"shelf", title:"竞品定价表.xlsx", loc:"home", used:["q4","interview"], goals:[], state:"ok", note:"Shelf 副本 · 42 KB" },
    "shelf-quotes": { kind:"shelf", title:"用户访谈原话.md", loc:"home", used:["q4"], goals:["goal-review"], state:"ok", note:"Shelf 副本 · 9 KB" },
    "deck-review": { kind:"ppt", title:"Q4 发布评审", loc:"q4", used:[], goals:["goal-review"], state:"ok", version:7, artifact:null },
    "form-beta": { kind:"form", title:"Beta 用户满意度", loc:"q4", used:[], goals:[], state:"ok", collecting:false, responses:23 },
    "spark-demo": { kind:"spark", title:"把发布说明做成可点的演示", loc:"q4", used:[], goals:[], state:"ok", body:"评审会上直接点着讲，比念 PDF 好。可以先用 PPT 做 6 页。" },
  },
  goals: { "goal-review": { title:"完成 Q4 发布评审材料", project:"q4" } },
};
const SLIDES = [
  { title:"Q4 新版发布评审", bullets:["范围：计费重构、团队空间 Beta、移动端改版","今天要决定：是否 10 月 20 日开始灰度"], notes:"开场 1 分钟，先说结论：建议按计划灰度。" },
  { title:"做成了什么", bullets:["计费重构上线预发，账单对账差异 0","团队空间 Beta 覆盖 41 个试用团队","移动端首屏加载 2.8s → 1.6s"], notes:"数字都来自 9/25 周报。" },
  { title:"Beta 反馈", bullets:["23 份满意度问卷，平均 4.2 / 5","最常见诉求：权限分级、导出 PDF","两位客户愿意做案例"], notes:"问卷结果在「Beta 用户满意度」。" },
  { title:"风险与应对", bullets:["价格变化引起投诉 → 客服话术 v3","灰度期间账单异常 → 5 分钟内回滚"], notes:"回滚预案见《上线前检查清单》。" },
  { title:"灰度计划", bullets:["10/20 5% · 10/22 30% · 10/27 100%","每段观察 2 小时，指标：支付成功率、工单量"], notes:"" },
  { title:"需要大家决定", bullets:["同意 10/20 开始灰度？","法务能否在 10/18 前确认新条款？"], notes:"留 10 分钟讨论。" },
];
const QUESTIONS = [
  { title:"整体满意度", type:"rating", dist:{"5 分":9,"4 分":10,"3 分":3,"2 分":1,"1 分":0} },
  { title:"最常用的功能", type:"single", dist:{"团队空间":11,"账单与发票":6,"移动端":4,"其他":2} },
  { title:"最希望改进的地方", type:"text", samples:["权限能分到项目级","导出 PDF 时保留格式","移动端能审批"] },
];

/* ---------- Helpers ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const esc = v => String(v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const locName = loc => loc === "personal" || loc === "home" ? "个人空间" : "项目「" + PROJECTS[loc].title + "」";
const accessName = loc => loc === "personal" || loc === "home" ? "只有你" : "项目内可见";
const here = () => state.where === "personal" ? "personal" : state.where;
const pluginTitle = { home:"首页", pages:"Pages", ppt:"PPT", form:"问卷", shelf:"Shelf", goals:"Goals", spark:"灵光", artifacts:"Artifacts" };
function toast(html, actions=[], ms=9000) {
  const node = document.createElement("div"); node.className = "toast";
  node.innerHTML = `<div class="what">${html}</div>`;
  actions.forEach(([label, run, primary]) => { const b = document.createElement("button"); b.className = "btn btn--sm " + (primary ? "btn--primary" : ""); b.textContent = label; b.onclick = () => { node.remove(); run(); }; node.append(b); });
  const x = document.createElement("button"); x.className = "icon-btn"; x.setAttribute("aria-label", "关闭提示"); x.textContent = "×"; x.onclick = () => node.remove(); node.append(x);
  $("#toasts").append(node); setTimeout(() => node.remove(), ms);
}
function go(patch) { Object.assign(state, patch); closePopovers(); render(); }
function closePopovers() { document.querySelectorAll(".popover,.menu").forEach(n => n.remove()); }
document.addEventListener("click", e => { if (!e.target.closest(".popover,.menu,[data-pop]")) closePopovers(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePopovers(); });

/* ---------- Shell ---------- */
function renderShell() {
  const inSpace = state.where !== "root" && state.where !== "onboarding";
  $("#tabs").innerHTML = inSpace
    ? `<button class="tab" aria-current="${state.plugin==='home'}" onclick="go({plugin:'home',open:null})">${state.where==='personal'?'个人首页':'项目首页'}</button>
       ${state.plugin!=='home'?`<button class="tab" aria-current="true">${pluginTitle[state.plugin]}${state.open?' · '+esc(state.objects[state.open]?.title||state.goals[state.open]?.title||''):''}</button>`:''}`
    : `<span class="muted" style="padding:0 6px">Molis Work</span>`;
  const plugins = state.where === "personal" ? ["pages","ppt","form","spark","shelf"] : ["goals","pages","ppt","form","spark","shelf","artifacts"];
  $("#dock").innerHTML = inSpace ? `
    ${plugins.map(p => `<button class="icon-btn" title="${pluginTitle[p]}" aria-label="${pluginTitle[p]}" onclick="go({plugin:'${p}',open:null})">${{goals:"◎",pages:"▤",ppt:"▭",form:"☑",spark:"✦",shelf:"▥",artifacts:"◫"}[p]}</button>`).join("")}
    <span class="spacer"></span>
    <div class="dock-bar"><span class="chip">${state.where==='personal'?'个人':'本项目'}</span><input placeholder="让助理做点什么…" aria-label="发给助理"/><span class="kbd">⌘K</span></div>
    <span class="spacer"></span>
    <button class="where-circle ${state.where==='personal'?'personal':''}" data-pop title="切换位置" onclick="whereMenu(event)">${state.where==='personal'?PERSONAL.glyph:PROJECTS[state.where].glyph}</button>`
    : `<span class="spacer"></span><div class="dock-bar"><span class="chip">个人</span><input placeholder="让助理做点什么…" aria-label="发给助理"/></div><span class="spacer"></span>`;
}
function whereMenu(e) {
  closePopovers(); const m = document.createElement("div"); m.className = "menu";
  const rect = e.currentTarget.getBoundingClientRect(); m.style.right = (innerWidth - rect.right) + "px"; m.style.bottom = (innerHeight - rect.top + 8) + "px"; m.style.position = "fixed";
  m.innerHTML = `<button onclick="go({where:'personal',plugin:'home',open:null})"><span>个人空间</span><small>不属于任何项目 · 只有你</small></button>

function scenePpt() {

    <div class="slide-grid"><div class="slide-list">${SLIDES.map((x, i) => `<div class="thumb" aria-current="${i===cur}" onclick="state.slide=${i}; render()"><b>${i+1}. ${esc(x.title)}</b>${esc(x.bullets[0])}</div>`).join("")}</div>
    <div class="slide-view"><div class="slide"><div class="accent"></div><h4>${esc(s.title)}</h4><ul>${s.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div></div></div>`;
}
function present() {
  let i = state.slide || 0; let notes = true; const node = document.createElement("div"); node.className = "present"; node.tabIndex = -1;
  const draw = () => { const s = SLIDES[i]; node.innerHTML = `<div class="slide"><div class="accent"></div><h4>${esc(s.title)}</h4><ul>${s.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>
    ${notes && s.notes ? `<div class="notes"><b>讲者备注</b><br>${esc(s.notes)}</div>` : ""}
    <div class="bar">${i+1} / ${SLIDES.length} · <span class="kbd">←</span><span class="kbd">→</span> 翻页 · <span class="kbd">N</span> 备注 · <span class="kbd">Esc</span> 退出</div>`; };
  const key = e => { if (e.key === "ArrowRight" || e.key === " ") i = Math.min(SLIDES.length - 1, i + 1); else if (e.key === "ArrowLeft") i = Math.max(0, i - 1); else if (e.key.toLowerCase() === "n") notes = !notes; else if (e.key === "Escape") { close(); return; } draw(); };
  const close = () => { document.removeEventListener("keydown", key); node.remove(); state.slide = i; render(); };
  node.onclick = e => { if (!e.target.closest(".notes,.bar")) { i = Math.min(SLIDES.length - 1, i + 1); draw(); } };
  document.addEventListener("keydown", key); draw(); document.body.append(node); node.focus();
}

function fillMode() {

];
