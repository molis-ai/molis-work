name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-boundaries:
    name: Package boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Two commits: on a pull request that is the merge commit GitHub builds and its two parents, on a push the new tip
          # and its parent. The health gates below need the commit to compare with, not the whole history; when the
          # shallow clone lacks it, scripts/ci-health-base.mjs fetches it (and deepens only as far as needed).
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package contracts and boundaries
        run: pnpm workspace:verify

      # Numbers that may only go down: giant units (class lines and methods apart), tests reaching into package
      # internals (per test file), vendored SDK packages, in-place schema patches, compatibility markers (per source
      # file), and a status line on every spec in specs/ (specs/repository-anti-corruption §5a).
      # The head and the merge-base are both measured here by the same script and compared, so rewriting
      # tooling/gates/baseline.json in a PR cannot hide growth, and nothing in a PR can raise a number except changing the
      # gate itself (script, limits.json, giant-exceptions.json, this step), which is reviewed. The committed baseline.json is not read.
      # The comparison commit: on a pull request, HEAD is the merge commit GitHub builds (refs/pull/N/merge), so it is the
      # merged result against the base branch as it was merged (HEAD^1); on a push to main it is the previous tip.
      # scripts/ci-health-base.mjs picks it and fetches it when the shallow checkout lacks it.
      - name: Health gates (against the merge-base)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/check-health-gates.mjs --base "$base"

      # Each gate rule is mutation-verified on a scratch repository: one violation added on a branch fails, and so does
      # the same branch after `--update` rewrote the baseline.
      - name: Health gates reject what they claim to
        run: node scripts/run-tests.mjs tests/health-gates-merge-base.test.ts

      - name: Verify Goal boundaries, storage baselines and release assets
        run: |
          node --test tests/goals-query-boundaries.test.mjs tests/goals-storage-boundaries.test.mjs
          node scripts/run-tests.mjs tests/storage-baseline.test.ts tests/home-store-baselines.test.ts tests/release-assets.test.ts tests/installer-symlink-dependencies.test.ts

      - name: Typecheck product launchers
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # Action directory, Manifest and MCP grant contracts, and undeclared names in the assembled Workbench client;
      # runs on the packages built above.
      # The full product suite still runs locally (see the PR template).
      - name: Action and plugin contracts
        run: pnpm test:contracts

      - name: One workbench shell (no standalone pages)
        run: node scripts/run-tests.mjs tests/shell-page-gate.test.ts

      - name: 成果 types have owner previews; writes match Manifests; process items stay out of user lists
        run: node scripts/run-tests.mjs tests/artifact-type-gate.test.ts tests/artifact-declaration-gate.test.ts

      # The Alchemist plugin brings its own vitest suite (studio services and contracts); about a second.
      - name: Alchemist plugin tests
        run: pnpm --filter @molis-ai/molis-work-plugin-alchemist test

  verify:
    name: Verify
    needs: architecture-boundaries
    if: ${{ always() }}
    # Keep this job name while `Verify` is required by main branch protection.
    # The full product suite runs locally; package boundaries and the contract subset run here.
    runs-on: ubuntu-latest
    steps:
      - name: Required package gate passed
        env:
          PACKAGE_BOUNDARIES_RESULT: ${{ needs.architecture-boundaries.result }}
        run: |
          test "$PACKAGE_BOUNDARIES_RESULT" = "success"
          echo "Package boundary, Contract, typecheck, build and action contract verification passed."
