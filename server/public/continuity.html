<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>接续 · Molis Work</title><link rel="stylesheet" href="/continuity/style.css"><script type="module" src="/continuity/client.js"></script></head>
<body><header><a href="/continuity">Molis Work</a><span>接续</span><button id="refresh" class="quiet">刷新</button></header>
<main><div id="notice" role="status" aria-live="polite"></div>
<section id="login" hidden><h1>把工作接过来</h1><p>在已连接的设备上生成配对码，或使用收到的项目邀请。每个代码只能使用一次。</p><form id="login-form"><label>配对码或邀请代码<input id="code" required autocomplete="off" spellcheck="false"></label><label>你的名字<input id="name" required maxlength="40" autocomplete="name"></label><label>这台设备的名字<input id="device-name" value="手机浏览器" required maxlength="60"></label><button type="submit">连接设备</button></form></section>
<div id="workspace" hidden><aside><h2>我的项目</h2><nav id="projects" aria-label="项目"></nav><p id="identity" class="muted"></p><button id="pair" class="quiet">连接另一台设备</button><button id="logout" class="quiet">退出这台设备</button><details><summary>已连接设备</summary><div id="devices"></div></details></aside>
<article><div class="project-heading"><div><h1 id="project-title">正在读取项目</h1><p id="sync-state" class="muted">从桌面读取最新状态…</p></div><button id="export" class="quiet">保存工作资产</button></div><div id="empty" hidden><h2>还没有共享项目</h2><p>请在桌面指定要接续的目标与成果，或接受一个项目邀请。</p></div><div id="goals"></div><section id="artifacts-section"><h2>可继续使用的成果</h2><div id="artifacts"></div></section><details id="team"><summary>项目成员与访问</summary><div id="members"></div><form id="invite-form"><label>邀请权限<select id="role"><option value="editor">协作成员 · 可记录进展</option><option value="viewer">只读成员 · 查看进展和成果</option></select></label><button type="submit">生成项目邀请</button></form></details><section id="code-panel" hidden><h2 id="code-title"></h2><p id="code-explanation"></p><output id="generated-code"></output><button id="close-code" class="quiet">收起代码</button></section></article></div>
</main><footer>桌面与手机使用同一份工作事实。记录进展不会代替完成验收。</footer></body></html>
