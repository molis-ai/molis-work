<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Molis Work 需求全景图</title>

<style>

:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0f1419;--paper:#232c35;--soft:#2a343e;--ink:#f3f6f9;--ink-soft:#d5dde4;--muted:#b3bfca;
  --line:#435160;--line-strong:#677684;--action:#dbe6ef;--action-ink:#17212b;
  --up:#a3cdf3;--up-soft:#2b4d6e;--down:#e8c78c;--down-soft:#473a20;--green:#97d3b1;--green-soft:#234533;
  --shadow-rgb:0,0,0;color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0f1419;--paper:#232c35;--soft:#2a343e;--ink:#f3f6f9;--ink-soft:#d5dde4;--muted:#b3bfca;
  --line:#435160;--line-strong:#677684;--action:#dbe6ef;--action-ink:#17212b;
  --up:#a3cdf3;--up-soft:#2b4d6e;--down:#e8c78c;--down-soft:#473a20;--green:#97d3b1;--green-soft:#234533;
  --shadow-rgb:0,0,0;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:13px/1.5 var(--font);letter-spacing:-.005em}
button{font:inherit;color:inherit;letter-spacing:inherit}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:15px;font-weight:650}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tab{border:0;background:transparent;padding:5px 10px;border-radius:7px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-selected=true]{background:var(--action);color:var(--action-ink);font-weight:550}

.spacer{flex:1 1 auto}
.theme{display:inline-flex;align-items:center;gap:5px;flex:none;padding:5px 9px;border:1px solid var(--line-strong);border-radius:7px;background:var(--paper);color:var(--ink-soft);font:inherit;cursor:pointer}
.theme:hover{background:var(--soft);color:var(--ink)}
.theme:active{transform:scale(.97)}
.counts{display:flex;gap:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.counts span{display:inline-flex;align-items:center;gap:5px}
.search{width:172px;min-width:0;padding:5px 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--paper);color:var(--ink);font:inherit}
.search::placeholder{color:var(--muted)}
.theme:focus-visible,.search:focus-visible,.card:focus-visible,.tab:focus-visible,.chip:focus-visible,.close:focus-visible,.detail a:focus-visible{outline:2px solid var(--up);outline-offset:2px}
.body{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
.board{position:relative;overflow:auto;min-width:0;padding-block:6px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lines{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.lines path{fill:none;stroke-width:1.4;opacity:.42}
.lines path.direct{stroke-width:2.2;opacity:.95}
.lines path.up{stroke:var(--up)}.lines path.down{stroke:var(--down)}
.lines marker path{opacity:1;stroke:none}
.stage{width:max-content;min-width:100%;padding-top:18px}
.stage[hidden]{display:none}
.stage-head{position:sticky;left:0;display:flex;align-items:baseline;gap:8px;width:max-content;padding:0 0 10px}
h2{margin:0;font-size:14px;font-weight:650}
.stage-head span{color:var(--muted)}
.cols{display:flex;gap:44px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px;width:186px;flex:none}
.card{position:relative;z-index:1;display:block;width:100%;text-align:left;padding:9px 11px 8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;cursor:pointer;box-shadow:0 1px 2px rgba(var(--shadow-rgb),.06);transition:opacity .16s,transform .14s,box-shadow .16s,border-color .16s,background .16s}
.card:hover{box-shadow:0 4px 14px rgba(var(--shadow-rgb),.13);transform:translateY(-1px);border-color:var(--line-strong)}
.card:active{transform:scale(.985)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ids{display:flex;align-items:baseline;gap:6px;min-width:0}
.track{min-width:0;padding:0 5px;border-radius:4px;background:var(--soft);color:var(--ink-soft);font-size:11px;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.claimed .track,.card[data-rel=up] .track,.card[data-rel=down] .track{background:var(--paper)}
.card[data-rel=self] .track{background:transparent;box-shadow:inset 0 0 0 1px var(--action-ink);color:var(--action-ink)}
.id{font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink-soft)}

.prog{display:flex;align-items:center;gap:6px;margin-top:6px}
.segs{display:flex;gap:2px;flex:1 1 0;min-width:0;max-width:max-content}

.seg.doing{background:var(--up)}.seg.done{background:var(--green)}.seg.pause{background:var(--down)}
.prog-t{flex:none;font-size:12px;font-weight:550;color:var(--ink-soft);white-space:nowrap}
.open-t{display:block;margin-top:6px;color:var(--action)}
.busy-t{color:var(--muted)}
.mark.busy{border-style:dashed;border-color:var(--ink-soft)}
.card.claimed{background:var(--up-soft);border-color:var(--up);box-shadow:0 3px 12px rgba(var(--shadow-rgb),.18);padding-left:14px}
.card.claimed::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:4px;border-radius:0 4px 4px 0;background:var(--up)}
.owner{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:6px;font-size:12px;font-weight:600;color:var(--ink);min-width:0}
.claim-tag{flex:none;max-width:100%;padding:0 6px;border-radius:5px;background:var(--up);color:var(--paper);font-size:11px;font-weight:700;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner-more{flex:none;font-weight:500;color:var(--ink-soft)}
.card.claimed.st-pause{background:var(--down-soft);border-color:var(--down)}
.card.claimed.st-pause::before,.card.claimed.st-pause .claim-tag{background:var(--down)}
.card.st-pause{border-color:var(--down)}
.mark.pause{background:var(--down);border-color:var(--down)}
.src{color:var(--up);text-decoration:none;white-space:nowrap}.src:hover{text-decoration:underline}
.items{gap:10px!important}
.item{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tag{flex:none;font-size:11px;font-weight:600;padding:0 6px;border-radius:5px;background:var(--line);color:var(--ink-soft);line-height:18px}
.tag.doing{background:var(--up-soft);color:var(--up)}.tag.done{background:var(--green-soft);color:var(--green)}.tag.pause{background:var(--down-soft);color:var(--down)}
.item-meta{margin-top:3px;font-size:12px;color:var(--muted)}
.item-meta a{color:var(--up);text-decoration:none}.item-meta code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.item-d{margin-top:5px;font-size:12px;line-height:1.55;color:var(--ink-soft)}
.warn{margin-top:8px!important;color:var(--down);font-size:12px}
.ready{margin-top:8px!important;color:var(--action);font-size:12px;font-weight:550}
.chip .mark{vertical-align:1px}
.rel{display:none;font-size:11px;font-weight:600;border-radius:5px;padding:0 5px}
.mark{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--line-strong);box-sizing:border-box}
.mark.open{border:2.5px solid var(--action)}
.mark.doing{background:var(--up);border-color:var(--up)}
.mark.done{background:var(--green);border-color:var(--green)}
.card.st-open{border:1.5px solid var(--action)}
.card.st-done{background:var(--green-soft)}
.focus .card{opacity:.34;box-shadow:none}
.focus .card[data-rel]{opacity:1}
.focus .card.far{opacity:.82}
.card[data-rel=up]{background:var(--up-soft);border-color:var(--up)}
.card[data-rel=down]{background:var(--down-soft);border-color:var(--down)}
.card[data-rel=up] .rel{display:inline;background:var(--paper);color:var(--up)}
.card[data-rel=down] .rel{display:inline;background:var(--paper);color:var(--down)}
.card[data-rel=self]{background:var(--action);border-color:var(--action);box-shadow:0 10px 26px rgba(var(--shadow-rgb),.28);transform:translateY(-1px);opacity:1}
.card[data-rel=self] .id,.card[data-rel=self] .name,.card[data-rel=self] .meta,.card[data-rel=self] .prog-t,.card[data-rel=self] .owner,.card[data-rel=self] .owner-more{color:var(--action-ink)}
.card[data-rel=self]::before,.card[data-rel=self] .claim-tag{background:var(--action-ink)}
.card[data-rel=self] .claim-tag{color:var(--action)}
.search-on .card:not(.hit){opacity:.26}
.detail{width:0;overflow:hidden;background:var(--paper);border-left:1px solid transparent;transition:width .2s cubic-bezier(.2,.8,.2,1)}
.detail.on{width:408px;border-left-color:var(--line);box-shadow:-10px 0 30px rgba(var(--shadow-rgb),.08)}
.inner{width:408px;box-sizing:border-box;height:100%;overflow-y:auto;padding:16px 18px 28px}
.d-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);gap:8px}
.close{border:0;background:transparent;width:28px;height:28px;border-radius:7px;font-size:17px;line-height:1;cursor:pointer;color:var(--muted)}
.close:hover{background:var(--soft);color:var(--ink)}
.detail h3{margin:2px 0 8px;font-size:18px;line-height:1.35;font-weight:650;text-wrap:balance}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.d-sec{margin-top:18px}
.d-sec h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.d-sec p{margin:0;line-height:1.62;color:var(--ink);max-width:65ch}
.d-sec ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.d-sec li b{font-weight:600}
.d-sec li{line-height:1.55;overflow-wrap:anywhere}
.chain{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chain>div{min-width:0}
.chips{display:flex;flex-direction:column;gap:4px}
.chip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--soft);padding:4px 8px;border-radius:7px;cursor:pointer;line-height:1.35;transition:border-color .14s,background .14s}
.chip:hover{border-color:var(--line-strong);background:var(--paper)}
.chip b{font-weight:650;font-variant-numeric:tabular-nums;margin-right:3px}
.chip small{display:block;color:var(--muted);font-size:11px}
.chain h4.u{color:var(--up)}.chain h4.d{color:var(--down)}
.none{color:var(--muted)}
.links{display:flex;gap:14px;margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
.links a{color:var(--up);text-decoration:none}.links a:hover{text-decoration:underline}
.foot{position:sticky;left:0;width:max-content;max-width:min(680px,88vw);margin-top:26px;color:var(--muted);font-size:12px}
@media (max-width:760px){
  .search{flex:1 1 120px}.counts{display:none}.spacer{display:none}.src{order:5;flex-basis:100%;font-size:12px;white-space:normal}
  .body{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;left:0;right:0;bottom:0;width:auto!important;height:0;z-index:5;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transition:height .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 30px rgba(var(--shadow-rgb),.2)}
  .detail.on{height:74%}
  .chain{grid-template-columns:minmax(0,1fr)}
  .inner{width:auto;padding-bottom:max(28px,env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card:hover,.card:active,.tab:active{transform:none}}
</style>

<script>
// 主题：默认跟随系统，点过就记住。放在最前面，首屏就是对的颜色
const THEME_KEY='molis-theme';
const rootEl=document.documentElement;
const setTheme=v=>{rootEl.dataset.theme=v;rootEl.style.colorScheme=v};

const D={"batches":[{"id":"01","title":"防腐基线核准","stage":"0","intro":"防腐整理收尾之后，仓库里同时有已合进去的、还开着没合的、以及做了一半停下的东西，谁也说不清现在到底处在什么状态。这一批先把账对清楚：最新的代码里实际有什么，哪些旧工作还要接着做，哪些已经做完的需求文档可以归档。做完你会拿到一份真实的起点，外加一张验收单，把所有等你亲自试用的东西集中在一处。","ask":"定一下验收是你亲自逐项试，还是像 9 月 30 日那样委托验证；要不要在真实 Home 重建之前就提前开工；以及各条线接下来由哪个会话负责。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/01.md","items":[{"t":"基线、旧成果与在途需求核对","d":"核最终 main、旧 PR、未交付成果及在途需求变更；个人同步分支随服务端批 SRV-1、CGS 分支随 81 再盘点，本批不盘点；明确桌面 WebKit、双实例可选权限及真实验收去向；核 #1727 的实际采用和 #1730 的需求增量，不能把在途 PR 当成已合入；对抗式审查各项决定用户 11-03 已确认，不再另核","track":"无","occ":false,"also":[]},{"t":"归档、状态修正与验收单","d":"按 需求清单 1 归档已做完的 spec、改对不上的状态句（H7），备好一张验收单（BACKLOG「待你验收」、需求清单 1 新增项含 F1、VUX 本人验收）","track":"无","occ":false,"also":[]}],"pre":[],"soft":[],"cond":["防腐收尾","决定 21（待定）：是否允许 #1725 合入后提前启动阶段 0，不等真实 Home 重建和本人验收窗口"],"split":false,"nodes":[{"id":"01","items":[0,1],"hard":[]}]},{"id":"02","title":"需求、版本与工程收口","stage":"0","intro":"防腐整理留下几类收尾：零散的待办和风险散在几个地方，有的没人负责；几份共用的基础代码有重复，版本号也各自涨过、没有统一；以后升级要从哪个版本算起也还没定下来。这一批把它们收干净：每件遗留的事都有主人、只记在一个地方，共用代码各留一份，所有版本回到同一个起点，并写好「从此以后改结构要怎样升级」的规则。做完之后，后面每一批都在一个干净、统一的起点上开工。","ask":"真实 Home 的清空重建要等你说开始（旧 Home 整个搬开、不删）；版本号回到 0.1.0 之前，要先在 GitHub 上删掉旧的发布和标签，这一步只能你来；对外的许可说法和几条还没定的检查规则也要你定。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/02.md","items":[{"t":"遗留事项、主人与唯一待办","d":"①按 R1／R8、N5／N6／N9 核回遗留 PR、风险与零碎单，补主人和唯一待办","track":"无","occ":false,"also":[]},{"t":"共享核心、SQLite 驱动与合同复位","d":"②按 R2／R3 交共享核心收口、SQLite 驱动归 storage 的第一步及合同复位","track":"C1","occ":true,"also":["A","B","C2","E"]},{"t":"版本归一与重建清理","d":"③同真实 Home 重建窗口完成 N4、N30～34、N36／N37 的归一与清理","track":"统筹","occ":false,"also":[]},{"t":"升级起点与合同规则 U0","d":"④规则 N35／N41 与 U0 同批生效，留统一起点，接 05 升级链。各片具体范围见台账各行，不把整批当一个 PR","track":"C1","occ":false,"also":[]},{"t":"对外许可口径与 BACKLOG 整理","d":"另做对外许可口径（A4，官网仓库）与按 需求清单 7 重排 BACKLOG","track":"无","occ":false,"also":[]}],"pre":["01"],"soft":[],"cond":["真实 Home 维护授权","先删旧 release"],"split":true,"nodes":[{"id":"02.1","items":[0],"hard":["01"]},{"id":"02.2","items":[1],"hard":["01"]},{"id":"02.3","items":[2],"hard":["01","02.2"]},{"id":"02.4","items":[3],"hard":["02.3"]},{"id":"02.5","items":[4],"hard":["01"]}]},{"id":"03","title":"基础交互共同设计","stage":"1","intro":"后面几十批都会碰到同几块界面：资料和目录怎么选、工作台怎么切换、事项怎么放、对象怎么展示、对话和后台任务怎么看、创作台怎么从想法走到插件。如果各做各的，最后会长成好几套互相不搭的样子。这一批先不写正式代码，而是把这些主路径做成能点、能试的样子，连同文案和按需帮助一起清点；还会做出三条助理路径的样子——先安静准备、必要时才提醒你，先观察试用再决定启用，多项交付里退回一部分后再复核——模拟的部分会标明；并定下创作台主推哪些角色、样例插件用来做什么。做完你会看到几套可以亲手操作的方案，挑定之后后面各批照着做。","ask":"亲自看样、挑定方向；创作台的交互方案也要你定。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/03.md","items":[{"t":"资料、工作台、输入和创作台主路径定样","d":"依次定资料／目录／工作台、主线顶部事项切换、智能呈现四种基础形态、连续对话／后台任务和创作台主路径","track":"D","occ":false,"also":["A","C1","E"]},{"t":"文案帮助、创作断点与角色样例用途","d":"清点全产品文案与按需帮助，定位真实创作失败断点，并在创作台原 spec 明确 C5 主推角色及各自样例用途","track":"D","occ":false,"also":["F","E"]},{"t":"安静准备、观察试用与部分返工定样","d":"按 #1730 定安静准备→必要提醒、观察试用→反馈启用、多项交付→部分退回→复核三条路径","track":"A","occ":false,"also":["C","D"]}],"pre":["01","02"],"soft":[],"cond":["决定 11（待定）：Sessions 会话交互和技术方案；创作台原 spec §7 的合同与交互；团队剩余细粒度规则、同步交互及团队记忆形成／融合／管理／使用策略"],"split":false,"nodes":[{"id":"03","items":[0,1,2],"hard":["01","02.1"]}]},{"id":"04","title":"Onboarding 全程设计","stage":"1","intro":"现在第一次用 Molis Work 的人，从放进资料、连上模型，到真正开始第一件工作，中间容易卡住或走丢；中途退回去改一下，前面填的东西也可能没了。这一批把整个引导从头到尾设计一遍，包括出错、返回、换范围以后怎样接着走，以及从页面上的帮助跳进引导、做完再回到原来的任务。做完你会看到一套能完整点下来的引导样子。","ask":"看样并定下来。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/04.md","items":[{"t":"Onboarding 全程设计","d":"材料起步、返回改范围、模型／连接返回、动态补问、场景配置、助理团、生成首页、设置映射和恢复；从页面帮助进入准备时保留对象、输入与配置，完成后返回原任务","track":"F","occ":false,"also":["A","D"]}],"pre":["03"],"soft":[],"cond":[],"split":false,"nodes":[{"id":"04","items":[0],"hard":["03"]}]},{"id":"05","title":"升级基础与公共合同","stage":"1","intro":"以后每发一个新版本，旧的数据都得能接着用；可现在还没有一套「装新版本时自动把旧数据升上来、失败能退回」的机制。另外，资料怎么选、对象怎么展示，后面很多插件都要用，需要先把大家都认的规矩写好。这一批先打这些地基：升级的机制和用来检验升级的样本数据，资料、目录、展示的公共规矩，以及数据库换成更合适的底层。做完你基本看不到界面变化，但后面每批都可以放心改，不怕把你的数据弄坏。没有要你做的决定。","ask":"","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/05.md","items":[{"t":"升级链 U1 与金样回放 U2","d":"先交 U1 库及带版本文件的升级链、快照／失败恢复，留 U2 首份金样并接回放（U1 就绪后启门禁）","track":"C1","occ":true,"also":["F"]},{"t":"资料、目录与呈现公共合同","d":"交资料身份、多输入／单输出目录、浏览／执行与撤权合同，以及智能呈现声明、组合服务公开合同及 SDK 共用校验；确定组合实现归 15 的独立平台服务","track":"C1","occ":true,"also":["D"]},{"t":"SQLite 第二步切换","d":"SQLite 第二步在 02 驱动收拢和重建后单独切换，与 U1 按 storage 共用文件串行","track":"C1","occ":true,"also":[]},{"t":"版本字段与 schema 输入类型","d":"按 N14 决定版本字段的公共声明、N22 从 schema 推导输入类型。","track":"C1","occ":true,"also":[]},{"t":"编辑器字段整理","d":"BL-900 先区分编辑器非持久字段与已存结果合同，只整理前者，后者沿原 R-B 边界","track":"C1","occ":true,"also":["E"]}],"pre":["01","02","03","04"],"soft":[],"cond":["N14 先定归属"],"split":true,"nodes":[{"id":"05.1","items":[0],"hard":["02.4","02.3"]},{"id":"05.2","items":[1],"hard":["03","04"]},{"id":"05.3","items":[2],"hard":["02.2","02.3"]},{"id":"05.4","items":[3],"hard":["01"]},{"id":"05.5","items":[4],"hard":["01"]}]},{"id":"06","title":"公共资料、SDK 工具与调用成本整治","stage":"1","intro":"各个插件里有不少一样的小工具各写了一份，有些页面打开一次要在背后做几万次重复检查，所以慢。这一批把公共的部分收成一份给所有插件用，再把这些重复的调用减下来，并加一道检查，防止以后又悄悄变多。做完以后，同样的操作反应更快，插件作者也不用再自己重写这些东西。","ask":"其中一项（几类文档记录的通用写法归谁维护）先由统筹定，不需要你操心。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/06.md","items":[{"t":"公共资料与迁移清单","d":"交目录选择／读取、消费者及历史引用／快照／选区／过程项迁移清单","track":"C1","occ":true,"also":["D"]},{"t":"文档记录协议与 SDK 共用实现","d":"N12 先由统筹定文档记录协议归属，再与 N13／N15／N16 接唯一公共实现。","track":"C1","occ":true,"also":["A","B","E"]},{"t":"宿主调用整治与缓存核查","d":"调用整治按“记录基线→N42／43／44／46 与 N56 同 PR→N45→核 N55 缓存”推进","track":"统筹","occ":false,"also":[]},{"t":"各包调用成本补齐","d":"N47～51 按包补齐，N47 由 Runtime 主人裁定，后续新增入口沿同一预算核对","track":"C1","occ":true,"also":["E"]}],"pre":["05"],"soft":[],"cond":["N12 归属、N16 门禁"],"split":true,"nodes":[{"id":"06.1","items":[0],"hard":["05.2"]},{"id":"06.2","items":[1],"hard":["05.2"]},{"id":"06.3","items":[2],"hard":["05.2"]},{"id":"06.4","items":[3],"hard":["06.2"]}]},{"id":"07","title":"工作台导航与资料接入","stage":"1","intro":"标签页、标签组、分屏、侧栏和底栏现在各有一套切换和恢复的方式，用起来不一致；有的页面还在后台不停地发请求，甚至一直重复发必然失败的请求。这一批把工作台的导航统一成一套，让你装的插件都能出现在同一个地方，同时把多余和必然失败的请求清掉，并把 Feed 的页面数据整理搬回 Feed 插件自己。做完你会感觉切换更顺、不再莫名卡顿。","ask":"如果出现之前没定过的新导航样子，要你看一眼定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/07.md","items":[{"t":"工作台导航、布局与 Home 插件接入","d":"统一标签／标签组、分屏、侧栏、底栏、选择／定位／恢复；接已安装 Home 插件的导航与图标","track":"D","occ":true,"also":["A","B","E","F"]},{"t":"页面读取与轮询整治","d":"落实 N52～54：侧栏合并读取、消除必然失败请求、前后台及 404 停轮询","track":"D","occ":true,"also":["A","F"]},{"t":"Feed 投影归回插件","d":"BL-880 将 Feed 投影模型迁回原插件，由 D/E 同片协调枢纽","track":"D","occ":true,"also":["E"]}],"pre":["03","06"],"soft":[],"cond":["BL-880 不挡导航"],"split":false,"nodes":[{"id":"07","items":[0,1,2],"hard":["03","06.1"]}]},{"id":"08","title":"技能包基础能力","stage":"1","intro":"现在想把一套做法（比如写某类文档的方法、一组提示）装进来给助理和 Coding 用，没有统一的包装和安装方式。这一批做「技能包」：把做法打成一个包，像装插件一样安装、启用或只在手动点名时用、升级和卸载；别处已有的 Skills 也能导进来。做完你可以在一个地方看到、管理所有技能包。","ask":"看一下安装、启用和管理的界面样子并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/08.md","items":[{"t":"技能包基础能力","d":"公共格式、普通插件安装、外部 Skills 导入、启用／仅手动、版本／停用／卸载、共同目录；纳入设计与无障碍内容包","track":"C1","occ":true,"also":["D","E"]}],"pre":["02","05"],"soft":[],"cond":[],"split":false,"nodes":[{"id":"08","items":[0],"hard":["02.2","05.1","05.3"]}]},{"id":"09","title":"助理与 Coding 接点","stage":"1","intro":"技能包做出来以后，助理和 Coding 现在还各看各的，同一个技能在两边不一定都能用到。这一批把两边接到同一份技能目录上，并修好从助理把活交给 Coding 的入口。做完你在助理里和在 Coding 里能用同一个技能，用到的版本也一样。没有要你做的决定。","ask":"","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/09.md","items":[{"t":"助理与 Coding 接点","d":"接共同技能目录及精确版本、修正委派入口；真实验证同一技能在两处使用，完成手册 ADH-23 对应接入","track":"A","occ":true,"also":["B","C1"]}],"pre":["08"],"soft":[],"cond":[],"split":false,"nodes":[{"id":"09","items":[0],"hard":["08"]}]},{"id":"10","title":"统一输入公共组件","stage":"1","intro":"首页、助理和 Coding 各有一个输入框，按键、附件、发送和打断的方式不完全一样，容易按错。这一批先做一个公共的输入框：文字、附件、发送、补充一句、排队、打断、选择发给谁，按键统一成已经定好的那一套，插件也能往里加自己的东西。做完后三处会换成同一个输入框（下一批接）。","ask":"看输入框各种状态的样子并定下；还要定助理对外用哪几个词（比如「工作」「任务」「受托工作」怎么叫）。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/10.md","items":[{"t":"统一输入公共组件","d":"文字、附件、发送／补充／排队／打断、目标、焦点及插件扩展；统一对外术语和已定键位。覆盖 VUX-16、VUX-17、VUX-18。","track":"A","occ":true,"also":["C1","D"]}],"pre":["03"],"soft":[{"id":"09","k":"c"}],"cond":["要决策：术语 H4"],"split":false,"nodes":[{"id":"10","items":[0],"hard":["03"]}]},{"id":"11","title":"三入口接入统一输入","stage":"1","intro":"公共输入框做好以后，要真的换到首页、个人助理和 Coding 三个地方去。这一批就是换上，并把附件发送失败、排队、中途补充、打断、发给谁不跑掉这些情况逐一试通。做完你在三处用的是同一个输入框，行为一致。没有新的东西要你定。","ask":"","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/11.md","items":[{"t":"三入口接入统一输入","d":"首页、个人助理、Coding 使用同一组件，完成附件失败、队列、补充、打断和目标保持验证","track":"A","occ":true,"also":["B"]}],"pre":["10"],"soft":[],"cond":[],"split":false,"nodes":[{"id":"11","items":[0],"hard":["10"]}]},{"id":"12","title":"基础工作路径贯通","stage":"1","intro":"一件真实的工作从「放进资料」到「交给 Coding 去做」再到「看到结果」，现在中间有好几处断开：Coding 的计划卡和任务板编号对不上，命令没有给出退出码也会显示成功，材料放进项目后接不到 Coding。这一批把这条基本路径从头到尾打通，并把这些明显的错修掉。做完你可以拿一份真实材料，一路交给 Coding 做完、看到可靠的进度和结果。","ask":"看一下目录、规则和出错恢复这几处的界面样子并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/12.md","items":[{"t":"Coding 执行、委派与可见状态","d":"Coding 目录执行、委派、规则／模式、渲染、计划／TaskBoard 与命令状态。TaskBoard／计划卡编号与状态一致（BL-161、BL-164）；无退出码的命令不能显示成功（BL-222）。","track":"B","occ":true,"also":["A"]},{"t":"材料进入项目与 Coding 接续","d":"真实材料进入项目、返回并交给 Coding；落实未知结果核对","track":"F","occ":true,"also":["B"]}],"pre":["04","06","07","09","11"],"soft":[],"cond":[],"split":false,"nodes":[{"id":"12","items":[0,1],"hard":["04","06.1","07","09","11"]}]},{"id":"13","title":"服务与模型基础连接","stage":"1","intro":"连接常用服务和模型时，要填的东西多、出错后不知道怎么办，连好之后也回不到原来在做的事。这一批把基础连接做顺：默认怎么连、只问必要的信息、连接是否正常看得见，取消、失效、换账号都能恢复，连完自动回到刚才的工作。做完新用户能比较轻松地把用得到的服务接上。","ask":"看连接和高级配置的样子并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/13.md","items":[{"t":"服务与模型基础连接","d":"默认连接、必要字段、保存与健康状态、取消／失效／换账号恢复、连接后回到原工作；先覆盖基础路径所需服务","track":"D","occ":true,"also":["A","F"]}],"pre":["12"],"soft":[],"cond":[],"split":false,"nodes":[{"id":"13","items":[0],"hard":["12"]}]},{"id":"14","title":"字体皮肤语言 A 段","stage":"1","intro":"界面的字体、皮肤和中英文文字现在写死在各处，想换外观或补翻译，要到处改，还容易漏。这一批先把规矩定下来：界面文字、字体、皮肤怎样登记、怎样引用，并给出完整的基础清单，同时量清楚页面加载的开销，确保换了以后不变慢。做完你基本看不到界面变化，但后面换外观、补语言就有了统一的做法。","ask":"看外观选择的样子并定下；字体资源的预算、Folio 用哪款字体、除了中英文还要不要别的语言，要你定。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/14.md","items":[{"t":"字体皮肤语言 A 段","d":"格式、文字引用、资源／快照协议、SDK 工具与完整基线文件；提供真实 Host／浏览器消费者及公开两包样例，不能只交类型或空 API；先给统一资源登记／预算方案，测基础 CSS／JS、启动 JSON、语言与字体请求及首屏总传输／时间，不把字节搬到未计量入口","track":"D","occ":true,"also":["C1"]}],"pre":["03","05"],"soft":[],"cond":["决定 23（待定）：字体资源登记／预算与实测节省，新增资源／字体路径或必要门禁调整；Folio 实际字体及分发依据；额外首批语种"],"split":false,"nodes":[{"id":"14","items":[0],"hard":["03","05.2"]}]},{"id":"15","title":"首页公共能力与智能呈现第一片","stage":"1","intro":"项目首页现在信息零散，同一个对象（比如一个 Goal、一条 Inbox）在不同地方显示得不一样，能做的操作也不一样。这一批做一层公共的「展示」能力：同一个对象在首页、插件里、对话里都按同一套方式显示成名字、一行、一张卡片或速览，并配上允许的操作；再做出一个不装别的插件也能用的基础首页，修好 Feed 的归属和计数。做完你会看到首页清楚了，同一个东西在各处看起来一致。","ask":"看首页和四种展示样子并定下。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/15.md","items":[{"t":"确定组合平台服务","d":"先在独立 horizontal 包实现组合服务，由服务做确定组合、Host 仅装配，SDK 只保留作者与平台共用校验","track":"C3","occ":true,"also":[]},{"t":"公共来源、呈现组件与首批入口","d":"在本批组合服务上交共用来源、呈现和挂载；交名字片、行、卡片、速览及组件板，接 Goals／Inbox／Coding 声明与插件内、对话、项目讨论、等你；确定组合不等模型、技能包或采集","track":"D","occ":true,"also":["A","B","C1"       const r=rs[i]||['','','','','待认领',''];

      if(rs[i]&&name!==it.t)boardOff++;

  src.textContent=(boardFailed?`暂时读不到 #1743，显示的是 ${when} 的进展`:`进展来自 #1743 · 更新于 ${when}`)+(boardOff?` · ${boardOff} 处与路线书对不上`:'');
}
let tab='all',selected=null;
function renderTabs(){
  $('tabs').replaceChildren(...[['all','全部'],...STAGES.map(s=>[s[0],s[1]])].map(([k,l])=>{
    const t=el('button','tab',l);t.type='button';t.setAttribute('role','tab');t.setAttribute('aria-selected',tab===k);t.onclick=()=>setTab(k);return t}));
}
function setTab(k){tab=k;renderTabs();document.querySelectorAll('.stage').forEach(s=>s.hidden=k!=='all'&&s.dataset.s!==k);$('board').scrollTo({left:0,top:0});drawLines()}
function renderCounts(){
  const c={wait:0,busy:0,open:0,doing:0,pause:0,done:0};D.batches.forEach(b=>c[stateOf(b.id)]++);
  $('counts').replaceChildren(...Object.keys(STATUS).filter(k=>!OPTIONAL_STATUS.has(k)||c[k]).map(k=>{const s=el('span');s.append(el('i','mark '+k),document.createTextNode(`${STATUS[k]} ${c[k]}`));return s}));
}
function chip(id){
  const b=byId[id],x=el('button','chip');x.type='button';const mk=el('i','mark '+stateOf(id));mk.title=STATUS[stateOf(id)];x.append(mk,document.createTextNode(' '),el('b',null,id),document.createTextNode(b.title));
  const here=byId[selected];if(here&&b.stage!==here.stage)x.append(el('small',null,stName[b.stage]));
  x.onclick=()=>{if(tab!=='all'&&b.stage!==tab)setTab(b.stage);select(id)};return x;
}
function chipList(ids,empty){
  if(!ids.length)return el('div','none',empty);
  const w=el('div','chips');ids.forEach(i=>w.append(chip(i)));return w;
}
const sorted=s=>[...s].sort((a,b)=>D.order[a]-D.order[b]);
function renderDetail(id){
  const b=byId[id],box=$('inner');box.replaceChildren();
  const h=el('div','d-head');const left=el('span');left.textContent=`第 ${id} 批 · ${stName[b.stage]}`;
  const x=el('button','close','×');x.type='button';x.setAttribute('aria-label','关闭详情');x.onclick=()=>select(null);h.append(left,x);box.append(h);
  box.append(el('h3',null,b.title));
  const s=el('div','status');s.append(el('i','mark '+stateOf(id)),document.createTextNode(STATUS[stateOf(id)]));box.append(s);
  const sec=(t,c)=>{const d=el('div','d-sec');d.append(el('h4',null,t),c);box.append(d)};
  sec('这批要做什么',el('p',null,b.intro));
  const ul=el('ul','items');b.items.forEach(i=>{
    const li=el('li','item');const top=el('div','item-top');top.append(el('b',null,i.t));
    const tag=el('span','tag '+(ITEM_TONE[i.s]||'none'),i.s);top.append(tag);li.append(top);
    const m=[];if(i.track)m.push(i.track==='无'?'不占轨道':i.track==='统筹'?'统筹排期':`${i.track} ${TRACK_NAMES[i.track]}${i.occ?'':'（不占用）'}`);if(i.note)m.push(i.note);if(i.who){const note=i.who.match(/[（(]([^）)]*)/);m.push(claimTag(i)+(note&&note[1].replace(/本机[，,、]?/,'')?`（${note[1].replace(/本机[，,、]?/,'')}）`:''))}if(i.date)m.push('更新 '+i.date);
    if(m.length)li.append(el('div','item-meta',m.join(' · ')));
    if(i.prs.length||i.branch){const w=el('div','item-meta');
      i.prs.forEach(p=>{const a=el('a',null,'#'+p);a.href=REPO+'/pull/'+p;a.target='_blank';a.rel='noopener';w.append(a,document.createTextNode(' '))});
      if(i.branch&&!i.prs.length)w.append(el('code',null,i.branch));li.append(w)}
    li.append(el('div','item-d',i.d));ul.append(li)});
  sec(`进展（合入 ${b.merged}/${b.items.length}）`,ul);
  if(b.undone.length)box.lastChild.append(el('p','warn',`前置还没合入：${b.undone.join('、')}。批次文件写明可并行的部分不受影响。`));
  if(b.ready.length)box.lastChild.append(el('p','ready',b.items.length>1?`现在能领：${b.ready.map(i=>i.t).join('、')}。`:'前置已合入，轨道空闲，现在能领。'));
  b.waitTrack.forEach(w=>box.lastChild.append(el('p','warn',`${b.items.length>1?w.i.t+'：':''}等 ${w.track} 轨的 ${w.by.join('、')} 做完`)));
  const ch=el('div','d-sec chain');
  const u=el('div'),d=el('div');const nu=reach(id,up).size,nd=reach(id,down).size;
  u.append(el('h4','u',id==='89'?'要先完成':`要先完成（上游共 ${nu} 批）`),id==='89'?el('div','none','除服务端批外的其余全部批次'):chipList(sorted(up[id]),'没有前置'));
  d.append(el('h4','d',`它放行（下游共 ${nd} 批）`),chipList(sorted(down[id]),id==='89'?'这是整条路线的最后一批':'没有批次必须等它'));
  ch.append(u,d);box.append(ch);
  if(b.split)sec('开放方式',el('p',null,'这批的子项前置不同，可能先开放其中几项。'));
  if(b.soft.length){const l=el('ul');b.soft.forEach(k=>{const li=el('li');li.append(el('b',null,k.id+' '),document.createTextNode(byId[k.id].title+'：'+KIND[k.k]));l.append(li)});sec('不挡开工，但要知道',l)}
  if(b.cond.length||b.ask){const l=el('ul');b.cond.forEach(t=>l.append(el('li',null,t)));if(b.ask){const li=el('li');li.append(el('b',null,'需要负责人做的：'),document.createTextNode(b.ask));l.append(li)}sec('开工条件',l)}
  const links=el('div','links');[['批次文件',b.url],['Goal Prompt',b.url+'#goal-prompt']].forEach(([t,u])=>{const a=el('a',null,t+' ↗');a.href=u;a.target='_blank';a.rel='noopener';links.append(a)});box.append(links);
  box.scrollTop=0;
}
function select(id){
  selected=id;
  Object.values(cards).forEach(c=>{delete c.dataset.rel;c.classList.remove('far');c.setAttribute('aria-pressed','false');c.querySelector('.rel').textContent=''});
  const bd=$('board');
  if(!id){bd.classList.remove('focus');$('detail').classList.remove('on');$('paths').replaceChildren();return}
  const a=reach(id,up),d=reach(id,down);
  a.forEach(x=>{const c=cards[x];c.dataset.rel='up';c.querySelector('.rel').textContent='上游';if(!up[id].has(x))c.classList.add('far')});
  d.forEach(x=>{const c=cards[x];c.dataset.rel='down';c.querySelector('.rel').textContent='下游';if(!down[id].has(x))c.classList.add('far')});
  cards[id].dataset.rel='self';cards[id].setAttribute('aria-pressed','true');
  bd.classList.add('focus');renderDetail(id);$('detail').classList.add('on');
  drawLines();
  // 等详情面板展开、看板变窄之后再判断卡片是否被遮住
  setTimeout(()=>{if(selected!==id)return;const r=cards[id].getBoundingClientRect(),b=bd.getBoundingClientRect();
    if(r.left<b.left+20||r.right>b.right-20||r.top<b.top+20||r.bottom>b.bottom-20)cards[id].scrollIntoView({block:'center',inline:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})},240);
}
function drawLines(){
  const svg=$('lines'),g=$('paths'),bd=$('board');g.replaceChildren();
  svg.setAttribute('width',bd.scrollWidth);svg.setAttribute('height',bd.scrollHeight);
  if(!selected)return;
  const a=reach(selected,up),d=reach(selected,down),B=bd.getBoundingClientRect();
  const P=e=>{const r=e.getBoundingClientRect(),x=bd.scrollLeft-B.left,y=bd.scrollTop-B.top;return{l:r.left+x,r:r.right+x,cx:r.left+x+r.width/2,top:r.top+y,bot:r.bottom+y,y:r.top+y+r.height/2}};
  const NS='http://www.w3.org/2000/svg';
  const visible=id=>cards[id].offsetParent!==null;
  D.edges.forEach(([p,u])=>{
    const isUp=(a.has(p)&&(a.has(u)||u===selected)),isDown=((d.has(u))&&(d.has(p)||p===selected));
    if(!isUp&&!isDown||!visible(p)||!visible(u))return;
    const direct=p===selected||u===selected;
    // 跨阶段的线只画直接相连的，其余在详情里列出，避免长线穿过整屏
    if(!direct&&byId[p].stage!==byId[u].stage)return;
    const s=P(cards[p]),t=P(cards[u]),dx=Math.max(26,Math.abs(t.l-s.r)*.45);
    const path=document.createElementNS(NS,'path');
    const back=t.l<s.r+12,dy=Math.max(24,Math.abs(t.top-s.bot)*.5);
    path.setAttribute('d',back?`M${s.cx} ${s.bot}C${s.cx} ${s.bot+dy} ${t.cx} ${t.top-dy} ${t.cx} ${t.top-1}`:`M${s.r} ${s.y}C${s.r+dx} ${s.y} ${t.l-dx} ${t.y} ${t.l-1} ${t.y}`);
    path.setAttribute('class',(isUp?'up':'down')+(direct?' direct':''));
    path.setAttribute('marker-end',`url(#${isUp?'au':'ad'})`);
    g.append(path);
  });
}
$('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();$('board').classList.toggle('search-on',!!q);
  Object.entries(cards).forEach(([id,c])=>c.classList.toggle('hit',!!q&&(id.toLowerCase().startsWith(q)||byId[id].title.toLowerCase().includes(q)||tracksOf(byId[id]).some(x=>`${x} 轨`.toLowerCase().startsWith(q)))));
});
$('search').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const h=document.querySelector('.card.hit');if(h){const id=h.dataset.id;if(tab!=='all'&&byId[id].stage!==tab)setTab(byId[id].stage);select(id)}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&selected)select(null)});
new ResizeObserver(()=>drawLines()).observe($('board'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawLines);
const themeBtn=$('theme');
const currentTheme=()=>rootEl.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const SUN='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const MOON='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7Z" fill="currentColor"/></svg>';
function renderTheme(){
  const dark=currentTheme()==='dark';
  themeBtn.innerHTML=(dark?SUN:MOON)+`<span>${dark?'浅色':'深色'}</span>`;
  themeBtn.setAttribute('aria-label',dark?'切换到浅色背景':'切换到深色背景');
}
themeBtn.addEventListener('click',()=>{
  const v=currentTheme()==='dark'?'light':'dark';
  setTheme(v);
  try{localStorage.setItem(THEME_KEY,v)}catch(e){}
  renderTheme();
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',renderTheme);
renderTheme();
renderTabs();renderCounts();renderSource();
function repaint(){
  Object.keys(cards).forEach(id=>cards[id].replaceWith(buildCard(id)));
  renderCounts();
  if(selected)select(selected);else drawLines();
  $('search').dispatchEvent(new Event('input'));
}
let boardBody=D.board,boardRead=0;
// 未带令牌的接口按出口 IP 限额，代理的出口常被别人用完；隔几秒再试，常能换到另一个出口
const getJson=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error(String(r.status));return r.json()};
async function readBoard(attempt=0){
  boardRead=Date.now();
  // Action 写的静态文件不受接口限额影响，但有几分钟缓存；接口更新，读得到就用更新的那份
  const got=(await Promise.allSettled([getJson(BOARD_RAW,{cache:'no-cache'}),getJson(BOARD_API,{headers:{Accept:'application/vnd.github+json'}})])).filter(r=>r.status==='fulfilled').map(r=>r.value);
  if(!got.length){
    if(attempt<2){setTimeout(()=>readBoard(attempt+1),attempt?8000:3000);return}
    boardFailed=true;renderSource();return;
  }
  boardFailed=false;
  const j=got.reduce((a,x)=>x.updated_at>a.updated_at?x:a);
  const who=got.find(x=>x.claimers);
  const whoChanged=who&&JSON.stringify(who.claimers)!==JSON.stringify(D.claimers);
  if(whoChanged)D.claimers=who.claimers;
  if(j.updated_at>=boardAt)boardAt=j.updated_at;
  const fresh=j.updated_at>=D.boardAt&&j.body!==boardBody;
  if(fresh)boardBody=j.body;
  if(fresh||whoChanged){applyBoard(boardBody);repaint()}
  try{localStorage.setItem(BOARD_KEY,JSON.stringify({body:boardBody,at:boardAt,claimers:D.claimers}))}catch(e){}
  renderSource();
}
readBoard();
// 没带令牌的 GitHub 接口每个 IP 每小时 60 次，切回页面时最多 5 分钟读一次
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-boardRead>3e5)readBoard()});
const h=location.hash.match(/^#b(.+)$/);if(h&&byId[h[1]])select(h[1]);
</script>
