<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主线事项切换定样 · Molis Work 原型</title>
  <link rel="stylesheet" href="../kit/kit.css?v=2">
  <link rel="stylesheet" href="../workbench-shared-paths/styles.css?v=7">
  <link rel="stylesheet" href="ml.css?v=2">
</head>
<body>
  <div id="icons" hidden></div>
  <div class="proto" role="region" aria-label="原型控制（不是产品界面）">
    <b data-t="protoTitle"></b>
    <label><span data-t="scheme"></span>
      <span class="mw-toggle-group" data-slot="toggle-group" data-seg-thumb role="group" id="scheme">
        <button type="button" data-scheme="A">A</button><button type="button" data-scheme="B">B</button><button type="button" data-scheme="C" title="已定（2026-11-03）">C ✓</button>
      </span>
    </label>
    <label><span data-t="fault"></span>
      <select id="fault"></select>
    </label>
    <label><span data-t="lang"></span>
      <span class="mw-toggle-group" data-slot="toggle-group" data-seg-thumb role="group" id="lang"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></span>
    </label>
    <label><span data-t="theme"></span>
      <span class="mw-toggle-group" data-slot="toggle-group" data-seg-thumb role="group" id="theme"><button type="button" data-theme-set="light" data-t="light"></button><button type="button" data-theme-set="dark" data-t="dark"></button></span>
    </label>
    <button type="button" class="mw-btn mw-btn--secondary mw-btn--sm" data-slot="button" id="reset" data-t="reset"></button>
  </div>
  <div class="app" id="app"></div>
  <script src="../kit/kit.js?v=1"></script>
  <script src="../workbench-shared-paths/kit-bridge.js?v=2"></script>
  <script src="data.js?v=1"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
