name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-boundaries:
    name: Package boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package contracts and boundaries
        run: pnpm workspace:verify

      # Numbers that may only go down: giant units, tests reaching into package internals, vendored SDK packages,
      # in-place schema patches, and a status line on every spec in specs/ (specs/repository-anti-corruption §5a).
      - name: Health gates
        run: pnpm health:check

      - name: Verify Goal boundaries, migrations and release assets
        run: |
          node --test tests/goals-query-boundaries.test.mjs tests/goals-storage-boundaries.test.mjs
          node scripts/run-tests.mjs tests/goals-storage-migration.test.ts tests/release-assets.test.ts tests/installer-symlink-dependencies.test.ts

      - name: Typecheck product launchers and compatibility SDK
        run: |
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm exec tsc --noEmit -p tsconfig.sdk.json

      # Action directory, Manifest and MCP grant contracts, and undeclared names in the assembled Workbench client;
      # runs on the packages built above.
      # The full product suite still runs locally (see the PR template).
      - name: Action and plugin contracts
        run: pnpm test:contracts

      - name: One workbench shell (no standalone pages)
        run: node scripts/run-tests.mjs tests/shell-page-gate.test.ts

      - name: 成果 types have owner previews; writes match Manifests; process items stay out of user lists
        run: node scripts/run-tests.mjs tests/artifact-type-gate.test.ts tests/artifact-declaration-gate.test.ts

      # The Alchemist plugin brings its own vitest suite (studio services and contracts); about a second.
      - name: Alchemist plugin tests
        run: pnpm --filter @molis-ai/molis-work-plugin-alchemist test

  verify:
    name: Verify
    needs: architecture-boundaries
    if: ${{ always() }}
    # Keep this job name while `Verify` is required by main branch protection.
    # The full product suite runs locally; package boundaries and the contract subset run here.
    runs-on: ubuntu-latest
    steps:
      - name: Required package gate passed
        env:
          PACKAGE_BOUNDARIES_RESULT: ${{ needs.architecture-boundaries.result }}
        run: |
          test "$PACKAGE_BOUNDARIES_RESULT" = "success"
          echo "Package boundary, Contract, typecheck, build and action contract verification passed."
