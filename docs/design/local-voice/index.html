<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机语音 · 交互定样</title><link rel="stylesheet" href="../kit/kit.css"><style>
*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:20px;letter-spacing:-.03em;margin:0 0 5px}p{margin:0;color:var(--muted)}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.controls label{display:flex;align-items:center;gap:6px}select,button,a{font:inherit}select{min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:0 8px}.seg{display:flex;gap:3px;background:var(--wash);border-radius:10px;padding:3px}.seg button{min-height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}.seg button[aria-pressed=true]{background:var(--paper);box-shadow:var(--shadow-soft)}main{padding:16px;overflow:auto}iframe{display:block;width:100%;height:calc(100dvh - 210px);min-height:560px;border:1px solid var(--line);border-radius:14px;margin:auto;background:var(--paper)}footer{padding:0 24px 20px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}a{color:var(--ink-soft)}@media(max-width:600px){header{padding:14px}main{padding:6px}footer{padding:8px 14px}iframe{min-height:620px}.controls{gap:6px}.seg button{padding:0 8px}}
</style></head><body>
<header><h1>说完，再发。</h1><p id="explain">A · 框内紧凑栏（已选）。只新增一条录音反馈，草稿仍在原处。</p><div class="controls">
<div class="seg" aria-label="候选方案"><button data-layout="A" aria-pressed="true">A 框内</button><button data-layout="B" aria-pressed="false">B 浮层</button></div>
<label>场景<select id="scenario"><option value="idle">从麦克风开始</option><option value="first">首次准备</option><option value="recording" selected>正在录音</option><option value="transcribing">慢转写 / 编辑与切换</option><option value="failed">转写失败</option><option value="permission">权限被拒绝</option><option value="device">麦克风断开</option><option value="empty">没有听清</option><option value="download-failed">下载失败</option><option value="confirm">草稿改动，确认插入</option><option value="interrupted">中途退出后恢复</option><option value="unavailable">本机组件未就绪</option><option value="limit">接近时长上限</option></select></label>
<label>外观<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>语言<select id="lang"><option value="zh">中文</option><option value="en">English</option></select></label>
<label>宽度<select id="width"><option value="auto">随窗口</option><option>1440</option><option>1024</option><option>390</option></select></label><a id="open" target="_blank" rel="noopener">单独打开</a>
</div></header><main><iframe id="demo" title="语音交互预览"></iframe></main>
<footer><span>交互模拟 · 不录音、不下载、不发送；录音条与波形为组件板新增候选。</span><a href="../../../specs/unified-input-voice/voice-reuse-audit-2026-11-12.md">复用与缺口清单</a></footer>
<script>
let layout='A';const frame=document.querySelector('#demo');
function update(){const q=new URLSearchParams({layout,scenario:document.querySelector('#scenario').value,theme:document.querySelector('#theme').value,lang:document.querySelector('#lang').value});frame.src='demo.html?'+q;document.querySelector('#open').href=frame.src;const w=document.querySelector('#width').value;frame.style.width=w==='auto'?'100%':w+'px';document.querySelector('#explain').textContent=layout==='A'?'A · 框内紧凑栏（已选）。只新增一条录音反馈，草稿仍在原处。':'B · 框上浮层。录音与草稿分开显示，会多一个视觉容器。';document.documentElement.dataset.resolvedTheme=document.querySelector('#theme').value;}
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;document.querySelectorAll('[data-layout]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));update()});document.querySelectorAll('select').forEach(e=>e.onchange=update);update();
</script></body></html>
