界清晰的独立 PR（`REL-3-A` → `REL-3-B`）：  1. `REL-3-A` · 本机脱敏日志轮转、Node／Rust 崩溃捕获重启与透明可预览的本地诊断包（PR 1）：直接复用 `70-1` 平台本机脱敏底座与 Prologue 脱敏审计出口将日志落盘，按大小和天数自动轮转清理；Node 宿主或 Rust 桌面层异常退出时捕获故障摘要并衔接重启恢复；用户导出诊断包到本地前，先在界面上透明展示包含的文件与脱敏内容预览（确认绝无密钥、令牌、隐私路径和聊天／文稿正文后再保存）。 2. `REL-3-B` · 平台包可选注入式 `DiagnosticLogger` 窄口与关键吞错补记（PR 2，结清 `BL-812`）：在 `packages/contracts/src/platform/` 定义默认空操作的极简可选 `DiagnosticLogger` 窄口（只记错误码、子系统与脱敏元数据），仅对真正影响线上排障的高价值静默 `catch` 补接诊断记录，不搞全仓 223 处机械大扫改。","ask":"","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/rel-3.md","items":[{"id":"1","anchor":"rel-3-item-1","t":"`REL-3-A` · 本机脱敏结构化日志轮转、Node／Rust 崩溃恢复与透明预览诊断包导出（PR 1）","d":"按 `C-5A` 核对现有 logger，复用 `70-1` 平台本机脱敏底座与 Prologue 脱敏审计出口补齐结构化日志落盘、按大小与天数自动轮转清理（附密钥／令牌／裸路径／用户正文零残留拒绝测试）；实现 Node 宿主与 Tauri Rust（过 `native-checks.mjs rust`）崩溃捕获、重启恢复衔接、`arm64` 发布符号归档（含 `molis-material` 与 `Computer Helper.app`），以及保存前带透明文件／字段预览的纯本机诊断包导出（全程零网络上传，原 `26-4`）","track":"F","occ":true,"also":["D"],"kind":"实现"},{"id":"2","anchor":"rel-3-item-2","t":"`REL-3-B` · 平台包可选注入 `DiagnosticLogger` 合同与关键静默 `catch` 补记（PR 2，结清 `BL-812`）","d":"在 `packages/contracts/src/platform/` 定义可选注入、默认空操作（不破坏存量调用与单测）的极简 `DiagnosticLogger` 窄口（仅收错误码、模块名与脱敏结构化详情，严禁收用户原文或密钥，更新 `pnpm api:update`），由宿主统一注入 `REL-3-A` 脱敏日志器；按影响排障价值精选平台包关键静默 `catch`／`Promise.catch` 补记诊断（不做无差别 223 处全仓硬改，不改变任何业务返回值与取消语义）","track":"C1","occ":true,"also":["A","B","C2","C3"],"kind":"实现"}],"pre":["25","26","70","111","112"],"soft":[],"cond":["PR 1","PR 2，结清 BL-812","75 不再依赖"],"split":true,"nodes":[{"id":"REL-3.1","items":[0],"hard":["26.9","25.1","70a","112.1","111.1","111.2","111.3"],"partial":[]},{"id":"REL-3.2","items":[1],"hard":["REL-3.1"],"partial":[]}]},{"id":"REL-4","title":"合同过渡 U5 与副本演练 U6","stage":"S","intro":"M1 一旦对外发出，后续发 `1.1`、`1.2` 新版时不能再让老用户存好的流程报错、也不能让数据库升崩卡死启动。本批在 M1 首发前分 2 个互不等待的独立并行 PR（`REL-4-A` ∥ `REL-4-B`）装好两道防升崩护栏：  1. `REL-4-A` · 合同过渡机制 `U5` 与门禁切换（独立并行 PR 1）：紧接第 `90` 批封板的 Clean v1 `version: 1` 干净基线（不为 M1 之前的旧双实例、旧 Alchemist、`jelly-whisper` 写任何历史兼容），建立后续接口升版时的平滑过渡机制——工作流、角色、场景包（`Blueprint`）、`68-B` 保存的智能操作面、Skill 和 MCP 里存着的引用能无损换新版的自动改写，改不了的等用到时原处温和提醒重选；同时把门禁切换为「登记在过渡表内的合同允许升版本」。 2. `REL-4-B` · 秒级库级副本彩排 `U6` 与退回上一版衔接（独立并行 PR 2）：升新版前先在后台拿副本试跑一遍完整数据库升级和校验，全绿才切换新程序，不过就稳留原版；副本彩排只拷贝全分区（含个人空间与 `112-2` 瘦身后 `Jelly` 等）的 SQLite 数据库和带版本清单文件，明确跳过 GB 级不可变原始大附件、可重建总览／搜索索引和语言工具缓存，既秒级跑完又绝不撑爆磁盘，配合 `25-3` 已有的「回到上一版」形成双保险。","ask":"","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/rel-4.md","items":[{"id":"1","anchor":"rel-4-item-1","t":"`REL-4-A` · 基于 Clean v1 起点的合同过渡 `U5` 与门禁切换（独立并行 PR 1）","d":"以 `111`＋`112`＋`90` 封板的 Clean v1 `version: 1` 合同为起点（零旧双轨／旧 Alchemist／Goal 一等字段兼容包袱），实现动作、Manifest（至少兼容上一 `host_api_version`）、MCP 与保存引用（覆盖工作流步骤、Characters 草稿、`77`/`78` `Blueprint` 场景包、`68-B` 保存的智能操作面、Skill）的过渡期双版本适配、无损自动改写与有损用时原处重选提示；将阶段一 `N41`「版本全为 1」门禁切换为「M1 起按过渡登记表与删除条件放行 `>1` 版本」（从原 `26-5` 拆出）","track":"C1","occ":true,"also":["A","E"],"kind":"实现"},{"id":"2","anchor":"rel-4-item-2","t":"`REL-4-B` · 秒级库级副本升级演练 `U6` 与回退衔接（独立并行 PR 2）","d":"新版本切换前经 `listPartitions()` + `partitionRoot()` 对当前 Home 的全分区 SQLite 库（含 `personal-space/`、`libraries/*.db`、`blueprints.db`、`112-2` 瘦身后 4 表 `Jelly` 等）及带版本配置／清单文件生成 checkpoint 快照副本，跑通完整升级段、`integrity_check`／外键／表结构／业务计数校验：显式跳过 `system.artifacts`／`system.shelf` 不可变大附件字节、可重建的 `overview_projections`／搜索索引及 `<Home>/tools/` 语言服务器缓存，防磁盘占满与升级卡死；校验全过才在下次启动切换新程序，失败则留守原版并记录脱敏诊断，无缝衔接 `25-3`「回到上一版」与 Tauri `arm64` 更新准备（过 `native-checks.mjs rust`，原 `26-6`）","track":"F","occ":true,"also":[],"kind":"实现"}],"pre":["25","26","39","44","111"],"soft":[],"cond":["M1 当天生效"],"split":true,"nodes":[{"id":"REL-4.1","items":[0],"hard":["26.5","26.7","39.2","44.1","111.1","111.2","111.3"],"partial":[]},{"id":"REL-4.2","items":[1],"hard":["26.5","25.2","25.3"],"partial":[]}]},{"id":"REL-5","title":"M1 发行与第二台 Mac 验收","stage":"1","intro":"这是第一个真正走出开发机、发给外部用户的正式版本 M1（对齐 `POLICY.md` 首个对外版本 `1.0.0`），排在第 `90` 批非服务端全路线收官、全仓数据库 Clean v1 `version: 1` 一次封板之 tial":[]}]},{"id":"SRV-1","title":"共同设计与对账","stage":"S","intro":"M1（`1.0.0`，REL-5）本机正式版发出之后，开工时间由你拍板，正式启动个人多设备云同步与多人团队实时协作。在真正部署线上服务和写大规模业务代码之前，这一批先用 1 个对账、公共协议设计与三语交互定样先行 PR 把规矩一次定死：  1. 对清主干已有同步家底（`SRV-1-1`）：核对主干已合入的个人同步底座（`#1877` + `#2223` + `#2231` + `#2260`）与 `111` 统一工作分区、`112-2` 瘦身后 4 表 `Jelly`（日历＋极简笔记，零大块命令包与音视频）完全对齐。 2. 定死「按数据类型分层」的多人实时协作与访问协议（`SRV-1-2`）：项目按「查看、编辑、管理」三档共享（严禁共享 `\"personal\"` 个人空间与私人连接凭据）；`Pages` 等富文稿走成熟增量实时协同（支持多人在线光标、选区与 AI 基于所见版本写回，绝不搞「最后保存覆盖全文」），而待办、问题单、数据表行、日历日程等结构化业务表保持清晰的按行／按字段版本化因果同步（保留冲突双版本，绝不把 SQLite 关系表改写成不可直接查询的黑盒二进制团块）。 3. 定清跨版本兼容（`SRV-1-3`）与团队记忆边界（`SRV-1-4`）：遵守 `REL-4-A` 建立的 `U5` 合同过渡规则，新服务必须接受上一版（`1.0.0`）客户端；定清团队记忆只采共享项目内获准来源且经成员确认不可撤回发布，同步产出 `zh`/`en`/`ja` 三语同步／共享／冲突与实时协作定样切片。","ask":"","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/srv-1.md","items":[{"id":"1","anchor":"srv-1-item-1","t":"`SRV-1-1` · 主干个人同步实现与 UPP＋`112` 终态对账","d":"对账 `main` 上已合入的个人同步底座（`#1877` + `#2223` + `#2231` + `#2260` + `44B` + `110`/`111`/`112-2`）：核清纯平台 `SyncSelection`（`owner_kind:\"platform\"`：`system.artifacts`、`system.shelf`、`system.characters`、`horizontal/plugin-studio`）与 20 个平等 UPP 分区插件（含 `112-2` 瘦身后 4 表 `Jelly`） 的同步范围；核实 `partition_plugins` 独立同步种类（V4）、`personSettings` `portable:true`（零密钥／裸路径出站 G5）、`push_lineage`/`push_upstream`/最近 1 版 `push_superseded`（V3）与休眠分区零唤醒拉取（`S-partition-wake-scope`）","track":"G","occ":false,"also":[],"kind":"只读核查"},{"id":"2","anchor":"srv-1-item-2","t":"`SRV-1-2` · 身份、三档访问与「富文稿协同＋关系表版本化」分层协作协议","d":"定成员身份、项目「查看／编辑／管理」三档访问（预留后续按插件／资产细化扩展点，不提前造复杂策略矩阵；严禁共享 `personal` 分区与私人凭据 R17）、在途撤权即时阻断、离线重连与退出项目规则；落定分层并发协议：`Pages` 等富文稿采用增量实时协同层（在线状态、光标／选区、AI 绑定所见版本写回防覆盖），`Todo`／`Dataset`／`Issues`／`Jelly` 等关系表保持按行／字段版本化因果同步与显式冲突保留，绝不破坏本机 SQLite 直接查询与索引能力","track":"G","occ":false,"also":["C1"],"kind":"定样设计"},{"id":"3","anchor":"srv-1-item-3","t":"`SRV-1-3` · 同步合同、Outbox 与 `1.0.0` 跨版本过渡兼容","d":"定同步合同及持久化 Outbox（`BL-070`），严格遵循 `REL-4-A` 的 `U5` 合同过渡与 `U1` 连续升级链（兼容 `1.0.0` 客户端并过 `gold 接入、隐私／配额边界与真实云端字节往返验收（PR 2）","d":"接入首批纯平台集合（`system.artifacts`、`system.shelf`、`system.characters` 等 `owner_kind:\"platform\"`）与核心 UPP 分区插件（覆盖 `\"personal\"` 个人空间与项目分区：`Todo`、`Pages`、`Schedule`、`112-2` 瘦身后 4 表 `Jelly`、可选 `Goals` 等）；验证 `partition_plugins` 启用清单独立同步（V4，`S-sync-enablement-own-choice`）、`personSettings` `portable:true`、确定性 `push_id` 双端离线推送合并（R16）、仅同步最近 1 版 `push_superseded`（V3）、拉取写入休眠分区零唤醒只标 `dirty = 1`（`S-partition-wake-scope`）；焊死不上云禁区与墓碑规则（密钥／令牌／本机目录路径／`60` 外部会话绝不出站 G5，`observation.db` 与 `evaluation.db` 默认纯本机不进云同步，记忆遗忘墓碑同步传播防旧端反向复活）；落地左下账户头像三语同步状态并在真实线上服务完成成果库文件字节往返验收","track":"G","occ":true,"also":["C1","E"],"kind":"实现"}],"pre":["39","44","SRV-1"],"soft":[{"id":"111","k":"p"}],"cond":["接入方式已定","部署与账号","第 3 项另等 111"],"split":false,"nodes":[{"id":"SRV-2","items":[0,1],"hard":["SRV-1","44.2","44.5","39.2"],"partial":["111.3"]}]},{"id":"SRV-3","title":"团队关键路径","stage":"S","intro":"在把多人协作铺开到所有插件之前，本批先挑最难、最核心的一条路径——多人＋AI 同时编辑同一篇 `Pages` 文档——分 2 个严格串行的独立 PR（`SRV-3-A` → `SRV-3-B`）真刀真枪打通并完成双真实账号实战验收：  1. `SRV-3-A` · 平台通用实时协同通道、项目访问拦截与 `Pages` 人机共编实现（PR 1）：把成员在线状态、光标选区、增量协同合并（SRV-1 拍板的富文稿实时增量层）和 AI 基于所见版本写回做成 `packages/contracts`／`plugin-sdk` 的平台通用协同能力，`Pages` 作为第一个声明接入的插件（绝不在宿主写死 `Pages` 私有后门）；严守「只共享获准项目、永不外泄 `\"personal\"` 个人空间与私人设置」，中途撤权当场掐断在途写入与广播；共享项目里跑 AI 严格只用发起人自己的模型与授权，历史与画面标明「AI（某人发起）」，队友看得到进展但绝不能盗用发起人模型密钥或远程控制其本机会话。 2. `SRV-3-B` · 两个真实独立账号双端联调、断网撤权压测与未覆盖对象清账（PR 2）：用两个真实独立线上身份跑完 `Pages` 多人同改、人机交错修改、中途广播撤权、断网重连与应用重启收敛，如实列清尚未接入实时协同的其余插件对象（交接给 `SRV-4`／`SRV-6`）。","ask":"在 `SRV-3-A` 看共同编辑、权限变化与恢复定样；在 `SRV-3-B` 提供两个真实测试账号环境。","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/srv-3.md","items":[{"id":"1","anchor":"srv-3-item-1","t":"`SRV-3-A` · 平台通用实时协同合同、项目三档拦截、在途撤权与 `Pages` 人机共编实现（PR 1）","d":"按 `SRV-1-2` 在 `packages/contracts`、`packages/plugin-sdk` 与同步／访问服务实现通用实时协同能力（在线参与者、光标／选区、增量合并、局部撤销只撤本人修改、无法自动合并时保留双方与来源），`Pages` 经公开声明首个接入（零宿主按插件名特判）；落实真实成员身份核验、未共享项目与 `\"personal\"` 分区硬拒绝（附安全拒绝测试）、在途撤权即时阻断回写与广播、短暂断网与重启持久恢复；焊死共享项目 AI 归属边界（AI 任务仅消费发起人自有模型与获准权限、按所见文档版本提交防覆盖新输入、历史与活卡明确标注「AI（发起人）」，严禁成员借共享项目盗用他人密钥或接管他人本机会话）；库与合同变更走 `1.0.0` 升级／过渡规则并过 `golden-homes/1.0.0` 回放","track":"G","occ":true,"also":["C","D","E"],"kind":"实现"},{"id":"2","anchor":"srv-3-item-2","t":"`SRV-3-B` · 双真实独立身份端到端协作验证与未覆盖对象清账（PR 2）","d":"使用两个真实独立线上账号与双客户端环境，端到端实测验证 `Pages` 多人同时输入合并、人与 AI 交错修改、实时广播撤权、断网重连与应用重启后两边持久结果完全一致，并逐一列清首版尚未接入实时共编的其余插件对象缺口清单移交 `SRV-4`／`SRV-6`","track":"C","occ":false,"also":["D","E","G"],"kind":"验收运维"}],"pre":["111","SRV-1","SRV-2"],"soft":[],"cond":["真实身份／客户端"],"split":false,"nodes":[{"id":"SRV-3","items":[0,1],"hard":["SRV-1","SRV-2","111.1","111.2","111.3"],"partial":[]}]},{"id":"SRV-4","title":"团队剩余交互与团队记忆设计定稿","stage":"S","intro":"SRV-3 用 `Pages` 双真账号把多人实时协同的关键硬骨头验证通了之后，这一批用 1 个完整设计、合同定稿与三语定样先行 PR 把后面 SRV-6（团队完整产品）和 SRV-7（团队记忆）要用的全部规则与界面一次锁死：  1. 其余 19 个平等分区插件的团队协作交互定稿（`SRV-4-1`）：对照 `SRV-3-B` 列出的未覆盖对象台账，按 `SRV-1-2` 分层规则把待办、数据表、`PPT`、`112-2` 瘦身后 4 表 `Jelly`（日历＋极简笔记）、项目讨论 IM 等全部剩余内容在共享项目里的权限表现、并发修改提示、共享前提示（「项目 AI 会用到你的个人全局技能」，V13）与恢复交互一次设计齐备。 2. 团队记忆形成、融合与优先级规则定稿（`SRV-4-2`）：严守「云端零大模型密钥 ＋ 分歧如实保留 ＋ 按影响对象定优先级」——云服务器只管权限隔离存储与同步（绝不在云端索取或保存成员的大模型 API 密钥），提炼与融合候选在获准成员／管理员本机有新证据时按预算触发（不照搬个人自动静默合并），多人说法冲突时并列保留分歧和条件交管理员裁定（绝不让 AI 伪造共识）；用的时候你当轮明确指令最优先，改共享项目公共产出物时「团队约定 ＞ 个人习惯」，只面向你本人汇报展示时照用个人偏好，且动态召回统一注入 `63A` 的 Zone 4 动态区不打碎缓存前缀。","ask":"","url":"https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/batches/srv-4.md","items":[{"id":"1","anchor":"srv-4-item-1","t":"`SRV-4-1` · 其余 19 个平等分区插件团队协作覆盖与三语交互定稿","d":"在 `SRV-1` 分层协议与 `SRV-3` 双真账号验证基础上，逐一收拢其余 19 个平等 UPP 分区插件（含 `112-2` 瘦身后 4 表 `Jelly`、`Todo`、`Dataset`、`Issues`、`PPT`、`Forms`、可选 `Goals` 等）及项目讨论 IM 的三档权限映射、按行／字段并发冲突呈现、在途撤权降级与共享确认提示（明示「项目 AI 会用到你的个人技能」V13，且绝不泄露 `\"personal\"` 空间与个人推送账本 R9/R17）及三语定样","track":"G","occ":false,"also":["C"],"kind":"定样设计"},{"id":"2","anchor":"srv-4-item-2","t":"`SRV-4-2` · 团队记忆本机有界提炼、分歧保留、优先级规则与三语交互定稿","d":"定稿并产出高保真定样：① 云端零模型密钥＋本机有界提炼：云端只存按项目权限隔离的贡献与团队认知，提炼／融合在获准成员或管理员本机按新证据 己那一行：「认领」写会话与设备（如「Claude（本机）」「Codex（本机）」），「状态」改成「已认领」，「更新」写日期；同时在本 issue 下留一条评论「认领 NN-项名」，评论是时间线，正文和评论对不上时以最新评论为准。\n2. **改正文前先重新读最新正文，只改自己那一行。** 命令行：`gh issue view 1743 --json body -q .body > board.md`，改完 `gh issue edit 1743 --body-file board.md`；中间不要放太久，避免盖掉别人刚改的行。\n3. **状态往前走就改。** 状态只用这几个：待认领、已认领、定样中（等用户看样）、实施中、待评审（PR 已开）、已合入、暂停（写原因）、放弃（写原因，改回待认领也可以）。「分支／PR」写分支名，开了 PR 换成 PR 号。\n4. **合入后**：状态改「已合入」，并照[维护规则](https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/maintenance.md#section-9)在批次文件里补日期、PR 和剩余项；只合了一部分的，写清剩下什么，状态保持「实施中」。\n5. **超过 3 天没更新**：别的会话可以在评论里点名问；没有回音、用户也同意，才改认领。不替别人改状态。\n6. 只认领前置已就绪、或批次文件写明可并行的部分；认领不等于前置满足。用户拍板、真实 Home、发版这些红线照旧按路线书与需求开发流程。\n\n批次顺序、交付内容以执行目录为准；这里的行由执行目录生成，目录增删交付行时同步改本板。\n\n\n## 统筹与轨道写手\n\n历史统筹（11-05 早期）：Claude（本机）会话「统筹｜收尾合并 43 个 PR、依赖核对与 #1743」（11-05 接手；用户 11-05 要求把开着的 PR 合完，取代 11-04 晚「不用合」）。统筹排单、审开工前检查、定落地顺序、跑全量、合并，并改跨批文件（执行目录、决策记录、轨道表、本板、全景图依赖）；各批文件由做那批的会话在自己的 PR 里改。合并一律由统筹的脚本按依赖入队，各会话只推新头、在 PR 上留言。 **该跨批统筹与统一入队安排已由下方 11-05 晚决定取代，不再作为当前派单规则。**\n\n> **11-05 晚起（用户定）**：本统筹会话只管第 13、18 批，即 #1845、#1841 收尾、两批的裁定和本板这两行，做完即止。其他批次的评审、裁定、合入不再由它统筹，由各批主会话按 Goal Prompt 第十节自己安排，要统筹的事找用户。\n\n> 11-05 起按[决定 26](https://github.com/molis-ai/molis-work/blob/main/specs/post-anticorruption-roadmap/reference/decisions.md#decision-26)（#1833 已合）：每批由自己的主会话独立安排会话、写手（子代理）和模型，规矩写在各批 Goal Prompt 第十节。下表的「轨道写手」只表示谁在守那条轨道独占的文件，不再是跨批的会话；02 批已按其认领行交接给 Claude（11-06 用户指定）。\n\n| 轨道 | 写手 | 现在在做 |\n| --- | --- | --- |\n| A 助理与输入 | 原 A 轨会话；当前由 10、11 批主会话按各自认领行负责 | #1761、#1780、#1791、#1803、#1812、#1848、#1850、#1851、#1880 已合入；10 按用户要求暂停，K0c #1872 未合；11 的产品接入未完成。当前执行归各批主会话。 |\n| B Coding | Claude（本机）「B轨·Coding」会话（11-04 起） | #1782、#1783、#1799、#1819、#1814 已合入；12、33、35 的其余实现仍保留原前置，设计与核账不算整批完成。 |\n| C 合同与 SDK、AI 运行时、平台新服务 | Claude（本机）「合同台」会话，合同文件联系人；具体写手按各批认领行 | #1771、#1794、#1805、#1806、#1807、#1747、#1816、#1866、#1868 已合入；05 C-1 #1894、N22-06 #1893、22 C-1～C-3 #1876/#1888/#1889、13④c #1885 仍在途。按独占文件及快照协调，不再整条 C 轨互锁。 |\n| D 外观与工作台 | Claude（本机）「D 轨·Opus」   pop.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';pop.style.top=top+'px';pop.scrollTop=0;pop.classList.add('on');

function itemBody(i,free){
  const out=[];
  if(i.d)out.push(el('p','ib-d',i.d));
  if(i.note){const n=el('div','ib-n');n.append(el('b',null,'当前进展'),el('span',null,i.note));out.push(n)}
  const f=el('div','ib-f'),pill=t=>f.append(el('span','pill',t));
  if(i.track)pill(TRACK_NAMES[i.track]?`${i.track} ${TRACK_NAMES[i.track]}`:trackText(i));
  if(free&&TRACK_NAMES[i.track])pill(freeWord(i));
  const wn=whoNote(i);if(wn)pill(wn);
  (i.prs||[]).forEach(p=>{const l=el('a','pill','#'+p);l.href=REPO+'/pull/'+p;l.target='_blank';l.rel='noopener';f.append(l)});
  if(i.branch&&!(i.prs&&i.prs.length))f.append(el('code','pill',i.branch));
  if(i.date)pill('更新 '+i.date);
  if(f.childElementCount)out.push(f);
  if(i.also&&i.also.length){const a=el('div','ib-a');a.append('还要配合');i.also.forEach(k=>a.append(el('span','pill',`${k} ${TRACK_NAMES[k]||''}`.trim())));out.push(a)}
  return out;
}
function itemPop(b,i,tone,free){
  const h=el('div',`pop-h ${free&&/doing|pause/.test(tone)?'free':tone}`),s=el('div','pop-s');
  s.append(statusLine(b,i,tone,free));if(i.who&&i.who!=='—')s.append(el('span','pop-who',claimTag(i)));
  h.append(el('b','pop-t',i.t),s);
  const out=[h];
  if(i.note||i.d){const c=el('div','pop-b');
    if(i.note)c.append(el('div','pop-l','当前进展'),el('div','pop-n',i.note));
    if(i.d)c.append(el('div',i.note?'pop-d':'pop-d solo',i.d));
    out.push(c)}
  const f=el('div','pop-f'),top=el('div'),side=el('span');
  (i.prs||[]).forEach((p,n)=>{const l=el('a',null,'#'+p);l.href=REPO+'/pull/'+p;l.target='_blank';l.rel='noopener';side.append(n?' ':'',l)});
  if(i.date)side.append(side.childNodes.length?' · ':'',i.date);
  top.append(el('span',null,i.track?(TRACK_NAMES[i.track]?`${i.track} ${TRACK_NAMES[i.track]}`:trackText(i)):''),side);f.append(top);
  const more=[];if(free&&TRACK_NAMES[i.track]&&tone!=='done')more.push(freeWord(i));if(i.also&&i.also.length)more.push(`还要 ${i.also.join('、')} 配合`);
  if(more.length)f.append(el('div',null,more.join(' · ')));
  out.push(f);
  return out;
}

let boardBody=D.board,boardRead=0;
// 未带令牌的接口按出口 IP 限额，代理的出口常被别人用完；隔几秒再试，常能换到另一个出口
const getJson=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error(String(r.status));return r.json()};
async function readBoard(attempt=0){
  boardRead=Date.now();
  // Action 写的静态文件不受接口限额影响，但有几分钟缓存；接口更新，读得到就用更新的那份
  const got=(await Promise.allSettled([getJson(BOARD_RAW,{cache:'no-cache'}),getJson(BOARD_API,{headers:{Accept:'application/vnd.github+json'}})])).filter(r=>r.status==='fulfilled').map(r=>r.value);
  if(!got.length){
    if(attempt<2){setTimeout(()=>readBoard(attempt+1),attempt?8000:3000);return}
    boardFailed=true;renderSource();return;
  }
  boardFailed=false;
  const j=got.reduce((a,x)=>x.updated_at>a.updated_at?x:a);
  const who=got.find(x=>x.claimers);
  const claimers=who&&claimersByAnchor(who.body,who.claimers);
  const whoChanged=claimers&&JSON.stringify(claimers)!==JSON.stringify(itemClaimers);
  if(whoChanged)itemClaimers=claimers;
  const fresh=j.updated_at>=boardAt&&j.body!==boardBody;
  if(j.updated_at>=boardAt)boardAt=j.updated_at;
  if(fresh)boardBody=j.body;
  if(fresh||whoChanged){applyBoard(boardBody);repaint()}
  try{localStorage.setItem(BOARD_KEY,JSON.stringify({body:boardBody,at:boardAt,claimers:itemClaimers}))}catch(e){}
  renderSource();
}
