[package]
name = "molis-work-sync"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.6", features = ["d1"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
