<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Molis Work · Goal 画布</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!--
    THESIS: The Goal canvas stays today’s dotted relation map; one extra card button opens that Goal’s Frame. Refuses chat-on-card, replacing maximize, or a generic Frame-as-home.
    OWN-WORLD: Calm Desktop — 264px graphite directory, 32px titlebars, 258×190 paper nodes, ink #272932, violet #6262d6, hairline not drop-shadow, tabs as type-weight plus a 2px marker.
    STORY: Open a project onto 目标关系. Maximize still opens the Goal workspace. The new top-right control opens that Goal’s Frame for sessions and artifacts.
    FIRST VIEWPORT: Left Goals directory, pinned「Goal 画布」tab, three compact Goal nodes with dependency arrows, 写周报 selected, original maximize plus a Frame icon at the card’s top right.
    FORM: Incumbent Calm Desktop; specified Operate slice. No concept-seed.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4Z"/><path d="M10 20v-7h4v7"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
    <symbol id="i-feed" viewBox="0 0 24 24"><path d="M5 4h14v16H5Z"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 5-7 7 7 7M5 12h15"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m-7 7 7-7 7 7"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 9h16l-1.5 11H5.5Z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/></symbol>
    <symbol id="i-frame" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M10 9v11"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-ready" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M5 5h14v11H8l-3 3Z"/></symbol>
  </svg>

  <div class="drawer-scrim" id="drawer-scrim" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="应用目录">
    <div class="native-row">
      <button class="icon-btn" id="toggle-sidebar" type="button" aria-label="收起目录"><svg><use href="#i-panel"/></svg></button>
    </div>
    <div class="project-head">
      <button class="project-trigger" id="project-trigger" type="button" aria-expanded="false" aria-haspopup="listbox">
        <span class="emblem" id="project-emblem">G</span>
        <strong id="project-name">GoalBoard</strong>
        <svg><use href="#i-down"/></svg>
      </button>
      <button class="icon-btn" type="button" disabled aria-label="通知，暂不可用"><svg><use href="#i-bell"/></svg></button>
      <button class="icon-btn" type="button" disabled aria-label="项目设置"><svg><use href="#i-settings"/></svg></button>
    </div>
    <div class="project-menu" id="project-menu" hidden role="listbox" aria-label="切换项目"></div>

    <header class="dir-heading" id="dir-heading" hidden>
      <button class="dir-back" id="dir-back" type="button"><svg><use href="#i-back"/></svg><span data-copy="dirBack">项目目录</span></button>
      <nav class="plugin-strip" id="plugin-strip" aria-label="当前项目的插件"></nav>
    </header>

    <div class="sidebar-scroll">
      <nav class="root-dir" id="root-dir" aria-label="工作台目录"></nav>
      <section class="item-dir" id="item-dir" hidden>
        <div class="dir-search">
          <input id="item-search" type="search" placeholder="搜索…" aria-label="搜索">
        </div>
        <div id="item-list"></div>
      </section>
    </div>
    <footer class="account">
      <span class="avatar">骏</span>
      <span><strong>一骏</strong><small data-copy="localSpace">本机空间</small></span>
      <button class="icon-btn" type="button" disabled aria-label="全局设置"><svg><use href="#i-settings"/></svg></button>
    </footer>
  </aside>

  <div class="stage">
    <header class="titlebar">
      <button class="icon-btn reveal-dir" id="reveal-dir" type="button" hidden aria-label="打开目录"><svg><use href="#i-panel"/></svg></button>
      <div class="tabstrip" id="tabstrip" aria-label="工作台标签"></div>
      <div class="titlebar-actions">
        <button class="text-btn" id="btn-locale" type="button">EN</button>
        <button class="icon-btn" id="btn-theme" type="button" aria-label="切换外观"><svg><use href="#i-sun"/></svg></button>
      </div>
    </header>
    <div class="container" id="container"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
