name: Linux failures (temporary)

# Temporary, removed before merge: reruns only the files the first sharded full suite failed on Linux (run 38710770498).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-failures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerun:
    name: Linux failures (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      MOLIS_WORK_TEST_JOBS: 3
      MOLIS_WORK_TEST_BROWSER_JOBS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Chrome for the browser files
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "no Chrome on this runner"; exit 1; }
          "$chrome" --version
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "MOLIS_WORK_TEST_CHROME=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"
      - name: CJK font for the browser files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          echo "CJK fonts:"; fc-list :lang=zh family | sort -u | head -20; echo "default sans-serif:"; fc-match sans-serif
      - name: Run the failed files
        shell: bash
        run: |
          node scripts/run-tests.mjs --shard ${{ matrix.shard }}/2 --timeout-seconds 900 \
            tests/agent-action-selection.e2e.test.ts tests/feed-capture.e2e.test.ts tests/artifact-clipboard.e2e.test.ts \
            tests/project-settings-standalone.e2e.test.ts tests/goals-document.e2e.test.ts tests/ui-audit-browser.e2e.test.ts \
            tests/product-interaction.e2e.test.ts tests/web.test.ts
