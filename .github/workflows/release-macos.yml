name: Release macOS Desktop

on:
  # Temporarily manual-only. Restore the `push.tags` trigger to resume automatic releases.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The version is the root package.json "packageManager" (pnpm@x.y.z), so local, CI and release use one pin.
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag is v<package version>, and every place that carries the version agrees (docs/releases/POLICY.md).
      - name: Verify tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-release-versions.mjs --tag "$GITHUB_REF_NAME"

      - name: Read macOS release configuration
        id: profile
        shell: bash
        run: |
          profile=dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then profile=release; fi
          node tooling/release/profile.mjs --profile "$profile" --ci-outputs >> "$GITHUB_OUTPUT"

      - name: Check the configured macOS credential references
        id: signing
        shell: bash
        env:
          HAS_APPLE_RELEASE_CREDENTIALS: ${{ secrets[steps.profile.outputs.certificate] != '' && secrets[steps.profile.outputs.certificatePassword] != '' && secrets[steps.profile.outputs.signingIdentity] != '' && secrets[steps.profile.outputs.appleId] != '' && secrets[steps.profile.outputs.notaryPassword] != '' && secrets[steps.profile.outputs.teamId] != '' && (steps.profile.outputs.profile != 'release' || steps.profile.outputs.notarization == 'apple-id') }}
        run: |
          printf 'configured=%s\n' "$HAS_APPLE_RELEASE_CREDENTIALS" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$HAS_APPLE_RELEASE_CREDENTIALS" != "true" ]]; then
            echo "A public macOS release requires Developer ID signing and Apple notarization credentials." >&2
            echo "See the macOS Secret references in tooling/release/profile.mjs --profile release --ci-outputs." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.configured == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets[steps.profile.outputs.certificate] }}
          p12-password: ${{ secrets[steps.profile.outputs.certificatePassword] }}

      - name: Build macOS DMG
        shell: bash
        env:
          MOLIS_WORK_RELEASE_PROFILE: ${{ steps.profile.outputs.profile }}
          PUBLISHER_KEY_REF: ${{ steps.profile.outputs.publisherKey }}
          BUNDLED_PUBLISHER_KEY: ${{ secrets[steps.profile.outputs.publisherKey] }}
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.configured == 'true' && secrets[steps.profile.outputs.signingIdentity] || '' }}
          APPLE_ID: ${{ steps.signing.outputs.configured == 'true' && secrets[steps.profile.outputs.appleId] || '' }}
          APPLE_PASSWORD: ${{ steps.signing.outputs.configured == 'true' && secrets[steps.profile.outputs.notaryPassword] || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.configured == 'true' && secrets[steps.profile.outputs.teamId] || '' }}
        run: |
          if [[ -z "$BUNDLED_PUBLISHER_KEY" ]]; then
            echo "The configured ${MOLIS_WORK_RELEASE_PROFILE} publisher key Secret (${PUBLISHER_KEY_REF:-unconfigured}) is required to sign the bundled packages." >&2
            exit 1
          fi
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/molis-publisher.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$BUNDLED_PUBLISHER_KEY" > "$key_file"
          unset BUNDLED_PUBLISHER_KEY
          export "$PUBLISHER_KEY_REF=$key_file"
          pnpm desktop:build:macos

      - uses: actions/upload-artifact@v4
        with:
          name: molis-work-macos-${{ matrix.arch }}
          path: release/macos/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: molis-work-macos-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
