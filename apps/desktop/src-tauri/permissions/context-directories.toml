[[permission]]
identifier = "allow-context-directories"
description = "Let the local main onboarding page manage explicitly selected directory bookmarks, preview metadata, and send selected files to the Host's onboarding staging."
commands.allow = [
  "context_directory_status",
  "context_directory_authorize",
  "context_directory_forget",
  "context_directory_preview",
  "context_directory_stage",
]
