<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语音交互预览</title><link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script><script src="components.js"></script><link rel="stylesheet" href="preview.css"></head><body>
