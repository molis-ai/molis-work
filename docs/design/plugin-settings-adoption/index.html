<!doctype html>
<html lang="zh-CN" data-theme="light" data-resolved-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>插件配置采用 · Molis Work</title>
  <link rel="stylesheet" href="../kit/kit.css">
  <link rel="stylesheet" href="layout.css">
  <script defer src="../kit/kit.js"></script>
  <script defer src="preview.js"></script>
</head>
<body>
  <div id="icons" hidden></div>
  <nav id="controls" aria-label="定样"></nav>
  <main class="sheet">
    <div class="stage"><div class="inside">
      <div id="context"></div>

    </div></div>
