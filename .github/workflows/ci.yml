name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-boundaries:
    name: Package boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package contracts and boundaries
        run: pnpm workspace:verify

      - name: Typecheck product launchers and compatibility SDK
        run: |
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm exec tsc --noEmit -p tsconfig.sdk.json

  verify:
    name: Verify
    needs: architecture-boundaries
    if: ${{ always() }}
    # Keep this job name while `Verify` is required by main branch protection.
    # The full legacy product suite remains paused; package boundaries are active.
    runs-on: ubuntu-latest
    steps:
      - name: Required package gate passed
        env:
          PACKAGE_BOUNDARIES_RESULT: ${{ needs.architecture-boundaries.result }}
        run: |
          test "$PACKAGE_BOUNDARIES_RESULT" = "success"
          echo "Package boundary, Contract, typecheck, and build verification passed."
