<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>事项线第一片定样 · Molis Work 原型</title>
  <link rel="stylesheet" href="../kit/kit.css?v=2">
  <link rel="stylesheet" href="../workbench-shared-paths/styles.css?v=7">
  <link rel="stylesheet" href="../intelligent-surfaces-forms/forms.css?v=7">
  <link rel="stylesheet" href="line.css?v=1">
</head>
<body>
  <div id="icons" hidden></div>
  <div class="proto" role="region" aria-label="原型控制（不是产品界面）">
    <b data-t="protoTitle"></b>
    <label><span data-t="scheme"></span>
      <span class="mw-toggle-group" data-slot="toggle-group" data-seg-thumb role="group" id="scheme"><button type="button" data-scheme="A">A</button><button type="button" data-scheme="B">B</button><button type="button" data-scheme="C">C</button></span>
    </label>
    <label><span data-t="step"></span>
      <button type="button" class="mw-btn mw-btn--secondary mw-btn--sm" data-slot="button" id="prev" data-t="prev"></button><span id="stepcap" style="min-width:190px"></span><button type="button" class="mw-btn mw-btn--primary mw-btn--sm" data-slot="button" id="next" data-t="next"></button>
    </label>
    <label><span data-t="fault"></span><select id="fault"></select></label>
    <label><span data-t="lang"></span>
      <span class="mw-toggle-group" data-slot="toggle-group" data-seg-thumb role="group" id="lang"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></span>
    </label>
    <label><span data-t="theme"></span>
      <span class="mw-toggle-group" data-slot="toggle-group" data-seg-thumb role="group" id="theme"><button type="button" data-theme-set="light" data-t="light"></button><button type="button" data-theme-set="dark" data-t="dark"></button></span>
    </label>
    <button type="button" class="mw-btn mw-btn--secondary mw-btn--sm" data-slot="button" id="reset" data-t="reset"></button>
  </div>
  <main class="wl" id="app"></main>
  <script src="../kit/kit.js?v=1"></script>
  <script src="../workbench-shared-paths/kit-bridge.js?v=2"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
