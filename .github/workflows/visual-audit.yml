name: Visual audit

# Full-screen multi-width / multi-surface VUX crawl tests (13 files from scripts/run-tests/strata.mjs).
# Separated from PR `full-suite.yml` runs so backend/non-UI PRs do not spend ~1.35 CPU-hr crawling every layout;
# triggered automatically on UI/design/workbench/plugin-browser PRs, nightly on main, and manually on demand.

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/design-system/**"
      - "packages/ui-host/**"
      - "packages/plugin-sdk/src/ui.ts"
      - "packages/plugin-sdk/src/ui/**"
      - "packages/plugin-sdk/src/browser.ts"
      - "packages/plugin-sdk/src/browser/**"
      - "packages/plugin-sdk/src/diff-view.ts"
      - "packages/plugin-sdk/src/highlight.ts"
      - "apps/workbench/**"
      - "plugins/**/src/browser/**"
      - "plugins/**/src/styles/**"
      - "plugins/**/src/styles.ts"
      - "plugins/**/src/**/*-styles.ts"
      - "plugins/**/tooling/minify-styles.mjs"
      - "plugins/**/src/ui*.ts"
      - "plugins/**/src/**/*-ui.ts"
      - "plugins/**/src/**/*-ui-model.ts"
      - "plugins/**/src/**/ui.ts"
      - "plugins/**/src/**/*-client.ts"
      - "plugins/**/src/**/client*.ts"
      - "plugins/**/src/**/*-html.ts"
      - "plugins/**/src/**/*-view.ts"
      - "plugins/**/src/page/**"
      - "plugins/native/goals/src/workbench-clients.ts"
      - "plugins/native/goals/src/momentum-layout.ts"
      - "plugins/native/pages/src/editor-*.ts"
      - "plugins/native/pages/src/tone.ts"
      - "horizontal/plugin-studio/src/workbench.ts"
      - "horizontal/plugin-studio/src/agent-studio.ts"
      - "plugins/native/shelf/src/glyphs.ts"
      - "plugins/native/ppt/src/colors.ts"
      - "plugins/native/form/src/fillpage.ts"
      - "plugins/**/locales/**"
      - "tests/fixtures/chinese-walk.ts"
      - "tests/fixtures/chinese-layers.ts"
      - "tests/fixtures/layout-audit.ts"
      - "tests/fixtures/layer-walk.ts"
      - "tests/fixtures/order-audit.ts"
      - "tests/fixtures/truncation-audit.ts"
      - "tests/fixtures/visual-order-details.ts"
      - "tests/chinese-layers.e2e.test.ts"
      - "tests/chinese-layers-*.e2e.test.ts"
      - "tests/chinese-walkthrough.e2e.test.ts"
      - "tests/dialog-submit-rules.e2e.test.ts"
      - "tests/english-walkthrough.e2e.test.ts"
      - "tests/geometry-boundaries.e2e.test.ts"
      - "tests/load-geometry.e2e.test.ts"
      - "tests/narrow-surfaces.e2e.test.ts"
      - "tests/remaining-forms-viewport.e2e.test.ts"
      - "tests/repeat-no-accumulation.e2e.test.ts"
      - "tests/fixtures/touch-targets.ts"
      - "tests/touch-targets.e2e.test.ts"
      - "tests/touch-targets-*.e2e.test.ts"
      - "tests/truncation-tip.e2e.test.ts"
      - "tests/visual-order-details.e2e.test.ts"
      - "tests/visual-order-details-*.e2e.test.ts"
      - "tests/visual-order.e2e.test.ts"
      - "scripts/run-tests/strata.mjs"
      - ".github/workflows/visual-audit.yml"
      - ".github/actions/setup-work/**"
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: visual-audit-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      dist-artifact: ${{ steps.pack.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      - name: Build
        run: pnpm build

      - name: Pack build outputs
        id: pack
        shell: bash
        run: |
          {
            find . \( -name node_modules -o -name .git \) -prune -o -name dist -type d -prune -print
            for d in apps/local-host/native/materials/bin apps/local-host/native/computer/bin; do
              if [ -d "$d" ]; then printf './%s\n' "$d"; fi
            done
          } | sort -u | tar -cf - -T - | gzip -1 > "$RUNNER_TEMP/dist.tar.gz"
          printf 'artifact-name=visual-audit-dist-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact-name }}
          path: ${{ runner.temp }}/dist.tar.gz
          retention-days: 1
          compression-level: 0

  audit:
    name: Visual audit (${{ matrix.shard }}/4)
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    env:
      MOLIS_WORK_TEST_JOBS: 1
      MOLIS_WORK_TEST_BROWSER_JOBS: 1
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: ${{ runner.temp }}/dist

      - name: Unpack build outputs
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/dist/dist.tar.gz"

      - name: Chrome for visual audit
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "no Chrome on this runner"; exit 1; }
          "$chrome" --version
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "MOLIS_WORK_TEST_CHROME=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"
          echo "MOLIS_WORK_BROWSER_PATH=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"

      - name: CJK font for visual audit
        run: |
          if ! sudo apt-get update -qq || ! sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei; then
            . /etc/os-release
            font_apt="$(mktemp -d /tmp/molis-font-apt.XXXXXX)"
            mkdir -p "$font_apt/lists/partial"
            chmod 755 "$font_apt" "$font_apt/lists" "$font_apt/lists/partial"
            sudo chown _apt:root "$font_apt/lists/partial"
            printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu %s universe\n' \
              "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security" > "$font_apt/sources.list"
            font_options=(-o "Dir::Etc::sourcelist=$font_apt/sources.list" -o "Dir::Etc::sourceparts=-"
              -o "Dir::State::lists=$font_apt/lists" -o Acquire::Retries=2 -o Acquire::ForceIPv4=true)
            sudo apt-get "${font_options[@]}" update -qq
            sudo apt-get "${font_options[@]}" install -y -qq --no-install-recommends fonts-wqy-zenhei
          fi
          fc-list :lang=zh family | sort -u

      - name: Run visual audit shard
        shell: bash
        run: |
          mapfile -t files < <(node -e 'import("./scripts/run-tests/strata.mjs").then(m => console.log(m.VISUAL_AUDIT_TESTS.join("\n")))')
          node scripts/run-tests.mjs --shard ${{ matrix.shard }}/4 --timeout-seconds 1800 --retries 1 "${files[@]}"

  visual-capture:
    name: Visual capture settlement
    needs: [build]
    if: ${{ needs.build.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOLIS_WORK_TEST_JOBS: 1
      MOLIS_WORK_TEST_BROWSER_JOBS: 1
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: ${{ runner.temp }}/dist

      - name: Unpack build outputs
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/dist/dist.tar.gz"

      - name: Chrome for visual audit
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "no Chrome on this runner"; exit 1; }
          "$chrome" --version
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "MOLIS_WORK_TEST_CHROME=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"
          echo "MOLIS_WORK_BROWSER_PATH=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"

      - name: CJK font for visual audit
        run: |
          if ! sudo apt-get update -qq || ! sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei; then
            . /etc/os-release
            font_apt="$(mktemp -d /tmp/molis-font-apt.XXXXXX)"
            mkdir -p "$font_apt/lists/partial"
            chmod 755 "$font_apt" "$font_apt/lists" "$font_apt/lists/partial"
            sudo chown _apt:root "$font_apt/lists/partial"
            printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu %s universe\n' \
              "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security" > "$font_apt/sources.list"
            font_options=(-o "Dir::Etc::sourcelist=$font_apt/sources.list" -o "Dir::Etc::sourceparts=-"
              -o "Dir::State::lists=$font_apt/lists" -o Acquire::Retries=2 -o Acquire::ForceIPv4=true)
            sudo apt-get "${font_options[@]}" update -qq
            sudo apt-get "${font_options[@]}" install -y -qq --no-install-recommends fonts-wqy-zenhei
          fi
          fc-list :lang=zh family | sort -u

      - name: Run visual-capture settlement check (nightly / manual)
        shell: bash
        env:
          MOLIS_WORK_VISUAL_OUT: ${{ runner.temp }}/visual-capture
        run: node scripts/run-tests.mjs --shard 1/1 --timeout-seconds 1200 --retries 1 tests/fixtures/visual-capture.mts
