name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # The merge queue of main (docs/system/PARALLEL-DEVELOPMENT.md §3): GitHub builds each queued pull request on top of main and the
  # pull requests ahead of it, and merges it when `Verify` passes on that commit. A pull request no longer has to be brought up to date
  # with main by hand before it merges.
  merge_group:
  workflow_dispatch:
  # Nightly on main to run the full CI gate matrix and refresh main-branch caches.
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

# The nightly run has its own group, so a merge to main at night does not cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Did the merge queue already verify this commit? (T-129, scripts/ci-queue-verified.mjs) Only on a push to main: a pull request
  # reaches main through the merge queue, which runs this workflow on the merge group's commit and, when `Verify` passes, moves main to
  # that very commit. So the push is the same commit, tree and ci.yml, and the blocking jobs would repeat the queue's run. When the
  # GitHub API shows a successful `merge_group` run of this workflow on this SHA with a successful `Verify` that compared with this
  # push's `before` (the step `Merge queue base <sha>` of `verify`: the health gates and the secret scan compare with a base, and a
  # group built on another one has another base), `verified` is true. Only then, and only when this job succeeded, the blocking jobs
  # are skipped and `verify` passes with a link to that run. Anything else (a direct push, a queue run that failed, another base, an
  # API that cannot be read, this job failing whatever it wrote) runs everything as before. `security-invariants` and `product-subset`
  # block too (decision #14, 2026-10-31) and are skipped the same way. To roll back: `if: false` here is enough,
  # since a skipped job is not a success; removing the job means removing it from every `needs`, the conditions and `verify` too.
  queue-check:
    name: Verified in the merge queue
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
      run_url: ${{ steps.check.outputs.run_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0

      # Node built-ins only, no install.
      - name: Find this commit's merge queue run
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-queue-verified.mjs

  # The blocking checks run side by side and feed `verify`. Batch 100-2 consolidated the four fragmented gate jobs
  # (`gates`, `health-gate-rules`, `architecture-boundaries`, `action-contracts`) into one `gates` job so one runner
  # installs dependencies and unpacks `dist.tar.gz` once instead of across six runners. On documentation-only PRs and
  # merge groups, `build` is skipped and `gates` runs only the non-build checks (health gates, release versions, spec
  # coverage). Each `node scripts/run-tests.mjs` with several files runs them a few at a time, each file with its own
  # MOLIS_WORK_HOME (scripts/run-tests/pool.mjs, docs/system/PARALLEL-DEVELOPMENT.md §5).
  # A push to main that came through the merge queue does not run them again (`queue-check`, T-129): the queue ran them
  # on that very commit, and `Verify` passed there.
  # Blocking jobs carry a job-level timeout (T-128, tests/ci-timeouts.test.ts): at least 30 minutes and at least 1.8x
  # the longest successful run, capped at 60 minutes. Build once on Linux and share all dist/ directories across gates,
  # account-login, security-invariants, golden-replay and product-subset.
  build:
    name: Build workspace
    needs: [test-selection, queue-check]
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.test-selection.result == 'success' && needs.test-selection.outputs.documentation_mode == 'only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Pass the exact artifact name from the attempt that ran `build`, so `Re-run failed jobs`
      # (which bumps github.run_attempt without re-running a passed `build`) still finds it.
      dist-artifact: ${{ steps.pack.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v6

      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      - name: Build
        run: pnpm build

      - name: Pack build outputs
        id: pack
        run: |
          {
            find . \( -name node_modules -o -name .git \) -prune -o -name dist -type d -prune -print
            for d in apps/local-host/native/materials/bin apps/local-host/native/computer/bin; do
              if [ -d "$d" ]; then printf './%s\n' "$d"; fi
            done
          } | sort -u | tar -cf - -T - | gzip -1 > "$RUNNER_TEMP/dist.tar.gz"
          printf 'artifact-name=ci-dist-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact-name }}
          path: ${{ runner.temp }}/dist.tar.gz
          retention-days: 1
          compression-level: 0

  gates:
    permissions:
      contents: read
      actions: read
    name: Gates
    needs: [test-selection, queue-check, build]
    # Runs whenever `build` succeeded, or on a documentation-only PR/merge-group (where `build` is skipped and only the
    # non-build checks run). Skipped on a push to main already verified by the merge queue.
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && (needs.build.result == 'success' || ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.test-selection.result == 'success' && needs.test-selection.outputs.documentation_mode == 'only')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOLIS_WORK_TEST_JOBS: 4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # In the merge queue, GitHub deletes this entry's branch when it rebuilds the queue or drops the pull request, but does not
      # cancel the run. A run whose branch is gone verifies nothing, so it stops here instead of installing, building and testing
      # (T-129). Only "the branch is gone" (exit 2) stops it; a network error goes on.
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      # Health gates (against the merge-base): numbers that may only go down, packed statements AST gate, spec status lines,
      # document and repository-shape rules, and public API snapshots against tooling/gates/api. Needs no build.
      - name: Health gates (against the merge-base)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/check-health-gates.mjs --base "$base"

      # One product version (docs/releases/POLICY.md): root package, Tauri shell, version constants, release notes and DB version table.
      - name: Release versions agree
        run: node scripts/verify-release-versions.mjs

      # Spec acceptance ids (report only).
      - name: Spec acceptance ids (report only)
        continue-on-error: true
        run: node scripts/check-spec-coverage.mjs

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: ${{ runner.temp }}/dist
        if: ${{ needs.build.result == 'success' }}

      - name: Unpack build outputs
        if: ${{ needs.build.result == 'success' }}
        run: tar -xzf "$RUNNER_TEMP/dist/dist.tar.gz"

      - name: Test durations
        if: ${{ needs.build.result == 'success' }}
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/molis-work-tests
          key: test-durations-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: test-durations-${{ github.job }}-${{ strategy.job-index }}-

      # Boundary rules on the shared build outputs.
      - name: Verify package contracts and boundaries
        if: ${{ needs.build.result == 'success' }}
        run: pnpm boundary:test && node scripts/check-package-boundaries.mjs

      # Route / surface payload budgets (including plugin iframe runtime & /desktop/pty-client.js) + merge-base budget ratchet.
      - name: Page asset budgets (against the merge-base)
        id: page-assets
        if: ${{ needs.build.result == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/gates/page-assets.mjs --base "$base" --output "$RUNNER_TEMP/page-assets/measurement.json"
      - name: Save measured page assets
        if: ${{ needs.build.result == 'success' && steps.page-assets.outputs.artifact != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.page-assets.outputs.artifact }}
          path: ${{ runner.temp }}/page-assets/measurement.json
          retention-days: 30

      # FSS-BG-05: real selected-Home HTTP sampling against first-screen route cold/warm ceilings + merge-base budget ratchet.
      - name: First-screen budgets (against the merge-base)
        id: first-screen
        if: ${{ needs.build.result == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/gates/first-screen.mjs --base "$base" --output "$RUNNER_TEMP/first-screen/measurement.json"
      - name: Save measured first screen
        if: ${{ needs.build.result == 'success' && steps.first-screen.outputs.artifact != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.first-screen.outputs.artifact }}
          path: ${{ runner.temp }}/first-screen/measurement.json
          retention-days: 30

      # Plugin style budget (PG-070, RAC-769): a plugin's own rules do not belong in the shared stylesheets. The gate counts,
      # per plugin, the rule blocks still there although an on-demand sheet could carry them (the first slice's splitter, read
      # from the build across all registered plugins equally). Every number only
      # falls, and a plugin whose page runs in a frame must not appear at all. It is measured from the build the verify step
      # just made, so it comes after it. tooling/gates/plugin-styles.json is compared with the merge-base's copy, so a PR
      # cannot raise a number or add a plugin to the budget by editing that file, only by changing the gate, which is reviewed.
      - name: Plugin style budgets (against the merge-base)
        if: ${{ needs.build.result == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/gates/plugin-styles.mjs --base "$base"

      - name: Typecheck product launchers
        if: ${{ needs.build.result == 'success' }}
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # Batch 100-2: per-file TypeScript diagnostic ratchet for tests/ (new test files start at 0; existing files may only shrink).
      - name: Typecheck tests ratchet (against the merge-base)
        if: ${{ needs.build.result == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/gates/test-typecheck.mjs --base "$base"

      - name: Verify Goal boundaries
        if: ${{ needs.build.result == 'success' }}
        run: |
          node --test tests/goals-query-boundaries.test.mjs tests/goals-storage-boundaries.test.mjs
          node scripts/run-tests.mjs tests/goals-host-no-direct-reads.test.ts

      - name: Build product contracts hold
        if: ${{ needs.build.result == 'success' }}
        run: node scripts/run-tests.mjs tests/dom-events-contract.test.ts tests/storage-baseline.test.ts tests/home-store-baselines.test.ts tests/release-assets.test.ts tests/installer-symlink-dependencies.test.ts tests/shell-page-gate.test.ts tests/artifact-type-gate.test.ts tests/artifact-declaration-gate.test.ts tests/artifact-host-writers.test.ts

      - name: Alchemist plugin tests
        if: ${{ needs.build.result == 'success' }}
        run: pnpm --filter @molis-ai/molis-work-plugin-alchemist test

      - name: Studio Skill replay
        if: ${{ needs.build.result == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          pnpm studio:replay --base "$base"

      # Action directory, Manifest and MCP grant contracts (2 concurrent workers to avoid stdio MCP test contention).
      - name: Action and plugin contracts
        if: ${{ needs.build.result == 'success' }}
        env:
          MOLIS_WORK_TEST_JOBS: 2
        run: pnpm test:contracts

      # These also prove S-19 and S-48. Every code build runs them, including PRs with no other affected gate rule.
      - name: Security invariant gate regressions
        if: ${{ needs.build.result == 'success' }}
        run: node scripts/run-tests.mjs tests/secret-scan.test.ts tests/health-gates-dual-instance.test.ts

      - name: Studio Skill replay rules reject what they claim to
        if: ${{ needs.build.result == 'success' && !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.test-selection.result == 'success' && needs.test-selection.outputs.studio_replay_mode == 'none') }}
        run: node scripts/run-tests.mjs tests/studio-replay.test.ts

  # Gate tool regressions use the same checkout and build as Gates. Verify waits for both.
  gate-rules:
    name: Gate rule regressions
    needs: [test-selection, queue-check, build]
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && (needs.build.result == 'success' || ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.test-selection.result == 'success' && needs.test-selection.outputs.documentation_mode == 'only')) && !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.test-selection.result == 'success' && needs.test-selection.outputs.gate_rules_mode == 'none') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOLIS_WORK_TEST_JOBS: 4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # In the merge queue, GitHub deletes this entry's branch when it rebuilds the queue or drops the pull request, but does not
      # cancel the run. A run whose branch is gone verifies nothing, so it stops here instead of installing, building and testing
      # (T-129). Only "the branch is gone" (exit 2) stops it; a network error goes on.
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: ${{ runner.temp }}/dist
        if: ${{ needs.build.result == 'success' }}

      - name: Unpack build outputs
        if: ${{ needs.build.result == 'success' }}
        run: tar -xzf "$RUNNER_TEMP/dist/dist.tar.gz"

      - name: Gate rules reject what they claim to
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/gate-node-cache
          SELECTED_GATE_TESTS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.test-selection.result == 'success' && needs.test-selection.outputs.gate_rules_mode == 'some' && needs.test-selection.outputs.gate_rule_files || '' }}
        run: node scripts/run-tests.mjs --gate-rules "$SELECTED_GATE_TESTS"

  # No dependencies and no build: it reads git history only, so it starts at once and is cheap to keep on every change.
  secret-scan:
    name: Secret scan
    needs: [queue-check]
    # Skipped only on a push to main that `queue-check` found verified by the merge queue: it succeeded and said true. On any other
    # event, or when it failed or said anything else (whatever it wrote before failing), this runs as it always did.
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # The scan reads every commit the change adds since its merge base with the target branch, so it needs the history
      # and not a depth-1 clone.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # In the merge queue, GitHub deletes this entry's branch when it rebuilds the queue or drops the pull request, but does not
      # cancel the run. A run whose branch is gone verifies nothing, so it stops here instead of installing, building and testing
      # (T-129). Only "the branch is gone" (exit 2) stops it; a network error goes on.
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0

      # API keys, GitHub/Slack tokens, AWS keys, private keys, JWTs and `api_key|secret|password|token = "…"` literals in
      # the lines this change adds. Known test fixtures are listed in tooling/gates/secret-allowlist.txt, each with a reason.
      # Pull request: since its base branch tip. Merge queue: since the queue's base. Push to main: since the tip before the push.
      # Manual run: the whole tree.
      - name: No credentials in the commits this change adds
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/check-secrets.mjs --all
          else
            node scripts/check-secrets.mjs
          fi

  # Static checks for what is not TypeScript (specs/archive/repository-anti-corruption W1-09, scripts/gates/native-checks.mjs): rustfmt and
  # clippy with every warning an error, the crate's tests, and a type check of the Swift. Needs macOS because the Rust crate is the macOS desktop
  # shell. Nothing here installs Node dependencies: the script and its tests use Node alone. RUSTUP_TOOLCHAIN pins the Rust the
  # code was cleaned against: clippy gains lints with every release, and `-D warnings` on "stable" would turn each release into a
  # red build. Moving the pin is a deliberate change (clean the new warnings in the same PR).
  native-checks:
    name: Rust and Swift checks
    needs: [test-selection, queue-check]
    # Skipped in two cases only. A push to main that `queue-check` found verified by the merge queue: it succeeded and said true. And a
    # pull request or merge queue entry whose `test-selection` succeeded and said `none`: no changed file is one these checks read
    # (scripts/ci-test-selection.mjs, NATIVE_RUN_WHEN; 用户 2026-11-04: GitHub's macOS runners could not be had for 40 minutes). On any
    # other event, or when a job failed or said anything else (whatever it wrote before failing), this runs as it always did.
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.test-selection.result != 'success' || needs.test-selection.outputs.native_mode != 'none') }}
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@v6

      # In the merge queue, GitHub deletes this entry's branch when it rebuilds the queue or drops the pull request, but does not
      # cancel the run. A run whose branch is gone verifies nothing, so it stops here instead of installing, building and testing
      # (T-129). Only "the branch is gone" (exit 2) stops it; a network error goes on.
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown

      # The key names what the cache holds: since cargo test runs here, the dependencies built with code, not only clippy's
      # metadata. rust-cache does not save again on an exact hit, so without a new key the clippy-only cache saved earlier kept
      # being restored and the test build was redone every run (about 80 s; 统筹 10-18 定).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/sync-worker
            server
          key: with-tests

      # Each check is broken once on a scratch repository and must go red (the shell cases use a stand-in for shellcheck here).
      - name: Native check rules reject what they claim to
        run: node --test tests/native-checks.test.mjs

      # cargo test runs the crate's tests (the S-14 refusals among them, apps/desktop/adapters/tauri/src/drop_wheel.rs), not only
      # compiles them as clippy --all-targets does (统筹 10-18 定).
      - name: rustfmt, clippy and cargo test
        run: node scripts/gates/native-checks.mjs rust

      - name: Swift type check
        run: node scripts/gates/native-checks.mjs swift

      # The SwiftPM package (jelly-whisper) has swift-tools-version 6.2, which needs Xcode 26, and a cold build takes about seven
      # minutes. It is reported but does not decide anything until a runner with that Swift is confirmed; then drop
      # continue-on-error. Until then only the JellyMaterial.swift type check above blocks a merge, so a compile error in the
      # package does not turn CI red. The follow-up is specs/BACKLOG.md BL-122.
      - name: Swift package build (jelly-whisper, not required yet)
        continue-on-error: true
        run: node scripts/gates/native-checks.mjs swift --package

  shell-checks:
    name: Shell and Python checks
    needs: [test-selection, queue-check]
    # Reuse a verified push, or skip only with a successful explicit scope decision on PR / merge group.
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.test-selection.result == 'success' && needs.test-selection.outputs.shell_mode == 'none') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # In the merge queue, GitHub deletes this entry's branch when it rebuilds the queue or drops the pull request, but does not
      # cancel the run. A run whose branch is gone verifies nothing, so it stops here instead of installing, building and testing
      # (T-129). Only "the branch is gone" (exit 2) stops it; a network error goes on.
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0

      # shellcheck ships on the GitHub ubuntu runners. Warnings and errors fail; style notes do not.
      - name: shellcheck on every tracked shell script
        run: node scripts/gates/native-checks.mjs shell

      # Every tracked Python file has to parse (none today); python3 is on the runner.
      - name: Python files parse
        run: node scripts/gates/native-checks.mjs python

      - name: Shell and Python check rules reject what they claim to
        run: node --test --test-name-pattern='^(shell|python):' tests/native-checks.test.mjs

  account-login:
    name: P1 login contract and regression
    needs: [test-selection, queue-check, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && !((github.event_name == 'pull_request' || (github.event_name == 'merge_group' && needs.test-selection.outputs.documentation_mode == 'only')) && needs.test-selection.result == 'success' && needs.test-selection.outputs.account_login_mode == 'none') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Read immutable Auth source
        id: auth
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const metadata = JSON.parse(readFileSync('horizontal/account/src/upstream/provenance.json'));
          const revision = metadata.sourceBaseCommit;
          if (!/^[a-f0-9]{40}$/.test(revision)) throw Error('Auth revision must be an immutable SHA');
          appendFileSync(process.env.GITHUB_OUTPUT, `revision=${revision}\n`);
          NODE
      - uses: actions/checkout@v6
        with:
          repository: molis-ai/auth
          ref: ${{ steps.auth.outputs.revision }}
          path: .claude/auth-ci
          persist-credentials: false
      - name: Verify contract source, version, hashes and generated types
        run: node .claude/auth-ci/contracts/unified-account/verify-product.mjs work "$GITHUB_WORKSPACE"
      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8
      # The upstream Auth commit SHA is immutable, so the built WASM worker and its npm dependencies are deterministic per revision.
      - name: Cache Auth WASM fixture
        id: auth-fixture-cache
        uses: actions/cache@v4
        with:
          path: |
            .claude/auth-ci/worker/rust/build
            .claude/auth-ci/worker/node_modules
          key: auth-fixture-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.auth.outputs.revision }}
      - uses: ./.claude/auth-ci/.github/actions/account-fixture
        if: ${{ steps.auth-fixture-cache.outputs.cache-hit != 'true' }}
        with:
          source: .claude/auth-ci
      - name: Chrome for the browser files
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "no Chrome on this runner"; exit 1; }
          "$chrome" --version
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "MOLIS_WORK_TEST_CHROME=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"
          echo "MOLIS_WORK_BROWSER_PATH=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"

      # The pages are Chinese first and the layout tests measure Chinese text; the runner image has no CJK font, so without one a
      # page that does not load the product's own Chinese face (a test page from a file) has no real glyphs and wraps differently
      # from a development machine. WenQuanYi, because the product's font stack does not name it: a font it names before the
      # bundled Inter (Noto Sans CJK SC) would also take over Latin text and change its width.
      - name: CJK font for the browser files
        run: |
          # Keep the runner's signed repositories first. If their mirror cannot be reached,
          # install the same font from Ubuntu's signed Kernel.org mirror using isolated apt lists.
          if ! sudo apt-get update -qq || ! sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei; then
            # The runner supplies this standard Ubuntu file.
            # shellcheck source=/dev/null
            . /etc/os-release
            font_apt="$(mktemp -d /tmp/molis-font-apt.XXXXXX)"
            mkdir -p "$font_apt/lists/partial"
            chmod 755 "$font_apt" "$font_apt/lists" "$font_apt/lists/partial"
            sudo chown _apt:root "$font_apt/lists/partial"
            printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu %s universe\n' \
              "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security" > "$font_apt/sources.list"
            font_options=(-o "Dir::Etc::sourcelist=$font_apt/sources.list" -o "Dir::Etc::sourceparts=-"
              -o "Dir::State::lists=$font_apt/lists" -o Acquire::Retries=2 -o Acquire::ForceIPv4=true)
            sudo apt-get "${font_options[@]}" update -qq
            sudo apt-get "${font_options[@]}" install -y -qq --no-install-recommends fonts-wqy-zenhei
          fi
          fc-list :lang=zh family | sort -u

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: ${{ runner.temp }}/dist

      - name: Unpack build outputs
        run: tar -xzf "$RUNNER_TEMP/dist/dist.tar.gz"
      - name: Authentication and installation isolation
        run: |
          export MOLIS_AUTH_SOURCE="$GITHUB_WORKSPACE/.claude/auth-ci"
          node scripts/account-authentication.test.mjs
          node scripts/account-provider.test.mjs
          node scripts/account-installation.test.mjs
          node scripts/central-account.test.mjs
      - name: Cache Auth web build
        id: auth-web-cache
        uses: actions/cache@v4
        with:
          path: .claude/auth-ci/web/dist
          key: auth-web-dist-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.auth.outputs.revision }}
      - name: Build Auth web fixture
        if: ${{ steps.auth-web-cache.outputs.cache-hit != 'true' }}
        run: |
          npm --prefix .claude/auth-ci/web ci
          npm --prefix .claude/auth-ci/web run build
      - name: Auth web browser regression
        run: MOLIS_WORK_SOURCE="$GITHUB_WORKSPACE" node .claude/auth-ci/web/scripts/v2-browser.test.mjs

  verify:
    name: Verify
    # `queue-check` is not a check: it only lets a push to main that the merge queue already verified pass here (the last step).
    needs: [build, account-login, gates, gate-rules, secret-scan, native-checks, shell-checks, security-invariants, product-subset, golden-replay, golden-replay-third-party, queue-check, test-selection]
    if: ${{ always() }}
    # Keep this job name while `Verify` is required by main branch protection and the merge queue.
    # The full product suite runs in .github/workflows/full-suite.yml (sharded, on demand and nightly) and locally; the consolidated gates job, secret scan, Rust/Swift/shell checks, account login, security invariants, product subset and golden replay run here.
    runs-on: ubuntu-latest
    steps:
      # The base this run's health gates and secret scan compared with, in the step's name so the GitHub API returns it (T-129): in
      # the merge queue the group's base. `queue-check` on the push that follows reuses this run only when it is the push's `before`.
      - name: Merge queue base ${{ github.event.merge_group.base_sha || 'none' }}
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: echo "Compared with ${BASE:-no merge queue base (not a merge group)}."

      - name: Required package gate passed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          ACCOUNT_LOGIN_RESULT: ${{ needs.account-login.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          GATE_RULES_RESULT: ${{ needs.gate-rules.result }}
          GATE_RULES_MODE: ${{ needs.test-selection.outputs.gate_rules_mode }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          NATIVE_CHECKS_RESULT: ${{ needs.native-checks.result }}
          SHELL_CHECKS_RESULT: ${{ needs.shell-checks.result }}
          SECURITY_INVARIANTS_RESULT: ${{ needs.security-invariants.result }}
          PRODUCT_SUBSET_RESULT: ${{ needs.product-subset.result }}
          GOLDEN_REPLAY_RESULT: ${{ needs.golden-replay.result }}
          GOLDEN_REPLAY_THIRD_PARTY_RESULT: ${{ needs.golden-replay-third-party.result }}
          TEST_SELECTION_RESULT: ${{ needs.test-selection.result }}
          SECURITY_MODE: ${{ needs.test-selection.outputs.security_mode }}
          PRODUCT_MODE: ${{ needs.test-selection.outputs.product_mode }}
          NATIVE_MODE: ${{ needs.test-selection.outputs.native_mode }}
          GOLDEN_THIRD_PARTY_MODE: ${{ needs.test-selection.outputs.golden_third_party_mode }}
          DOCUMENTATION_MODE: ${{ needs.test-selection.outputs.documentation_mode }}
          SHELL_MODE: ${{ needs.test-selection.outputs.shell_mode }}
          ACCOUNT_LOGIN_MODE: ${{ needs.test-selection.outputs.account_login_mode }}
          QUEUE_CHECK_RESULT: ${{ needs.queue-check.result }}
          QUEUE_VERIFIED: ${{ needs.queue-check.outputs.verified }}
          QUEUE_RUN_URL: ${{ needs.queue-check.outputs.run_url }}
        # Reuse only the trusted push the queue verified. Otherwise each actual result must succeed or have an explicit
        # successful scope decision authorizing its skip. Failed or stale selector outputs never waive an actual check.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$QUEUE_CHECK_RESULT" = "success" ] && [ "$QUEUE_VERIFIED" = "true" ]; then
            echo "This commit passed Verify in the merge queue ($QUEUE_RUN_URL); the blocking jobs were not run again."
            exit 0
          fi
          # CIP-03: a failure or cancellation is never a permitted skip.
          selected_skip() {
            test "$GITHUB_EVENT_NAME" = "pull_request" || test "$GITHUB_EVENT_NAME" = "merge_group" || return 1
            test "$TEST_SELECTION_RESULT" = "success" && test "$1" = "$2" && test "$3" = "skipped"
          }
          test "$BUILD_RESULT" = "success" || selected_skip "$DOCUMENTATION_MODE" only "$BUILD_RESULT"
          if [ "$ACCOUNT_LOGIN_RESULT" != "success" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request" || test "$DOCUMENTATION_MODE" = "only"
            selected_skip "$ACCOUNT_LOGIN_MODE" none "$ACCOUNT_LOGIN_RESULT"
          fi
          test "$GATES_RESULT" = "success"
          test "$GATE_RULES_RESULT" = "success" || selected_skip "$GATE_RULES_MODE" none "$GATE_RULES_RESULT"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$SHELL_CHECKS_RESULT" = "success" || selected_skip "$SHELL_MODE" none "$SHELL_CHECKS_RESULT"
          test "$NATIVE_CHECKS_RESULT" = "success" || selected_skip "$NATIVE_MODE" none "$NATIVE_CHECKS_RESULT"
          test "$GOLDEN_REPLAY_RESULT" = "success" || selected_skip "$DOCUMENTATION_MODE" only "$GOLDEN_REPLAY_RESULT"
          test "$GOLDEN_REPLAY_THIRD_PARTY_RESULT" = "success" || selected_skip "$GOLDEN_THIRD_PARTY_MODE" none "$GOLDEN_REPLAY_THIRD_PARTY_RESULT"
          if [ "$SECURITY_INVARIANTS_RESULT" != "success" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request" || test "$DOCUMENTATION_MODE" = "only"
            selected_skip "$SECURITY_MODE" none "$SECURITY_INVARIANTS_RESULT"
          fi
          if [ "$PRODUCT_SUBSET_RESULT" != "success" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request" || test "$DOCUMENTATION_MODE" = "only"
            selected_skip "$PRODUCT_MODE" none "$PRODUCT_SUBSET_RESULT"
          fi
          echo "All required checks passed; any skipped checks were authorized by this change selection."

  # CIP-01/02: one selector for PRs and whole merge groups; failures retain complete checks.
  # Only successful explicit output permits a skip. Non-document merge groups still run the complete runtime lists.
  test-selection:
    name: Change and test selection
    # PR and the entire merge group. Only ordinary-document groups skip runtime checks.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      security_mode: ${{ steps.select.outputs.security_mode }}
      security_shards: ${{ steps.select.outputs.security_shards }}
      security_files: ${{ steps.select.outputs.security_files }}
      product_mode: ${{ steps.select.outputs.product_mode }}
      product_shards: ${{ steps.select.outputs.product_shards }}
      product_only: ${{ steps.select.outputs.product_only }}
      native_mode: ${{ steps.select.outputs.native_mode }}
      golden_third_party_mode: ${{ steps.select.outputs.golden_third_party_mode }}
      golden_history_mode: ${{ steps.select.outputs.golden_history_mode }}
      documentation_mode: ${{ steps.select.outputs.documentation_mode }}
      gate_rules_mode: ${{ steps.select.outputs.gate_rules_mode }}
      gate_rule_files: ${{ steps.select.outputs.gate_rule_files }}
      shell_mode: ${{ steps.select.outputs.shell_mode }}
      studio_replay_mode: ${{ steps.select.outputs.studio_replay_mode }}
      account_login_mode: ${{ steps.select.outputs.account_login_mode }}
    steps:
      # The merge commit GitHub builds and its two parents: HEAD^1 is the base branch as merged, so the change is exactly the pull request's.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0

      # Node built-ins only, no install. It exits 0 with `whole` when anything goes wrong; if it still fails, the two jobs do not read
      # what it wrote and run the whole list, so a broken selection runs more, never less.
      - name: Select the files this change touches
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/ci-test-selection.mjs --base "$base"

  # Security invariants (docs/system/SECURITY-INVARIANTS.md; specs/archive/repository-anti-corruption §4.18): each one has a test that asserts the
  # refusal itself: a foreign Host, Origin, token or key; a socket without the token; an
  # address that is not public; a path that leaves its directory; a secret that comes back out; a hostile text that is not data; a desktop
  # capability that widens. The real web host and the real launcher are started on loopback; the Seatbelt sandbox cases need macOS and
  # run locally (the document lists which). The table's own rule (every row names tests that exist) runs in the health gates.
  # Blocking (decision #14): after its observation period, one of Verify's required test results.
  # CIP-06: eight independent runners, four test workers and one browser slot each. PR selections can use fewer runners.
  # Whole lists and failed selections use all eight; only successful documentation-only groups skip runtime checks.
  security-invariants:
    name: Security invariants (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [test-selection, queue-check, build]
    # A push skips only when the queue verified it. PR none and pure-document merge groups may skip after a successful selection.
    # !cancelled() lets this job run when the auxiliary jobs were skipped or failed.
    if: ${{ !cancelled() && needs.build.result == 'success' && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && !((github.event_name == 'pull_request' || (github.event_name == 'merge_group' && needs.test-selection.outputs.documentation_mode == 'only')) && needs.test-selection.result == 'success' && needs.test-selection.outputs.security_mode == 'none') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.security_mode == 'some' && needs.test-selection.outputs.security_shards || '[1, 2, 3, 4, 5, 6, 7, 8]') }}
    env:
      MOLIS_WORK_TEST_JOBS: 4
      MOLIS_WORK_TEST_BROWSER_JOBS: 1
    steps:
      - uses: actions/checkout@v6

      # In the merge queue, GitHub deletes this entry's branch when it rebuilds the queue or drops the pull request, but does not
      # cancel the run. A run whose branch is gone verifies nothing, so it stops here instead of installing, building and testing
      # (T-129). Only "the branch is gone" (exit 2) stops it; a network error goes on.
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      - name: Test durations
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/molis-work-tests
          key: test-durations-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: test-durations-${{ github.job }}-${{ strategy.job-index }}-

      # SYS-15-F3 exercises real desktop terminals; the shared build archive includes dist/web/pty-client.js.
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: ${{ runner.temp }}/dist

      - name: Unpack build outputs
        run: tar -xzf "$RUNNER_TEMP/dist/dist.tar.gz"

      # The files `test-selection` chose on a pull request, or (empty: not a pull request) every file of `test:security`.
      # A file that fails is run once more at once (one retry, as the full suite and the product subset do); one that then passes
      # is listed as flaky in the runner's summary and does not fail the job, so a timing flake no longer drops a group out of the
      # merge queue (user 2026-11-14, decision 44: about 10 of 39 failed merge-queue runs in a week were the IUI-02 Linux flake).
      # A file that fails twice still fails; the flaky list is the evidence to fix it.
      - name: Security invariants
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/security-node-cache
          SELECTED: ${{ github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.security_mode == 'some' && needs.test-selection.outputs.security_files || '' }}
        run: |
          if [ -n "$SELECTED" ]; then
            read -r -a files <<< "$SELECTED"
            node scripts/run-tests.mjs --shard ${{ matrix.shard }}/${{ strategy.job-total }} --retries 1 "${files[@]}"
          else
            pnpm test:security --shard ${{ matrix.shard }}/${{ strategy.job-total }} --retries 1
          fi

  # Decision #14 (specs/archive/repository-anti-corruption), step 2 of W2-16: the user-flow part of the product suite runs in CI. The files are
  # listed in tests/ci-product-subset.txt (fast files that passed on Linux in the probe above, the main flow of each product area, the
  # i18n test and 5 browser smokes); the flaky ones are in tests/quarantine.json, each with an owner and an end date.
  # It ran as an information job for about two weeks from its first run on main (green 250 of 250 times on main from 2026-10-24) and
  # is one of `verify`'s needs since (decision #14, user 2026-10-31). The required check is still `Verify` alone, so the repository
  # settings were not touched.
  # Time: the job was meant to stay about as long as the blocking check (then about 20 minutes, now about 10 since it was split into
  # parallel jobs). Four non-browser files at a time on these 4-core runners (user 2026-10-14, raised from 2 while the job did not
  # blocked merges, to observe whether the load made any file flaky). Install and build about 2 minutes, the browser smokes within 8, the other files within 15, and the job is stopped at 35. No attempt
  # (a first run or a retry) starts after its budget, so the worst case is 2 + 8 + a 4 minute smoke attempt + 15 + a 4 minute attempt = 33
  # minutes, inside the 35 (tests/ci-product-subset.test.ts works this out from the arguments below).
  # The runner stops starting files when a budget is used up and fails the run for the files it did not reach; the summary shows how
  # much of each budget was used and which files are slowest. This workflow cancels a run when a newer push arrives; the runner
  # writes its report on that signal, and the upload below is `if: always()`.
  # Golden Homes (specs/upgrade-continuity/golden-replay-design.md §4, §5, 用户 2026-11-07): each golden restored, opened by this build, read, written to and restarted, so
  # a change that would leave an older Home unopenable does not merge. Linux runs everything but the signed samples, whose sandbox exists only on macOS; the job's summary
  # and a notice on the run say those did not run and that this is not a pass for them (scripts/ci-golden-replay.mjs). Skipped on ordinary-document changes only.
  golden-replay:
    name: Golden Home replay
    needs: [test-selection, queue-check, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.test-selection.result == 'success' && needs.test-selection.outputs.documentation_mode == 'only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # In the merge queue, GitHub deletes this entry's branch when it rebuilds the queue or drops the pull request, but does not
      # cancel the run. A run whose branch is gone verifies nothing, so it stops here instead of installing, building and testing
      # (T-129). Only "the branch is gone" (exit 2) stops it; a network error goes on.
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: ${{ runner.temp }}/dist

      - name: Unpack build outputs
        run: tar -xzf "$RUNNER_TEMP/dist/dist.tar.gz"

      # The latest three, or every golden when the Prologue package changed or the selection gave no clean answer (UPG-11).
      - name: Replay the golden Homes
        env:
          HISTORY: ${{ needs.test-selection.result == 'success' && needs.test-selection.outputs.golden_history_mode || 'all' }}
        run: |
          set --
          if [ "$HISTORY" != "latest" ]; then set -- --all; fi
          node scripts/ci-golden-replay.mjs "$@"

  # The same replay on macOS, signed samples included, when a change touches what they run on (scripts/ci-test-selection.mjs, GOLDEN_THIRD_PARTY_RUN_WHEN); what the list
  # leaves out is caught by .github/workflows/golden-replay-nightly.yml. Skipped only on a successful `none` of a pull request or a merge queue entry, like native-checks.
  golden-replay-third-party:
    name: Golden Home replay with the signed samples (macOS)
    needs: [test-selection, queue-check]
    if: ${{ !cancelled() && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.test-selection.result != 'success' || needs.test-selection.outputs.golden_third_party_mode != 'none') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # In the merge queue, GitHub deletes this entry's branch when it rebuilds the queue or drops the pull request, but does not
      # cancel the run. A run whose branch is gone verifies nothing, so it stops here instead of installing, building and testing
      # (T-129). Only "the branch is gone" (exit 2) stops it; a network error goes on.
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      - name: Build
        env:
          # Golden replay never runs Whisper audio transcription; skipping WhisperKit saves ~3.5 minutes on macOS.
          MOLIS_WORK_SKIP_NATIVE_WHISPER_BUILD: "1"
        run: pnpm build

      # The latest three, or every golden when the Prologue package changed or the selection gave no clean answer (UPG-11).
      - name: Replay the golden Homes
        env:
          HISTORY: ${{ needs.test-selection.result == 'success' && needs.test-selection.outputs.golden_history_mode || 'all' }}
        run: |
          set --
          if [ "$HISTORY" != "latest" ]; then set -- --all; fi
          node scripts/ci-golden-replay.mjs "$@"

  # Six disjoint shards cover the same full list once, dealt out by duration and serial browser capacity (tests/ci-shard-weights.json; with every
  # second file the legs took 2527 s and 1336 s of test time in run 42023765782); each keeps the phase/attempt limits above.
  # fail-fast is off so one failed shard does not hide the other shard's results.
  # Non-document merge groups run the full list on six shards. PR some runs selected files; whole or a selector fault runs
  # all complete shards; only successful none skips. Direct pushes, nightly and manual runs also run the full list.
  # A trusted queue-verified push reuses that result, as the other required jobs do.
  product-subset:
    name: Product subset (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [test-selection, queue-check, build]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.product_mode == 'some' && needs.test-selection.outputs.product_shards || '[1, 2, 3, 4, 5, 6]') }}
    # The same condition as `security-invariants`, with this job's mode.
    if: ${{ !cancelled() && needs.build.result == 'success' && !(github.event_name == 'push' && needs.queue-check.result == 'success' && needs.queue-check.outputs.verified == 'true') && !((github.event_name == 'pull_request' || (github.event_name == 'merge_group' && needs.test-selection.outputs.documentation_mode == 'only')) && needs.test-selection.result == 'success' && needs.test-selection.outputs.product_mode == 'none') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      # In the merge queue, GitHub deletes this entry's branch when it rebuilds the queue or drops the pull request, but does not
      # cancel the run. A run whose branch is gone verifies nothing, so it stops here instead of installing, building and testing
      # (T-129). Only "the branch is gone" (exit 2) stops it; a network error goes on.
      - name: Queue entry still exists
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          status=0
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null || status=$?
          if [ "$status" = 2 ]; then echo "::error::$GITHUB_REF no longer exists: the merge queue rebuilt or dropped this entry"; exit 1; fi

      - name: Setup Node, pnpm and dependencies
        uses: ./.github/actions/setup-work
        timeout-minutes: 8

      # The tests import the built workspace packages and dist/; unpack the shared build from `build`.
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.dist-artifact }}
          path: ${{ runner.temp }}/dist

      - name: Unpack build outputs
        run: tar -xzf "$RUNNER_TEMP/dist/dist.tar.gz"

      # The browser smokes drive the Chrome that the ubuntu image has (the tests' own Chrome locator also looks at /usr/bin/google-chrome
      # on its own). The wrapper adds --no-sandbox, which a runner whose kernel restricts unprivileged user namespaces needs; the pages
      # are the ones the tests serve from localhost. Without a Chrome the smokes would skip, and a skipped smoke fails the run.
      - name: Chrome for the browser smokes
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "no Chrome on this runner"; exit 1; }
          "$chrome" --version
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "MOLIS_WORK_TEST_CHROME=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"

      # `exec` makes the runner the step's own process: the SIGINT/SIGTERM of a cancel then reach it and not only the shell around it.
      # ONLY is the files `test-selection` chose on a pull request as one anchored regular expression; empty (not a pull request) runs
      # the list.
      - name: Run the product subset
        env:
          ONLY: ${{ github.event_name == 'pull_request' && needs.test-selection.result == 'success' && needs.test-selection.outputs.product_mode == 'some' && needs.test-selection.outputs.product_only || '' }}
        run: |
          set --
          if [ -n "$ONLY" ]; then set -- --only "$ONLY"; fi
          exec node scripts/ci-product-subset.mjs --expect-platform linux "$@" --shard ${{ matrix.shard }}/${{ strategy.job-total }} --out "$RUNNER_TEMP/product-subset" --jobs 4 --timeout-seconds 180 --browser-timeout-seconds 240 --retries 1 --budget-minutes 15 --browser-budget-minutes 8

      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-subset-${{ matrix.shard }}
          path: ${{ runner.temp }}/product-subset
          retention-days: 30
          if-no-files-found: warn
