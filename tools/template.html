<title>Molis Work 需求全景图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

/* 层次靠纵深：等待的批次贴在桌面上，可领和进行中的浮起来，做完的退回桌面 */
:root{
  --desk:#f5f4f1;--paper:#fff;--soft:#f3f2ee;--track:#e9e7e2;--ink:#1b1c1f;--ink-soft:#3f4247;--muted:#676b72;

  --up:#2f5ac4;--up-soft:#edf1fb;--down:#94630a;--down-soft:#f9f2e2;--green:#2c7a55;--green-soft:#e6f3ec;
  --sh-1:0 0 0 1px rgba(28,26,20,.07),0 1px 2px rgba(40,34,22,.05),inset 0 1px 0 rgba(255,255,255,.9);
  --sh-2:0 0 0 1px rgba(28,26,20,.07),0 1px 2px rgba(40,34,22,.05),0 8px 20px -10px rgba(40,34,22,.16),inset 0 1px 0 rgba(255,255,255,.9);
  --sh-3:0 2px 4px rgba(40,34,22,.06),0 20px 40px -14px rgba(40,34,22,.26);
  --sh-panel:-1px 0 0 rgba(28,26,20,.07),-24px 0 48px -24px rgba(40,34,22,.2);
  --grain-opacity:.5;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101114;--paper:#1c1e22;--soft:#23262b;--track:#26292e;--ink:#f2f3f5;--ink-soft:#d3d6db;--muted:#a2a7af;
  --line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.24);--action:#92b2ff;--action-rgb:146,178,255;--action-ink:#10131a;
  --up:#92b2ff;--up-soft:#222c44;--down:#e6c183;--down-soft:#352c1a;--green:#86d0a8;--green-soft:#1c3328;
  --sh-1:0 0 0 1px rgba(255,255,255,.09),0 1px 2px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
  --sh-2:0 0 0 1px rgba(255,255,255,.11),0 1px 2px rgba(0,0,0,.45),0 10px 22px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
  --sh-3:0 2px 4px rgba(0,0,0,.4),0 24px 44px -14px rgba(0,0,0,.8);
  --sh-panel:-1px 0 0 rgba(255,255,255,.08),-24px 0 48px -24px rgba(0,0,0,.75);
  --grain-opacity:.22;color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#101114;--paper:#1c1e22;--soft:#23262b;--track:#26292e;--ink:#f2f3f5;--ink-soft:#d3d6db;--muted:#a2a7af;
  --line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.24);--action:#92b2ff;--action-rgb:146,178,255;--action-ink:#10131a;
  --up:#92b2ff;--up-soft:#222c44;--down:#e6c183;--down-soft:#352c1a;--green:#86d0a8;--green-soft:#1c3328;
  --sh-1:0 0 0 1px rgba(255,255,255,.09),0 1px 2px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
  --sh-2:0 0 0 1px rgba(255,255,255,.11),0 1px 2px rgba(0,0,0,.45),0 10px 22px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
  --sh-3:0 2px 4px rgba(0,0,0,.4),0 24px 44px -14px rgba(0,0,0,.8);
  --sh-panel:-1px 0 0 rgba(255,255,255,.08),-24px 0 48px -24px rgba(0,0,0,.75);

html,body{height:100%}

.items{gap:0!important}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.item:last-child{padding-bottom:0}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tag{flex:none;font-size:11px;font-weight:560;padding:0 6px;border-radius:5px;background:var(--soft);color:var(--muted);line-height:18px}
.tag.doing{background:var(--up-soft);color:var(--up)}.tag.done{background:var(--green-soft);color:var(--green)}.tag.pause{background:var(--down-soft);color:var(--down)}
.item-meta{margin-top:3px;font-size:12px;color:var(--muted)}
.item-meta a{color:var(--up);text-decoration:none}.item-meta a:hover{text-decoration:underline}.item-meta code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.item-d{margin-top:5px;font-size:12px;line-height:1.6;color:var(--ink-soft)}

.chip .mark{vertical-align:1px}
.rel{display:none;font-size:11px;font-weight:560}
.mark{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;border:1px solid var(--line-strong);box-sizing:border-box}
.mark.open{border:2px solid var(--action)}
.mark.doing{background:var(--up);border-color:var(--up)}
.mark.pause{background:var(--down);border-color:var(--down)}
.mark.busy{border-style:dashed;border-color:var(--muted)}
.mark.done{width:11px;height:11px;background:var(--green);border:0}
.mark.done::after{content:'';position:absolute;left:3.5px;top:2px;width:3px;height:5px;border:solid var(--paper);border-width:0 1.2px 1.2px 0;transform:rotate(42deg)}
.focus .card{opacity:.32;box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.focus .card[data-rel]{opacity:1}
.focus .card.far{opacity:.8}
.focus .card[data-rel=up]{background:linear-gradient(180deg,var(--up-soft),var(--paper) 70%);box-shadow:0 0 0 1px rgba(var(--action-rgb),.45),0 8px 18px -12px rgba(var(--action-rgb),.4)}
.focus .card[data-rel=down]{background:linear-gradient(180deg,var(--down-soft),var(--paper) 70%);box-shadow:0 0 0 1px var(--line-strong),0 8px 18px -12px rgba(40,34,22,.3)}
.card[data-rel=up] .rel{display:inline;color:var(--up)}
.card[data-rel=down] .rel{display:inline;color:var(--down)}
.card[data-rel] .name{color:var(--ink)}
.focus .card[data-rel=self]{background:var(--paper);box-shadow:0 0 0 1.5px var(--ink),var(--sh-3);transform:translateY(-2px);opacity:1}
.search-on .card:not(.hit){opacity:.26}
.search-on .card.hit{background:var(--paper);box-shadow:0 0 0 1px var(--ink),var(--sh-2)}
.detail{position:relative;z-index:2;width:0;overflow:hidden;background:var(--paper);transition:width .26s var(--ease)}
.detail.on{width:408px;box-shadow:var(--sh-panel)}
.inner{width:408px;box-sizing:border-box;height:100%;overflow-y:auto;padding:18px 22px 32px}
.inner>*{animation:rise .3s var(--ease) both}
.inner>*:nth-child(2){animation-delay:.03s}.inner>*:nth-child(3){animation-delay:.06s}.inner>*:nth-child(4){animation-delay:.09s}.inner>*:nth-child(n+5){animation-delay:.12s}
.d-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);gap:8px;font-size:12px}
.close{border:0;background:transparent;width:28px;height:28px;border-radius:7px;font-size:17px;line-height:1;cursor:pointer;color:var(--muted);transition:background .14s,color .14s}
.close:hover{background:var(--soft);color:var(--ink)}
.detail h3{margin:4px 0 8px;font-size:19px;line-height:1.32;font-weight:640;letter-spacing:-.012em;text-wrap:balance}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.d-sec{margin-top:22px}

.chips{display:flex;flex-direction:column;gap:2px}

.chip:hover{background:var(--soft)}
.chip:active{background:var(--track)}

.chain h4.u{color:var(--up)}.chain h4.d{color:var(--down)}

.links{display:flex;gap:14px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.links a{color:var(--up);text-decoration:none}.links a:hover{text-decoration:underline}
.foot{position:sticky;left:0;width:max-content;max-width:min(680px,88vw);margin-top:32px;color:var(--muted);font-size:11.5px;line-height:1.6}
/* 放不下时图例和更新时间退到第二行 */
@media (max-width:1340px){.spacer{order:5;flex-basis:100%;height:0;margin-top:-10px}.counts{order:6}.src{order:7}.search{margin-left:auto}}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card:hover,.card:active,.tab:active,.focus .card[data-rel=self]{transform:none}}
</style>
<div class="app">
  <header class="top">
    <h1>需求全景图</h1>
    <nav class="tabs" id="tabs" role="tablist" aria-label="按阶段查看"></nav>
    <span class="spacer"></span>
    <div class="counts" id="counts"></div>
    <input class="search" id="search" type="search" placeholder="搜编号或名称" aria-label="搜编号或名称"><button class="theme" id="theme" type="button"></button>
  </header>
  <div class="body">
    <main class="board" id="board"><svg class="lines" id="lines" aria-hidden="true"><defs>
      <marker id="au" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--up)"/></marker>
      <marker id="ad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--down)"/></marker>
    </defs><g id="paths"></g></svg><div id="stages"></div><p class="foot" id="foot"></p></main>

  </div>
</div>
<script>
// 主题：默认跟随系统，点过就记住。放在最前面，首屏就是对的颜色
const THEME_KEY='molis-theme';
const rootEl=document.documentElement;
const setTheme=v=>{rootEl.dataset.theme=v;rootEl.style.colorScheme=v};
try{const v=localStorage.getItem(THEME_KEY);if(v==='light'||v==='dark')setTheme(v)}catch(e){}
const D=/*DATA*/null;
const STAGES=[['0','阶段 0','收口'],['1','阶段 1','基础路径与共同设计'],['2','阶段 2','个人工作完整可用'],['3','阶段 3','持续工作与创作'],['4','阶段 4','复杂场景与最终收口'],['S','服务端批','开工时间另定，01～89 不等它']];
const STATUS={wait:'等前置',busy:'等轨道',open:'可领',doing:'已认领',pause:'暂停',done:'已完成'};
const OPTIONAL_STATUS=new Set(['busy','pause']);
const REPO='https://github.com/molis-ai/molis-work';
const ITEM_TONE={'已合入':'done','已认领':'doing','定样中':'doing','实施中':'doing','待评审':'doing','暂停':'pause'};
const BOARD_RAW='https://raw.githubusercontent.com/molis-ai/molis-work/board-data/board.json';
const PEOPLE={yijunw0212:'WYJ','jingxusandra-gif':'果',Edison9489:'Edison',binarytom:'Tom',seed47:'Seed',guo1120:'Guo','black-2000':'Black',zhuanghaozhe:'ZHZ',Alicindy0202:'Cindy','gedneychevasxo944-sketch':'Gedney',zhaozhuangshi:'ZZS'};
const trackFam=t=>/^C/.test(t)?'C':t;
const TRACK_NAMES={A:'助理与输入',B:'Coding',C:'合同、运行时与服务',C1:'合同与 SDK',C2:'AI 运行时',C3:'平台新服务',D:'外观与语言',E:'插件',F:'场景引导与发布',G:'服务端'};
const tracksOf=b=>[...new Set(b.items.map(i=>i.track))].filter(t=>TRACK_NAMES[t]);
const claimable=i=>i.s==='待认领'||i.s==='放弃';
const BOARD_API='https://api.github.com/repos/molis-ai/molis-work/issues/1743';

const ACTIVE=new Set(['已认领','定样中','实施中','待评审']);

// 认领标签：Agent-账号缩写-本机/云端。格式写明就照写；旧写法「Claude（本机）」的人名来自生成时的编辑历史
function claimTag(i){
  const m=i.who.match(/^([^-（(·\s]+)-([^（(·\s]+?)-(本机|云端)/);
  if(m)return `${m[1]}-${shortName(m[2])}-${m[3]}`;
  const agent=i.who.split(/[（(·\s]/)[0];
  const place=/云/.test(i.who)?'云端':/本机/.test(i.who)?'本机':'';
  return [agent,i.login&&loginName(i.login),place].filter(Boolean).join('-');
}
// 认领板正文 -> 每项进展 -> 每批状态。页面只有这一份算法，内嵌快照和线上读到的都走它
function applyBoard(md){
  const rows={};let cur=null;
  md.split(/\r?\n/).forEach(l=>{
    if(!l.startsWith('|')||/^\|\s*(---|批次\s)/.test(l))return;
    const c=(' '+l.trim().slice(1,-1)+' ').split(/\s\|\s/).map(x=>x.trim());
    if(c.length!==6)return;
    if(c[0])cur=c[0];
    (rows[cur]=rows[cur]||[]).push(c);
  });
  boardOff=0;
  D.batches.forEach(b=>{
    const rs=rows[b.id]||[];
    if(rs.length!==b.items.length)boardOff++;
    b.items.forEach((it,i)=>{
      const r=rs[i]||['','','','','待认领',''];
      const name=(r[1].match(/\[([^\]]+)\]/)||[])[1]||r[1];
      if(rs[i]&&name!==it.t)boardOff++;
      it.s=BASES.find(k=>r[4].startsWith(k))||r[4];
      it.note=r[4].slice(it.s.length).replace(/^[（(\s]+|[）)\s]+$/g,'');
      it.who=r[2];it.date=r[5];it.login=D.claimers[`${b.id}-${i+1}`]||'';
      it.prs=[...r[3].matchAll(/#(\d+)/g)].map(m=>m[1]);
      it.branch=(r[3].match(/`([^`]+)`/)||[])[1]||'';
    });
  });
  const nodeItems=n=>n.items.map(i=>byId[n.owner].items[i]);
  const nodes={};D.batches.forEach(b=>b.nodes.forEach(n=>{n.owner=b.id;nodes[n.id]=n}));
  const done=id=>nodeItems(nodes[id]).every(i=>i.s==='已合入');
  D.batches.forEach(b=>{
    const its=b.items;
    b.merged=its.filter(i=>i.s==='已合入').length;
    b.unlocked=b.nodes.filter(n=>!done(n.id)&&n.hard.every(done)).flatMap(nodeItems).filter(claimable);
    b.undone=[...new Set(b.nodes.filter(n=>nodeItems(n).some(i=>ACTIVE.has(i.s))).flatMap(n=>n.hard).filter(h=>!done(h)&&nodes[h].owner!==b.id))];
    b.ready=[];b.waitTrack=[];D.state[b.id]=b.merged===its.length?'done':'';
  });
  // 主轨道上有人在写实现，同轨道其他实现项要等；C1～C3 在决定 17 之前算一条
  const busy={};
  D.batches.forEach(b=>b.items.forEach(i=>{if(i.occ&&ACTIVE.has(i.s))(busy[trackFam(i.track)]=busy[trackFam(i.track)]||new Set()).add(b.id)}));
  D.batches.forEach(b=>{
    if(D.state[b.id])return;
    const its=b.items;
    b.ready=[...new Set(b.unlocked)].filter(i=>!(i.occ&&busy[trackFam(i.track)]));
    b.waitTrack=[...new Set(b.unlocked)].filter(i=>i.occ&&busy[trackFam(i.track)]).map(i=>({i,track:trackFam(i.track),by:[...busy[trackFam(i.track)]]}));
    D.state[b.id]=its.some(i=>ACTIVE.has(i.s))?'doing':b.ready.length?'open':its.some(i=>i.s==='暂停')?'pause':b.waitTrack.length?'busy':'wait';
  });
}

const reach=(id,adj)=>{const s=new Set(),st=[...adj[id]];while(st.length){const x=st.pop();if(!s.has(x)){s.add(x);st.push(...adj[x])}}return s};
// 阶段内：最长路径定列，父节点平均位置定列内顺序，让相连的卡尽量靠近
function layout(stage){
  const own=D.batches.filter(b=>b.stage===stage),set=new Set(own.map(b=>b.id)),mem={};
  const lv=id=>mem[id]??(mem[id]=1+Math.max(-1,...byId[id].pre.filter(p=>set.has(p)).map(lv)));
  own.forEach(b=>lv(b.id));
  const max=Math.max(0,...Object.values(mem));
  if(set.has('89'))mem['89']=max+(max>0&&own.some(b=>b.id!=='89'&&mem[b.id]===max)?1:0);
  const cols=[];own.forEach(b=>(cols[mem[b.id]]=cols[mem[b.id]]||[]).push(b.id));
  const pos={};cols.forEach(c=>c.forEach((id,i)=>pos[id]=i));
  for(let pass=0;pass<6;pass++){
    const bary=(id,adj)=>{const n=[...adj[id]].filter(x=>set.has(x));return n.length?n.reduce((a,x)=>a+pos[x],0)/n.length:pos[id]};
    const list=pass%2?[...cols].reverse():cols;
    list.forEach(c=>{if(!c)return;c.sort((a,b)=>bary(a,pass%2?down:up)-bary(b,pass%2?down:up));c.forEach((id,i)=>pos[id]=i)});
  }
  return cols.filter(Boolean);
}

}

}
let boardBody=D.board,boardRead=0;
// 未带令牌的接口按出口 IP 限额，代理的出口常被别人用完；隔几秒再试，常能换到另一个出口
const getJson=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error(String(r.status));return r.json()};
async function readBoard(attempt=0){
  boardRead=Date.now();
  // Action 写的静态文件不受接口限额影响，但有几分钟缓存；接口更新，读得到就用更新的那份
  const got=(await Promise.allSettled([getJson(BOARD_RAW,{cache:'no-cache'}),getJson(BOARD_API,{headers:{Accept:'application/vnd.github+json'}})])).filter(r=>r.status==='fulfilled').map(r=>r.value);
  if(!got.length){
    if(attempt<2){setTimeout(()=>readBoard(attempt+1),attempt?8000:3000);return}
    boardFailed=true;renderSource();return;
  }
  boardFailed=false;
  const j=got.reduce((a,x)=>x.updated_at>a.updated_at?x:a);
  const who=got.find(x=>x.claimers);
  const whoChanged=who&&JSON.stringify(who.claimers)!==JSON.stringify(D.claimers);
  if(whoChanged)D.claimers=who.claimers;
  if(j.updated_at>=boardAt)boardAt=j.updated_at;
  const fresh=j.updated_at>=D.boardAt&&j.body!==boardBody;
  if(fresh)boardBody=j.body;
  if(fresh||whoChanged){applyBoard(boardBody);repaint()}
  try{localStorage.setItem(BOARD_KEY,JSON.stringify({body:boardBody,at:boardAt,claimers:D.claimers}))}catch(e){}
  renderSource();
}
readBoard();
// 没带令牌的 GitHub 接口每个 IP 每小时 60 次，切回页面时最多 5 分钟读一次
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-boardRead>3e5)readBoard()});
const h=location.hash.match(/^#b(.+)$/);if(h&&byId[h[1]])select(h[1]);
</script>
