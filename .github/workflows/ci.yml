name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # The merge queue of main (docs/system/PARALLEL-DEVELOPMENT.md §3): GitHub builds each queued pull request on top of main and the
  # pull requests ahead of it, and merges it when `Verify` passes on that commit. A pull request no longer has to be brought up to date
  # with main by hand before it merges.
  merge_group:
  workflow_dispatch:
  # Nightly on main, for the Linux probe (it runs only on this and on a manual run, see the job); the other jobs run too.
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

# The nightly run has its own group, so a merge to main at night does not cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The blocking checks are jobs that run side by side and all feed `verify`, each about five minutes: `gates` and
  # `health-gate-rules` need no build (the contracts package alone, for one gate test), `architecture-boundaries` and
  # `action-contracts` each build the workspace and run what needs the build. Each `node scripts/run-tests.mjs` with several files runs them a few at a time, each
  # file with its own MOLIS_WORK_HOME (scripts/run-tests/pool.mjs, docs/system/PARALLEL-DEVELOPMENT.md §5); MOLIS_WORK_TEST_JOBS
  # sets how many on these 4-core runners. The runner starts the files that took longest last time first, from the durations it
  # keeps in node_modules/.cache/molis-work-tests; the "Test durations" step carries that file from run to run (a job of main's
  # runs seeds a pull request's), so a four-minute file does not start last.
  gates:
    name: Gates
    runs-on: ubuntu-latest
    env:
      MOLIS_WORK_TEST_JOBS: 4
    steps:
      - uses: actions/checkout@v6
        with:
          # Two commits: on a pull request that is the merge commit GitHub builds and its two parents, on a push the new tip
          # and its parent. The health gates below need the commit to compare with, not the whole history; when the
          # shallow clone lacks it, scripts/ci-health-base.mjs fetches it (and deepens only as far as needed).
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      # The version is the root package.json "packageManager" (pnpm@x.y.z), so local, CI and release use one pin.
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        # node-gyp compiles node-pty (no linux-x64 prebuilt) and takes its headers from the Node actions/setup-node installed
        # instead of fetching them from nodejs.org (that fetch hung on 2026-10-28; tests/ci-install.test.ts holds this). A step
        # that hangs fails in minutes, not in the six-hour default.
        timeout-minutes: 5
        run: |
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          pnpm install --frozen-lockfile

      # Numbers that may only go down (giant units, tests reaching into package internals, vendored SDK packages, in-place schema
      # patches, compatibility markers, empty catch blocks, `as unknown as` casts, old names, conflicting translations, the
      # structure numbers of scripts/gates/ and docs/system/PACKAGE-BOUNDARIES.md §6, the Biome static checks), a status line on
      # every spec, the document and repository-shape rules (scripts/gates/README.md), and a list that never changes silently: the
      # public API of the contracts package and the plugin SDK against tooling/gates/api (specs/repository-anti-corruption §5a).
      # The head and the merge-base are both measured here by the same script and compared, so rewriting
      # tooling/gates/baseline.json in a PR cannot hide growth, and nothing in a PR can raise a number except changing the gate
      # itself (script, limits.json, this step), which is reviewed. tooling/gates/giant-exceptions.json admits nothing new.
      # The comparison commit: on a pull request, HEAD is the merge commit GitHub builds (refs/pull/N/merge), so it is the
      # merged result against the base branch as it was merged (HEAD^1); on a push to main it is the previous tip; in the merge
      # queue it is the queue's base (merge_group.base_sha, passed as PUSH_BEFORE).
      # scripts/ci-health-base.mjs picks it and fetches it when the shallow checkout lacks it. Nothing here needs the build.
      - name: Health gates (against the merge-base)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/check-health-gates.mjs --base "$base"

      # One product version (docs/releases/POLICY.md): the root package, the Tauri shell and the two version strings in
      # code agree, workspace packages stay private 0.0.0, the current version has release notes and a CHANGELOG
      # section, and the per-database version table in docs/releases/CHECKLIST.md is the one the code has.
      - name: Release versions agree
        run: node scripts/verify-release-versions.mjs

      # Spec acceptance ids (specs/README.md 「验收编号」, specs/repository-anti-corruption §4.8, W2-14): which criteria of the
      # specs in progress carry an id, and which of those ids a test cites. Report only: the script exits 0 whatever it finds,
      # and `continue-on-error` keeps this step from turning the build red even if the script were to crash (a crash on this
      # repository's own content is still caught by tests/health-gates-spec-coverage.test.ts in the next step, which runs the
      # case "on this repository the report prints and exits 0"). Once the specs in progress are numbered and the report lists
      # no problem, add `--strict` and drop `continue-on-error`.
      - name: Spec acceptance ids (report only)
        continue-on-error: true
        run: node scripts/check-spec-coverage.mjs

      - name: Test durations
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/molis-work-tests
          key: test-durations-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: test-durations-${{ github.job }}-${{ strategy.job-index }}-

      # Every gate above, and the runners and scanners of this workflow, is mutation-verified on a scratch repository: one
      # violation added on a branch fails, and so does the same branch after `--update` rewrote the baseline (the package
      # inventory; translations; release versions; the document and repository-shape rules; vendored package records; the numeric
      # health gates are in `health-gate-rules`); a planted key is caught by the secret scan (the secret-scan job has no
      # dependencies installed, so its rules are tested here); the Linux probe and the product subset runners keep their rules
      # (they only report, or do not block yet: their own jobs below), and so does the parallel test runner every step here uses
      # (scripts/run-tests/pool.mjs: caps, one Home per file, a failing file shown); the Cursor Skill links hold.
      - name: Gate rules reject what they claim to
        run: node scripts/run-tests.mjs tests/doc-reference-gates.test.ts tests/translation-check.test.ts tests/package-inventory-gate.test.ts tests/vendor-provenance.test.ts tests/verify-release-versions.test.ts tests/secret-scan.test.ts tests/ci-install.test.ts tests/ci-linux-probe.test.ts tests/ci-product-subset.test.ts tests/ci-product-subset-plan.test.ts tests/run-tests-pool.test.ts tests/cursor-skill-links.test.ts

  # The health gates' own rules (scripts/check-health-gates.mjs and scripts/gates/): each one is broken once on a scratch repository
  # and must go red, and so must the same branch after `--update` rewrote the baseline. The glob takes every
  # tests/health-gates-*.test.ts, so a new gate's test needs no edit here. Together they are the longest set, and each file already
  # keeps more than one core busy (Biome, the TypeScript program of the API snapshot), so they are spread over two runners: each leg
  # takes every second file of the same list (`--shard`), which gives every file to exactly one leg.
  health-gate-rules:
    name: Health gate rules (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      MOLIS_WORK_TEST_JOBS: 4
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        # node-gyp compiles node-pty (no linux-x64 prebuilt) and takes its headers from the Node actions/setup-node installed
        # instead of fetching them from nodejs.org (that fetch hung on 2026-10-28; tests/ci-install.test.ts holds this). A step
        # that hangs fails in minutes, not in the six-hour default.
        timeout-minutes: 5
        run: |
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          pnpm install --frozen-lockfile

      # tests/health-gates-errors.test.ts reads the error codes of the built contracts package; nothing else here needs a build.
      - name: Build the contracts package
        run: pnpm --filter @molis-ai/molis-work-contracts run build

      - name: Test durations
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/molis-work-tests
          key: test-durations-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: test-durations-${{ github.job }}-${{ strategy.job-index }}-

      - name: Health gates reject what they claim to
        run: node scripts/run-tests.mjs --shard ${{ matrix.shard }}/2 tests/health-gates-*.test.ts

  architecture-boundaries:
    name: Package boundaries
    runs-on: ubuntu-latest
    env:
      MOLIS_WORK_TEST_JOBS: 4
    steps:
      - uses: actions/checkout@v6
        with:
          # The page asset budgets and the studio replay compare with the merge-base, as the health gates do (see `gates`).
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        # node-gyp compiles node-pty (no linux-x64 prebuilt) and takes its headers from the Node actions/setup-node installed
        # instead of fetching them from nodejs.org (that fetch hung on 2026-10-28; tests/ci-install.test.ts holds this). A step
        # that hangs fails in minutes, not in the six-hour default.
        timeout-minutes: 5
        run: |
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          pnpm install --frozen-lockfile

      - name: Test durations
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/molis-work-tests
          key: test-durations-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: test-durations-${{ github.job }}-${{ strategy.job-index }}-

      # Boundary rules, then every workspace package built (`tsc` of each package also type-checks it, so a type error fails here).
      - name: Verify package contracts and boundaries
        run: pnpm workspace:verify

      # Page resource budget (specs/repository-anti-corruption §4.8/§4.13, decision #17): every asset the host sends under
      # /assets/ (the three stylesheets, the workbench client scripts, the Pages editor, the plugin client packs, the fonts)
      # is frozen at its current size and may only fall. It is measured from the build the step above just made, so it must
      # come after it. tooling/gates/page-assets.json is compared with the merge-base's copy (the one the health gates
      # use): a PR cannot raise a number, add an asset or delete the entry of an asset the host still sends by editing that
      # file, only by changing the gate, which is reviewed. The routes are read from web-assets.ts, and every path either
      # budget names is also asked of the built host, so a refactor that hides a route from the reading cannot unmeasure it.
      - name: Page asset budgets (against the merge-base)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/gates/page-assets.mjs --base "$base"

      # Plugin style budget (PG-070, RAC-769): a plugin's own rules do not belong in the shared stylesheets. The gate counts,
      # per plugin, the rule blocks still there although an on-demand sheet could carry them (the first slice's splitter, read
      # from the build; Goals' document styles, which page-assets imports straight into the shared sheets). Every number only
      # falls, and a plugin whose page runs in a frame must not appear at all. It is measured from the build the verify step
      # just made, so it comes after it. tooling/gates/plugin-styles.json is compared with the merge-base's copy, so a PR
      # cannot raise a number or add a plugin to the budget by editing that file, only by changing the gate, which is reviewed.
      - name: Plugin style budgets (against the merge-base)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          node scripts/gates/plugin-styles.mjs --base "$base"

      - name: Typecheck product launchers
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # The last test is the frozen list of the Host's holders of Goals' coordinator and tables (PG094-06): it needs no build, only the
      # tracked sources, and it counts per file, so it runs on every pull request, not only in the full suite.
      - name: Verify Goal boundaries
        run: |
          node --test tests/goals-query-boundaries.test.mjs tests/goals-storage-boundaries.test.mjs
          node scripts/run-tests.mjs tests/goals-host-no-direct-reads.test.ts

      # Rules that read the build, each mutation-verified or asserted on the built host: the page asset budget rules (a grown
      # asset, a new asset, a raised budget, a slack left unlowered, a missing build and the laundering moves each fail; a route
      # spelled as a regular expression other than the plugin pack pattern is refused, except one that splits the word `assets`
      # itself, which the header of the script and spec §5a list as a limit); the page-event registry
      # (packages/contracts/src/platform/dom-events.ts, scripts/gates/dom-events.mjs); storage baselines and release assets; one
      # workbench shell (no standalone pages); 成果 types have owner previews, writes match Manifests, process items stay out of
      # user lists.
      - name: Build rules reject what they claim to
        run: node scripts/run-tests.mjs tests/page-assets-budget.test.ts tests/plugin-styles-gate.test.ts tests/dom-events-contract.test.ts tests/storage-baseline.test.ts tests/home-store-baselines.test.ts tests/release-assets.test.ts tests/installer-symlink-dependencies.test.ts tests/shell-page-gate.test.ts tests/artifact-type-gate.test.ts tests/artifact-declaration-gate.test.ts tests/artifact-host-writers.test.ts

      # The Alchemist plugin brings its own vitest suite (studio services and contracts); about a second.
      - name: Alchemist plugin tests
        run: pnpm --filter @molis-ai/molis-work-plugin-alchemist test

      # The studio's corpus of designer answers (a hand-written seed, 380 real answers exported on 2026-10-08 from a read-only copy of the user's Home
      # and reviewed for personal data as specs/repository-anti-corruption/spec.md §1 decided, and 3 real first proposals) through the host's design checks
      # (docs/platform/STUDIO-SKILL-REPLAY.md): what the baseline says was accepted is still accepted, and every entry it records,
      # accepted or refused, is still in the corpus with the answer it had. Also against the baseline at the merge-base of HEAD and the commit scripts/ci-health-base.mjs prints
      # (the base branch as merged, on a pull request), so rewriting the baseline file, or rewriting or deleting corpus entries,
      # cannot hide a regression; every baseline row carries the digest of its answer, and `live` is accepted for the prompt
      # example alone. Then the replay's own rules, failing on a scratch copy that breaks them. The generation smoke needs a model
      # and is run by hand on an isolated Home.
      - name: Studio Skill replay
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          base="$(node scripts/ci-health-base.mjs)"
          pnpm studio:replay --base "$base"
          node scripts/run-tests.mjs tests/studio-replay.test.ts

  # Action directory, Manifest and MCP grant contracts, and undeclared names in the assembled Workbench client, on a workspace build
  # of their own (the same packages `pnpm workspace:verify` builds), beside `architecture-boundaries` so neither waits for the other.
  # Several of these files start real hosts and MCP servers under a per-test time limit (tests/action-mcp-stdio.test.ts: three servers
  # in 20 seconds, 5.5 s alone), and four at a time on one 4-core runner pushed that past its limit. So two legs, two files at a time
  # each: every second file of the list (`--shard`), each file in exactly one leg. The full product suite still runs locally.
  action-contracts:
    name: Action and plugin contracts (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      MOLIS_WORK_TEST_JOBS: 2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        # node-gyp compiles node-pty (no linux-x64 prebuilt) and takes its headers from the Node actions/setup-node installed
        # instead of fetching them from nodejs.org (that fetch hung on 2026-10-28; tests/ci-install.test.ts holds this). A step
        # that hangs fails in minutes, not in the six-hour default.
        timeout-minutes: 5
        run: |
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          pnpm install --frozen-lockfile

      - name: Test durations
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/molis-work-tests
          key: test-durations-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: test-durations-${{ github.job }}-${{ strategy.job-index }}-

      - name: Build
        run: pnpm workspace:build

      - name: Action and plugin contracts
        run: pnpm test:contracts --shard ${{ matrix.shard }}/2

  # No dependencies and no build: it reads git history only, so it starts at once and is cheap to keep on every change.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # The scan reads every commit the change adds since its merge base with the target branch, so it needs the history
      # and not a depth-1 clone.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      # API keys, GitHub/Slack tokens, AWS keys, private keys, JWTs and `api_key|secret|password|token = "…"` literals in
      # the lines this change adds. Known test fixtures are listed in tooling/gates/secret-allowlist.txt, each with a reason.
      # Pull request: since its base branch tip. Merge queue: since the queue's base. Push to main: since the tip before the push.
      # Manual run: the whole tree.
      - name: No credentials in the commits this change adds
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/check-secrets.mjs --all
          else
            node scripts/check-secrets.mjs
          fi

  # Static checks for what is not TypeScript (specs/repository-anti-corruption W1-09, scripts/gates/native-checks.mjs): rustfmt and
  # clippy with every warning an error, the crate's tests, and a type check of the Swift. Needs macOS because the Rust crate is the macOS desktop
  # shell. Nothing here installs Node dependencies: the script and its tests use Node alone. RUSTUP_TOOLCHAIN pins the Rust the
  # code was cleaned against: clippy gains lints with every release, and `-D warnings` on "stable" would turn each release into a
  # red build. Moving the pin is a deliberate change (clean the new warnings in the same PR).
  native-checks:
    name: Rust and Swift checks
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      # The key names what the cache holds: since cargo test runs here, the dependencies built with code, not only clippy's
      # metadata. rust-cache does not save again on an exact hit, so without a new key the clippy-only cache saved earlier kept
      # being restored and the test build was redone every run (about 80 s; 统筹 10-18 定).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: with-tests

      # Each check is broken once on a scratch repository and must go red (the shell cases use a stand-in for shellcheck here).
      - name: Native check rules reject what they claim to
        run: node --test tests/native-checks.test.mjs

      # cargo test runs the crate's tests (the S-14 refusals among them, apps/desktop/adapters/tauri/src/drop_wheel.rs), not only
      # compiles them as clippy --all-targets does (统筹 10-18 定).
      - name: rustfmt, clippy and cargo test
        run: node scripts/gates/native-checks.mjs rust

      - name: Swift type check
        run: node scripts/gates/native-checks.mjs swift

      # The SwiftPM package (jelly-whisper) has swift-tools-version 6.2, which needs Xcode 26, and a cold build takes about seven
      # minutes. It is reported but does not decide anything until a runner with that Swift is confirmed; then drop
      # continue-on-error. Until then only the JellyMaterial.swift type check above blocks a merge, so a compile error in the
      # package does not turn CI red. The follow-up is specs/BACKLOG.md BL-122.
      - name: Swift package build (jelly-whisper, not required yet)
        continue-on-error: true
        run: node scripts/gates/native-checks.mjs swift --package

  shell-checks:
    name: Shell and Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      # shellcheck ships on the GitHub ubuntu runners. Warnings and errors fail; style notes do not.
      - name: shellcheck on every tracked shell script
        run: node scripts/gates/native-checks.mjs shell

      # Every tracked Python file has to parse (none today); python3 is on the runner.
      - name: Python files parse
        run: node scripts/gates/native-checks.mjs python

      - name: Shell and Python check rules reject what they claim to
        run: node --test --test-name-pattern='^(shell|python):' tests/native-checks.test.mjs

  verify:
    name: Verify
    needs: [gates, health-gate-rules, architecture-boundaries, action-contracts, secret-scan, native-checks, shell-checks]
    if: ${{ always() }}
    # Keep this job name while `Verify` is required by main branch protection and the merge queue.
    # The full product suite runs in .github/workflows/full-suite.yml (sharded, on demand and nightly) and locally; the gates, package boundaries, the contract subset, the secret scan and the Rust, Swift and shell checks run here.
    runs-on: ubuntu-latest
    steps:
      - name: Required package gate passed
        env:
          GATES_RESULT: ${{ needs.gates.result }}
          HEALTH_GATE_RULES_RESULT: ${{ needs.health-gate-rules.result }}
          PACKAGE_BOUNDARIES_RESULT: ${{ needs.architecture-boundaries.result }}
          ACTION_CONTRACTS_RESULT: ${{ needs.action-contracts.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          NATIVE_CHECKS_RESULT: ${{ needs.native-checks.result }}
          SHELL_CHECKS_RESULT: ${{ needs.shell-checks.result }}
        run: |
          test "$GATES_RESULT" = "success"
          test "$HEALTH_GATE_RULES_RESULT" = "success"
          test "$PACKAGE_BOUNDARIES_RESULT" = "success"
          test "$ACTION_CONTRACTS_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$NATIVE_CHECKS_RESULT" = "success"
          test "$SHELL_CHECKS_RESULT" = "success"
          echo "Gates, health gate rules, package boundary, Contract, typecheck, build, action contract, secret scan, Rust, Swift and shell verification passed."

  # Security invariants (docs/system/SECURITY-INVARIANTS.md; specs/repository-anti-corruption §4.18): each one has a test that asserts the
  # refusal itself: a foreign Host, Origin, token or key; a socket without the token; an
  # address that is not public; a path that leaves its directory; a secret that comes back out; a hostile text that is not data; a desktop
  # capability that widens. The real web host and the real launcher are started on loopback; the Seatbelt sandbox cases need macOS and
  # run locally (the document lists which). The table's own rule (every row names tests that exist) runs in the health gates.
  # Not blocking yet (decision #14: product tests do not block a merge until about two weeks of linux-probe runs and quarantine, W2-16):
  # the set includes product tests, and the six security-invariants-* files had never run on Linux when they were added. Its own job, so
  # it never lengthens the blocking ones: NOT in `verify`'s needs, and `continue-on-error` keeps a red run from marking the workflow red.
  # To make it block: add `security-invariants` to `verify`'s needs (and its result to the final step), drop `continue-on-error` and
  # "(not required yet)" from the name, when the probe has shown these files green for two weeks.
  # Two legs, two files at a time each, as `action-contracts`: several files start a served Home and MCP callers under a per-test time
  # limit, and four at a time on one 4-core runner pushed tests/mcp-scene-effect-authority.test.ts from about 20 s to 22-36 s against
  # its 30 s limit (half the runs on main failed). Every second file of the list (`--shard`), each file in exactly one leg.
  security-invariants:
    name: Security invariants (not required yet) (${{ matrix.shard }}/2)
    # Not in the merge queue: it decides nothing there, and the queue waits only for `Verify`.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      MOLIS_WORK_TEST_JOBS: 2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        # node-gyp compiles node-pty (no linux-x64 prebuilt) and takes its headers from the Node actions/setup-node installed
        # instead of fetching them from nodejs.org (that fetch hung on 2026-10-28; tests/ci-install.test.ts holds this). A step
        # that hangs fails in minutes, not in the six-hour default.
        timeout-minutes: 5
        run: |
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          pnpm install --frozen-lockfile

      - name: Test durations
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/molis-work-tests
          key: test-durations-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: test-durations-${{ github.job }}-${{ strategy.job-index }}-

      # SYS-15-F3 exercises real desktop terminals; workspace:build alone omits dist/web/pty-client.js.
      - name: Build
        run: pnpm build

      - name: Security invariants
        run: pnpm test:security --shard ${{ matrix.shard }}/2

  # Decision #14 (specs/repository-anti-corruption): which test files pass on Linux is not known yet (some touch macOS-only
  # paths: Seatbelt, Keychain, launchctl, Swift helpers), so the non-browser suite runs here as an information job and does
  # not decide anything.
  # It is deliberately NOT in `verify`'s needs and `continue-on-error` keeps a red run from marking the workflow red; branch
  # protection is untouched. scripts/ci-linux-probe.mjs runs the test files one at a time (one MOLIS_WORK_HOME each, two at a
  # time, one retry for a failure), marks each file darwin / live / browser from its own source, and leaves report.json,
  # pass.txt and summary.md (also in this run's summary). A test file that fails is a result, not an error of the job.
  # This workflow cancels a run when a newer push to the same pull request or to main arrives (concurrency above), and a run
  # of about 100 minutes meets that often. The probe rewrites its three files after every file and, on the SIGINT/SIGTERM a
  # cancel or the time limit sends, stops the running tests and writes a final partial report (unfinished files are `not-run`,
  # `endedBy` says why); the upload step below is `if: always()`, so a cancelled run still keeps what it had.
  # The probe stays an information job. What its first run showed became tests/ci-product-subset.txt (W2-16), run by the
  # `product-subset` job below, which is the one that joins Verify.
  # One job no longer reaches every file (R-58, user 2026-10-26): the manual run 40219623393 spent its 85 minutes before the last 44
  # files started, so the list is spread over six jobs (`--shard k/6`, every sixth runnable file of the sorted list; the six
  # `linux-probe-k` artifacts together hold each file once). Each job installs uv, which the managed Python installer test
  # (connector-managed-install, ASC-06/17) runs for real, at the version and action pin full-suite.yml uses.
  # It runs nightly on main and when started by hand (workflow_dispatch), not on every push (user 2026-10-14): an hour of runner
  # on each push decided nothing, and on main the next merge usually cancelled it.
  linux-probe:
    name: Linux probe ${{ matrix.shard }}/6 (not required)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # The probe stops starting files after 85 minutes and still writes its report; this is the hard stop around it. Reaching it
    # cancels the job like a newer push does, and the probe writes its partial report on that signal.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      # The version is the root package.json "packageManager", the pin the other jobs use.
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        # node-gyp compiles node-pty (no linux-x64 prebuilt) and takes its headers from the Node actions/setup-node installed
        # instead of fetching them from nodejs.org (that fetch hung on 2026-10-28; tests/ci-install.test.ts holds this). A step
        # that hangs fails in minutes, not in the six-hour default.
        timeout-minutes: 5
        run: |
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          pnpm install --frozen-lockfile

      # ASC-06/17: the managed Python MCP test runs real uv against a local package registry (the same pin as full-suite.yml).
      - name: uv for the managed Python installer tests
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: false

      # The tests import the built workspace packages and dist/; a full build, as `pnpm test` does before the suite.
      - name: Build
        run: pnpm build

      # `exec` makes the probe the step's own process: the SIGINT/SIGTERM of a cancel then reach it and not only the shell around it.
      - name: Run this shard's non-browser test files and record which pass
        run: exec node scripts/ci-linux-probe.mjs --expect-platform linux --out "$RUNNER_TEMP/linux-probe" --jobs 2 --timeout-seconds 600 --retries 1 --budget-minutes 85 --shard ${{ matrix.shard }}/6

      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-probe-${{ matrix.shard }}
          path: ${{ runner.temp }}/linux-probe
          retention-days: 30
          if-no-files-found: warn

  # Decision #14 (specs/repository-anti-corruption), step 2 of W2-16: the user-flow part of the product suite runs in CI. The files are
  # listed in tests/ci-product-subset.txt (fast files that passed on Linux in the probe above, the main flow of each product area, the
  # i18n test and 5 browser smokes); the flaky ones are in tests/quarantine.json, each with an owner and an end date.
  # For about two weeks from its first run on main it is an information job like the probe: NOT in `verify`'s needs,
  # `continue-on-error` keeps a red run from marking the workflow red, branch protection is untouched. At the end of that time, with the
  # flaky files quarantined: add `product-subset` to `verify`'s needs (and its result to the two lines of the final step), drop
  # `continue-on-error`, take "(not required yet)" out of the name, and change the one test in tests/ci-product-subset.test.ts that
  # pins this state (the first of its two ci.yml cases). Joining Verify keeps the required check `Verify` as it is, so the repository
  # settings are not touched.
  # Time: the job was meant to stay about as long as the blocking check (then about 20 minutes, now about 10 since it was split into
  # parallel jobs), so it never lengthens the check. Four non-browser files at a time on these 4-core runners (user 2026-10-14, raised
  # from 2 while the job does not block yet, to see whether the load makes any file flaky before it joins). Install and build about 2 minutes, the browser smokes within 8, the other files within 15, and the job is stopped at 35. No attempt
  # (a first run or a retry) starts after its budget, so the worst case is 2 + 8 + a 4 minute smoke attempt + 15 + a 4 minute attempt = 33
  # minutes, inside the 35 (tests/ci-product-subset.test.ts works this out from the arguments below).
  # The runner stops starting files when a budget is used up and fails the run for the files it did not reach; the summary shows how
  # much of each budget was used and which files are slowest. This workflow cancels a run when a newer push arrives; the runner
  # writes its report on that signal, and the upload below is `if: always()`.
  # Two disjoint shards cover the same full list once; each keeps the phase/attempt limits above.
  # fail-fast is off so one failed shard does not hide the other shard's results.
  product-subset:
    name: Product subset (not required yet, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Not in the merge queue: it decides nothing there, and the queue waits only for `Verify`.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      # The version is the root package.json "packageManager", the pin the other jobs use.
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        # node-gyp compiles node-pty (no linux-x64 prebuilt) and takes its headers from the Node actions/setup-node installed
        # instead of fetching them from nodejs.org (that fetch hung on 2026-10-28; tests/ci-install.test.ts holds this). A step
        # that hangs fails in minutes, not in the six-hour default.
        timeout-minutes: 5
        run: |
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          pnpm install --frozen-lockfile

      # The tests import the built workspace packages and dist/; the same full build the probe makes.
      - name: Build
        run: pnpm build

      # The browser smokes drive the Chrome that the ubuntu image has (the tests' own Chrome locator also looks at /usr/bin/google-chrome
      # on its own). The wrapper adds --no-sandbox, which a runner whose kernel restricts unprivileged user namespaces needs; the pages
      # are the ones the tests serve from localhost. Without a Chrome the smokes would skip, and a skipped smoke fails the run.
      - name: Chrome for the browser smokes
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "no Chrome on this runner"; exit 1; }
          "$chrome" --version
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome-ci"
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "MOLIS_WORK_TEST_CHROME=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"

      # `exec` makes the runner the step's own process: the SIGINT/SIGTERM of a cancel then reach it and not only the shell around it.
      - name: Run the product subset
        run: exec node scripts/ci-product-subset.mjs --expect-platform linux --shard ${{ matrix.shard }}/2 --out "$RUNNER_TEMP/product-subset" --jobs 4 --timeout-seconds 180 --browser-timeout-seconds 240 --retries 1 --budget-minutes 15 --browser-budget-minutes 8

      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-subset-${{ matrix.shard }}
          path: ${{ runner.temp }}/product-subset
          retention-days: 30
          if-no-files-found: warn
